<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工具箱</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0a0f1e;
  --line:rgba(255,255,255,.09);
  --text:#e8edf7;
  --muted:#93a0ba;
  --acc1:#6d7cff;
  --acc2:#2dd4bf;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(1100px 520px at 12% -10%, rgba(109,124,255,.26), transparent 60%),
    radial-gradient(900px 480px at 105% 0%, rgba(45,212,191,.17), transparent 55%),
    radial-gradient(700px 600px at 50% 120%, rgba(167,139,250,.13), transparent 60%),
    linear-gradient(160deg,#0a0f1e 0%,#0c1427 55%,#0a0f1e 100%);
  background-attachment:fixed;
}
.wrap{max-width:1020px;margin:0 auto;padding:56px 22px 80px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;
  background:linear-gradient(135deg,#6d7cff,#2dd4bf);box-shadow:0 14px 34px rgba(109,124,255,.4)}
h1{margin:0;font-size:30px;letter-spacing:1px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
h2.sec{font-size:15px;color:#b8c4da;letter-spacing:3px;margin:0 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tool{
  display:flex;gap:16px;padding:22px;border-radius:20px;text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border:1px solid var(--line);backdrop-filter:blur(8px);
  box-shadow:0 18px 42px rgba(0,0,0,.26);transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease;
}
.tool:hover{transform:translateY(-4px);border-color:rgba(109,124,255,.55);box-shadow:0 24px 52px rgba(109,124,255,.24)}
.t-icon{width:58px;height:58px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:27px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.t-info{flex:1;min-width:0}
.t-info h3{margin:2px 0 8px;font-size:20px}
.t-info .desc{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 14px}
.go{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff;
  padding:9px 18px;border-radius:11px;background:linear-gradient(135deg,#6d7cff,#4f9cff);
  box-shadow:0 8px 20px rgba(109,124,255,.35)}
.tool.t-dy:hover{border-color:rgba(45,212,191,.55);box-shadow:0 24px 52px rgba(45,212,191,.2)}
.t-dy .go{background:linear-gradient(135deg,#2dd4bf,#34d399);box-shadow:0 8px 20px rgba(45,212,191,.3)}
.tool.t-draw:hover{border-color:rgba(167,139,250,.55);box-shadow:0 24px 52px rgba(167,139,250,.22)}
.t-draw .go{background:linear-gradient(135deg,#a78bfa,#c084fc);box-shadow:0 8px 20px rgba(167,139,250,.35)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:34px 16px 60px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand">
      <div class="mark">🧰</div>
      <div>
        <h1>我的工具箱</h1>
        <p>常用的本地小工具都放在这里，点一下卡片即可打开</p>
      </div>
    </div>
  </div>

  <h2 class="sec">— 工具列表 —</h2>
  <div class="grid">
    <a class="tool" href="/ai-chart" target="_blank" rel="noopener noreferrer">
      <div class="t-icon">📊</div>
      <div class="t-info">
        <h3>AI 生成图表</h3>
        <p class="desc">输入主题调用大模型，自动整理数据并生成柱状、饼图、折线、雷达、散点、排名等图表，可一键导出 Excel。</p>
        <span class="go">立即打开 ↗</span>
      </div>
    </a>
    <a class="tool t-dy" href="/douyin-download" target="_blank" rel="noopener noreferrer">
      <div class="t-icon">🎬</div>
      <div class="t-info">
        <h3>抖音下载器</h3>
        <p class="desc">粘贴抖音分享链接即可下载无水印视频，无需登录，操作简单。</p>
        <span class="go">立即打开 ↗</span>
      </div>
    </a>
    <a class="tool t-draw" href="https://draw.jiangxinyu1688.com/zh" target="_blank" rel="noopener noreferrer">
      <div class="t-icon">🖌️</div>
      <div class="t-info">
        <h3>NEXT DRAW IO</h3>
        <p class="desc">在线绘图工具：流程图、架构图、UML、思维导图等，网页版可直接使用。</p>
        <span class="go">立即打开 ↗</span>
      </div>
    </a>
  </div>

</div>
</body>
</html>
