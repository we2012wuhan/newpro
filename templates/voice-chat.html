<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>实时语音 · 我的工具箱</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<script src="/static/auth-guard.js"></script>
<style>
/* 通话页：固定视口不滚动。默认只有一个大圆按钮，字幕要点右上角「字幕」才展开。 */
:root{--call-bg:#0d1020;--call-card:#171a2b;--call-line:#282d45;--call-ink:#eef1fa;
  --call-dim:#8b93ab;--acc1:#6d7cff;--acc2:#2dd4bf;--danger:#e0575f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%,#1a2140 0%,var(--call-bg) 55%);
  color:var(--call-ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{height:100%;max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px
  calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ttl{font-size:15px;font-weight:600}
.subtoggle{min-height:34px;padding:0 14px;border-radius:999px;
  border:1px solid var(--call-line);background:transparent;color:var(--call-dim);
  font-family:inherit;font-size:12.5px;cursor:pointer}
.subtoggle.on{border-color:var(--acc1);color:#fff;background:rgba(109,124,255,.18)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--call-dim);
  border:1px solid var(--call-line);border-radius:999px;padding:5px 12px}
.stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;min-height:0}
.orb{position:relative;width:min(72vw,250px);height:min(72vw,250px);border-radius:50%;border:0;cursor:pointer;
  background:url('/static/voice-orb.png') center/cover no-repeat,linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px -18px rgba(109,124,255,.8);
  transition:transform .15s ease}
.orb:active{transform:scale(.97)}
.orb[data-s="idle"]{filter:saturate(.8) brightness(.92)}
.orb::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(109,124,255,.55);opacity:0}
.orb[data-s="live"]::after{animation:pulse 2s ease-out infinite}
.orb[data-s="speaking"]::after{border-color:rgba(45,212,191,.7);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{0%{opacity:.85;transform:scale(.96)}100%{opacity:0;transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){.orb::after{animation:none!important}}
.state{font-size:13px;color:var(--call-dim);min-height:20px;text-align:center}
/* 字幕默认收起，点右上角「字幕」才显示（选择记在 localStorage，纯外观偏好） */
.subs{width:100%;flex:0 0 auto;display:none;flex-direction:column;gap:10px;min-height:100px}
body.show-subs .subs{display:flex}
.bub{border:1px solid var(--call-line);background:var(--call-card);border-radius:14px;padding:10px 13px;
  font-size:14px;line-height:1.7;max-height:132px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.bub.me{border-color:#3b4685;background:#1b2040}
.bub .who{display:block;font-size:11px;color:var(--call-dim);margin-bottom:4px}
.bub[hidden]{display:none}
.tip{font-size:11.5px;color:var(--call-dim);text-align:center;line-height:1.6}
.bar{flex:0 0 auto;display:flex;gap:12px;margin-top:14px}
.btn{flex:1 1 auto;min-height:52px;border-radius:14px;border:1px solid var(--call-line);
  background:var(--call-card);color:var(--call-ink);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn.call{border-color:rgba(45,212,191,.55);background:rgba(45,212,191,.16);color:#b8f2e6}
.btn.hang{border-color:rgba(224,87,95,.5);background:rgba(224,87,95,.16);color:#ffb4b8}
.btn[disabled]{opacity:.45;cursor:default}
@keyframes sway{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.orb[data-s="live"]{animation:sway 3.4s ease-in-out infinite}
.orb[data-s="speaking"]{animation:bob 1.1s ease-in-out infinite}
body.mic-loud .orb{animation:bob .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.orb{animation:none!important}}
@media (max-width:400px){.orb{width:min(78vw,210px);height:min(78vw,210px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ttl">实时语音</div>
    <div class="timer" id="timer">00:00</div>
    <button class="subtoggle" id="btnSubs" type="button" aria-pressed="false">字幕</button>
  </div>

  <div class="stage">
    <button class="orb" id="orb" data-s="idle" type="button" aria-label="开始通话"></button>
    <div class="state" id="state"></div>
    <div class="subs" id="subs">
      <div class="bub me" id="subMe" hidden><span class="who">我</span><span id="txtMe"></span></div>
      <div class="bub" id="subAi" hidden><span class="who">豆包</span><span id="txtAi"></span></div>
    </div>
  </div>

  <div class="bar">
    <button class="btn call" id="btnCall" type="button">📞 打电话</button>
    <button class="btn hang" id="btnHang" type="button" disabled>挂断</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var orb = $('orb'), stateEl = $('state'), timerEl = $('timer');
  var subMe = $('subMe'), txtMe = $('txtMe'), subAi = $('subAi'), txtAi = $('txtAi');
  var btnHang = $('btnHang'), btnSubs = $('btnSubs'), btnCall = $('btnCall');

  var ws = null, mic = null, capCtx = null, worklet = null, srcNode = null;
  var playCtx = null, playAt = 0, live = false, t0 = 0, tick = null, hungUp = false;
  var lastMe = '', lastAi = '', lastCut = 0, lastLoud = 0;

  function setState(s, text) { orb.dataset.s = s; stateEl.textContent = text || ''; }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function show(el, span, text) {
    if (!text) { el.hidden = true; return; }
    el.hidden = false; span.textContent = text;
  }
  function talking() { return !!playCtx && playAt > playCtx.currentTime + 0.05; }

  /* 字幕开关：默认收起，只看那个圆圈 */
  function syncSubs(on) {
    document.body.classList.toggle('show-subs', on);
    btnSubs.classList.toggle('on', on);
    btnSubs.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('tb_voice_subs', on ? '1' : '0'); } catch (e) {}
  }
  btnSubs.onclick = function () { syncSubs(!document.body.classList.contains('show-subs')); };
  try { if (localStorage.getItem('tb_voice_subs') === '1') { syncSubs(true); } } catch (e) {}

  /* ---------- 上行：麦克风 → 16k 单声道 PCM，40ms 一包 ---------- */
  var WORKLET = [
    'class Cap extends AudioWorkletProcessor {',
    '  constructor(){ super(); this.ratio=sampleRate/16000; this.pos=0; this.out=[]; }',
    '  process(inputs){',
    '    const ch = inputs[0] && inputs[0][0];',
    '    if(!ch) return true;',
    '    for(let i=0;i<ch.length;i++){ this.pos += 1; if(this.pos >= this.ratio){ this.pos -= this.ratio;',
    '      let v = ch[i]; v = Math.max(-1, Math.min(1, v)); this.out.push(v); } }',
    '    while(this.out.length >= 640){',
    '      const chunk = this.out.splice(0, 640); const buf = new Int16Array(640);',
    '      for(let i=0;i<640;i++){ buf[i] = chunk[i] < 0 ? chunk[i]*0x8000 : chunk[i]*0x7FFF; }',
    '      this.port.postMessage(buf.buffer, [buf.buffer]);',
    '    }',
    '    return true;',
    '  }',
    '}',
    'registerProcessor("cap", Cap);'
  ].join('\n');

  async function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('这个浏览器不给麦克风（必须 https 打开）');
    }
    var stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
    capCtx = new (window.AudioContext || window.webkitAudioContext)();
    var url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await capCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    srcNode = capCtx.createMediaStreamSource(stream);
    worklet = new AudioWorkletNode(capCtx, 'cap');
    worklet.port.onmessage = function (ev) {
      /* 顺手量这包的能量：它正在说话时你一开口，就自动打断（不用按钮） */
      var b = new Int16Array(ev.data), peak = 0;
      for (var i = 0; i < b.length; i += 4) { var v = b[i] < 0 ? -b[i] : b[i]; if (v > peak) { peak = v; } }
      if (peak > 1400) { lastLoud = Date.now(); }
      document.body.classList.toggle('mic-loud', Date.now() - lastLoud < 320);
      if (peak > 2200 && talking()) {
        var now = Date.now();
        if (now - lastCut > 900) { lastCut = now; interrupt(); }
      }
      if (live && ws && ws.readyState === 1) { ws.send(ev.data); }
    };
    srcNode.connect(worklet);
    mic = stream;
  }

  /* ---------- 下行：PCM(24k) → 排队播放；能被打断 ---------- */
  function play(pcm) {
    if (!playCtx) { playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }); }
    var i16 = new Int16Array(pcm), f32 = new Float32Array(i16.length);
    for (var i = 0; i < i16.length; i++) { f32[i] = i16[i] / 0x8000; }
    var buf = playCtx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    var node = playCtx.createBufferSource();
    node.buffer = buf; node.connect(playCtx.destination);
    var now = playCtx.currentTime;
    if (playAt < now) { playAt = now; }
    node.start(playAt);
    playAt += buf.duration;
    setState('speaking', '它正在说…');
    node.onended = function () {
      if (playCtx && playCtx.currentTime >= playAt - 0.05) { setState('live', '在听你说…'); }
    };
  }
  function stopPlayback() {
    playAt = 0;
    if (playCtx) { playCtx.close(); playCtx = null; }
  }

  /* ---------- 事件 ---------- */
  function pickText(data) {
    if (!data) { return ''; }
    var s = String(data);
    try {
      var o = JSON.parse(s);
      return String(o.text || o.content || o.message || (o.data && o.data.text) || '');
    } catch (e) { return s.length > 400 ? s.slice(0, 400) + '…' : s; }
  }
  function onEvent(m) {
    if (m.type === 'error') { setState('idle', '出错：' + (m.message || '')); hangup(true); return; }
    if (m.type === 'closed') { setState('idle', m.message || '已挂断'); hangup(true); return; }
    var name = m.name, text = pickText(m.data);
    if (name === 'asr_text' && text) { lastMe = text; show(subMe, txtMe, text); }
    else if (name === 'asr_ended' && lastMe) { show(subMe, txtMe, lastMe); }
    else if (name === 'chat_text' && text) { lastAi = text; show(subAi, txtAi, text); }
    else if (name === 'tts_started') { setState('speaking', '它正在说…'); }
    else if (name === 'tts_ended' || name === 'response_done') { setState('live', '在听你说…'); }
    else if (name === 'session_started') { setState('live', '在听你说…'); }
  }

  /* ---------- 连接 / 打断 / 挂断 ---------- */
  function tickStart() {
    t0 = Date.now();
    clearInterval(tick);
    tick = setInterval(function () { timerEl.textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 500);
  }
  async function start() {
    hungUp = false;
    setState('idle', '正在连…');
    try { await startMic(); }
    catch (e) { setState('idle', '拿不到麦克风：' + e.message); orb.textContent = ''; return; }
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws/voice');
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { ws.send(JSON.stringify({ cmd: 'start' })); live = true; tickStart(); };
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') {
        try { onEvent(JSON.parse(ev.data)); } catch (e) {}
      } else { play(ev.data); }
    };
    ws.onclose = function () { if (!hungUp) { setState('idle', '连接断了，点一下重连'); } cleanup(true); };
    ws.onerror = function () { setState('idle', '连接出错'); };
  }
  function cleanup(keepTimer) {
    live = false;
    if (worklet) { worklet.port.onmessage = null; worklet = null; }
    if (srcNode) { try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
    if (capCtx) { try { capCtx.close(); } catch (e) {} capCtx = null; }
    if (mic) { mic.getTracks().forEach(function (t) { t.stop(); }); mic = null; }
    stopPlayback();
    if (!keepTimer) { clearInterval(tick); tick = null; }
    btnHang.disabled = true; btnCall.disabled = false;
    orb.textContent = '';
  }
  function hangup(remote) {
    hungUp = !!remote;
    try { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ cmd: 'hangup' })); } } catch (e) {}
    try { if (ws) { ws.close(); } } catch (e) {}
    ws = null;
    cleanup(false);
    setState('idle', remote ? stateEl.textContent : '已挂断');
  }
  function interrupt() {
    stopPlayback();
    try { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ cmd: 'interrupt' })); } } catch (e) {}
    setState('live', '在听你说…');
  }

  orb.onclick = function () {
    if (ws) { return; }
    orb.textContent = '';
    btnHang.disabled = false; btnCall.disabled = true;
    start();
  };
  btnCall.onclick = function () {
    if (ws) { return; }
    orb.textContent = ''; btnHang.disabled = false; btnCall.disabled = true; start();
  };
  btnHang.onclick = function () { hangup(false); };
  window.addEventListener('pagehide', function () { if (ws) { hangup(false); } });
})();
</script>
</body>
</html>
