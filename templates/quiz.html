<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efece4">
<title>出题小工具 · 我的工具箱</title>
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<script src="/static/theme.js"></script>
<style>
  :root {
    --bg: #efece4;
    --paper: #fffdf8;
    --field: #ffffff;
    --tint: #fffbf1;
    --tint-on: #f8f3e8;
    --ink: #23201b;
    --ink-soft: #454037;
    --muted: #7a7366;
    --placeholder: #a59d8e;
    --line: #ddd6c7;
    --line-strong: #bdb3a0;
    --accent: #9e3b2e;
    --accent-dark: #7c2d23;
    --accent-soft: #f8ece8;
    --ok: #2c6a45;
    --ok-soft: #eef5ee;
    --bad: #9e3b2e;
    --bad-soft: #fbf0ed;
    --bad-line: #dcc0b8;
    --chip: #f4efe4;
    --solid-ink: #ffffff;
    --btn-hover: #3a352c;
    --radius: 4px;
  }

  [data-theme="dark"] {
    --bg: #14110d;
    --paper: #1c1813;
    --field: #17130f;
    --tint: #241f18;
    --tint-on: #2d261d;
    --ink: #ece4d5;
    --ink-soft: #cfc4b1;
    --muted: #9d9382;
    --placeholder: #7f7666;
    --line: #35302a;
    --line-strong: #514a3f;
    --accent: #e08a75;
    --accent-dark: #f0a48f;
    --accent-soft: #33201a;
    --ok: #86cfa5;
    --ok-soft: #16261c;
    --bad: #e08a75;
    --bad-soft: #2c1a16;
    --bad-line: #5b382f;
    --chip: #262119;
    --solid-ink: #191510;
    --btn-hover: #f5ecdc;
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea { font: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- 顶部 ---------- */
  .masthead {
    border-top: 4px solid var(--ink);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .masthead .wrap {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding-top: 13px;
    padding-bottom: 13px;
    flex-wrap: wrap;
  }
  .back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
  }
  .back:hover { color: var(--accent); }
  .brand {
    font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .model-state {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    white-space: nowrap;
  }
  .model-state.is-off { color: var(--bad); border-color: var(--bad-line); background: var(--bad-soft); }
  .tb-mount { display: inline-flex; align-items: center; }
  .tb-tbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    padding: 4px 11px;
    font-size: 12px;
    line-height: 1.5;
    cursor: pointer;
  }
  .tb-tbtn:hover { border-color: var(--ink); color: var(--ink); }
  .tb-tbtn .tb-ico { font-size: 13px; line-height: 1; }
  .tb-tbtn .tb-txt { white-space: nowrap; }

  /* ---------- 纸张 ---------- */
  main.wrap { padding-bottom: 56px; }

  .sheet, .paper {
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    margin-top: 26px;
    padding: 30px 34px;
  }
  .paper { margin-top: 20px; }

  h1, h2, h3, p { margin: 0; }

  .field { display: block; margin-bottom: 18px; }
  .field > span, legend {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  input[type="text"], textarea {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--ink);
    padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--placeholder); }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(158, 59, 46, .12);
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.65; }

  .material { margin-bottom: 18px; }
  .material summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 4px 0;
  }
  .material summary::marker { color: var(--accent); }
  .material[open] summary { margin-bottom: 8px; }
  .char-count { margin-top: 5px; font-size: 12px; color: var(--muted); text-align: right; }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset + fieldset { margin-top: 18px; }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 18px;
  }
  .row2 fieldset + fieldset { margin-top: 0; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }

  .pill {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--field);
    padding: 7px 13px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink-soft);
    user-select: none;
    transition: border-color .12s, background .12s, color .12s;
  }
  .pill:hover { border-color: var(--ink-soft); }
  .pill input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .pill:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-dark);
  }
  .pill:has(input:checked) span { font-weight: 600; }
  .pill:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .pill .tick { font-size: 11px; opacity: 0; }
  .pill:has(input:checked) .tick { opacity: 1; }

  .primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--solid-ink);
    border-radius: var(--radius);
    padding: 10px 20px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .primary:hover { background: var(--btn-hover); }
  .primary:disabled { opacity: .45; cursor: not-allowed; }

  .ghost {
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    border-radius: var(--radius);
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  .ghost:hover { border-color: var(--ink); color: var(--ink); }
  .ghost.small { padding: 4px 10px; font-size: 12px; }
  .ghost.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

  .msg {
    min-height: 20px;
    font-size: 13px;
    color: var(--bad);
    margin: 8px 0 10px;
  }

  /* ---------- 试卷 ---------- */
  .paper-head, .result-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }
  .paper-head h2, .result-head h2 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    font-size: 22px;
    line-height: 1.4;
  }
  .paper-meta, .score-meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .sheet-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .sheet-dot {
    width: 33px;
    height: 33px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    background: var(--field);
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .sheet-dot:hover { border-color: var(--ink); }
  .sheet-dot.is-answered { background: var(--ink); border-color: var(--ink); color: var(--solid-ink); }
  .sheet-dot.is-correct { background: var(--ok); border-color: var(--ok); color: var(--solid-ink); }
  .sheet-dot.is-wrong { background: var(--bad); border-color: var(--bad); color: var(--solid-ink); }

  .q { padding: 22px 0; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
  .q:first-child { border-top: 0; padding-top: 18px; }
  .q-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .q-head .star { margin-left: auto; }
  .q-no {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    color: var(--ink);
    min-width: 34px;
  }
  .q-type {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 1px 7px;
  }
  .q-tip { font-size: 12px; color: var(--muted); }
  .q-stem {
    font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    font-size: 18px;
    line-height: 1.8;
    margin: 9px 0 13px 44px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .options { margin-left: 44px; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    padding: 10px 13px;
    margin: 7px 0;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: var(--line-strong); background: var(--tint); }
  .opt input {
    margin: 4px 0 0;
    accent-color: var(--accent);
    flex: 0 0 auto;
  }
  .opt-key {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    color: var(--muted);
    min-width: 16px;
  }
  .opt-text { flex: 1; overflow-wrap: anywhere; }
  .opt:has(input:checked) { border-color: var(--ink); background: var(--tint-on); }

  .blank-wrap { margin-left: 44px; }
  .blank-wrap input {
    max-width: 420px;
    font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    font-size: 17px;
    letter-spacing: .04em;
  }

  .submitbar {
    position: sticky;
    bottom: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 10px;
    padding: 14px 0 4px;
    border-top: 1px solid var(--line-strong);
    background: var(--paper);
    padding-bottom: max(4px, env(safe-area-inset-bottom));
  }
  .progress-text { color: var(--muted); font-size: 13px; }

  /* ---------- 判分 ---------- */
  .score-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .score-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 6px;
  }
  .score-num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 42px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .score-percent { color: var(--muted); font-size: 16px; }
  .score-note { font-size: 13px; color: var(--ink-soft); margin-top: 8px; max-width: 560px; }

  .review { border-top: 1px solid var(--line); padding: 20px 0; }
  .review:first-child { border-top: 0; }
  .verdict {
    font-size: 12px;
    font-weight: 600;
    border-radius: 3px;
    padding: 1px 8px;
  }
  .verdict.ok { color: var(--ok); background: var(--ok-soft); }
  .verdict.bad { color: var(--bad); background: var(--bad-soft); }
  .review .q-stem { margin-bottom: 10px; }

  .result-options { margin-left: 44px; }
  .result-opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    padding: 8px 12px;
    margin: 6px 0;
    color: var(--ink-soft);
  }
  .result-opt.is-answer {
    border-color: var(--ok);
    background: var(--ok-soft);
    color: var(--ink);
  }
  .result-opt.is-picked {
    border-color: var(--bad);
    background: var(--bad-soft);
    color: var(--ink);
  }
  .result-opt.is-answer.is-picked {
    border-color: var(--ok);
    background: var(--ok-soft);
  }
  .result-opt .tag {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .result-opt.is-answer .tag { color: var(--ok); }
  .result-opt.is-picked:not(.is-answer) .tag { color: var(--bad); }

  .feedback {
    margin: 12px 0 0 44px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 14px;
    color: var(--ink-soft);
  }
  .fb-row { display: flex; gap: 10px; margin: 3px 0; }
  .fb-label { color: var(--muted); flex: 0 0 68px; font-size: 13px; }
  .fb-value { flex: 1; overflow-wrap: anywhere; }
  .fb-value.is-missing { color: var(--bad); }
  .fb-value.is-right { color: var(--ok); font-weight: 600; }
  .fb-explain { margin-top: 8px; line-height: 1.75; }
  .why-title { margin-top: 9px; font-size: 12px; color: var(--muted); }
  .why-list { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
  .why-list li {
    padding: 3px 0 3px 10px;
    border-left: 2px solid var(--line);
    margin: 3px 0;
  }
  .why-list b { color: var(--ink); font-family: Georgia, serif; }
  .point-line { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* ---------- 页签 ---------- */
  .tabs {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .tabs .wrap { display: flex; gap: 2px; }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 11px 14px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-on {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* ---------- 错题库 / 收藏 ---------- */
  .collect { margin: 26px 0; }
  .collect.sheet { padding: 8px 24px; }
  .collect-item { padding: 15px 2px; border-bottom: 1px solid var(--line); }
  .collect-item:last-child { border-bottom: 0; }
  .collect-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .collect-source {
    flex: 1;
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .collect-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    appearance: none;
    background: none;
    border: 0;
    padding: 2px 5px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn.is-on { color: var(--accent); }
  .collect-stem {
    margin: 6px 0 8px;
    font-family: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .collect-opts { display: grid; gap: 2px; font-size: 13px; color: var(--ink-soft); }
  .collect-opt.is-picked { color: var(--bad); }
  .collect-opt.is-answer { color: var(--ok); font-weight: 600; }
  .collect-line { margin-top: 7px; font-size: 13px; color: var(--muted); }
  .collect-line b { color: var(--ink-soft); font-weight: 600; }
  .collect-explain {
    margin-top: 7px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .empty-collect { padding: 26px 4px; color: var(--muted); font-size: 13px; }

  /* ---------- 出题记录（右侧，可折叠） ---------- */
  .gen-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px;
    align-items: start;
  }
  .gen-main { min-width: 0; }

  .history {
    margin-top: 26px;
    padding: 13px 15px 6px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow: auto;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  .history-head h2 { font-size: 15px; letter-spacing: .04em; }
  .history-actions { display: flex; align-items: center; gap: 2px; }
  .fold-btn { font-size: 15px; padding: 2px 6px; }
  .history-list { border-bottom: 1px solid var(--line); }
  .empty-history { padding: 18px 4px; color: var(--muted); font-size: 13px; }
  .hist-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 8px;
    align-items: center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .hist-row:last-child { border-bottom: 0; }
  .hist-open {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    cursor: pointer;
    min-width: 0;
  }
  .hist-open:hover .hist-title { color: var(--accent); }
  .hist-title {
    display: block;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hist-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hist-score {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .hist-score.is-empty { font-family: inherit; font-size: 12px; color: var(--muted); }
  .hist-row .ghost { grid-column: 1 / -1; justify-self: start; }

  .history-rail {
    margin-top: 26px;
    align-self: start;
    position: sticky;
    top: 16px;
    width: 40px;
    padding: 12px 0;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .12em;
    writing-mode: vertical-rl;
    cursor: pointer;
  }
  .history-rail:hover { color: var(--ink); border-color: var(--ink); }
  .gen-layout.is-folded { grid-template-columns: minmax(0, 1fr) 40px; }
  .gen-layout.is-folded .history { display: none; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--solid-ink);
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    z-index: 20;
    max-width: calc(100vw - 40px);
    text-align: center;
  }

  [hidden] { display: none !important; }

  @media (max-width: 1080px) {
    .gen-layout, .gen-layout.is-folded { grid-template-columns: minmax(0, 1fr); }
    .gen-layout.is-folded .history { display: block; }
    .gen-layout.is-folded .history-list { display: none; }
    .history { position: static; max-height: none; }
    .history-rail { display: none !important; }
  }

  @media (max-width: 680px) {
    .wrap { padding: 0 14px; }
    .masthead .wrap { gap: 10px; padding-top: 10px; padding-bottom: 10px; }
    .sheet, .paper { padding: 20px 16px; margin-top: 16px; }
    .row2 { grid-template-columns: 1fr; gap: 16px; }
    .paper-head, .result-head { flex-direction: column; }
    .score-actions { justify-content: flex-start; }
    .q-stem, .options, .blank-wrap, .result-options, .feedback { margin-left: 0; }
    .q-stem { font-size: 17px; }
    .q-no { min-width: 28px; font-size: 20px; }
    .submitbar { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .primary { padding: 10px 16px; }
    .tab { padding: 10px 12px; }
  }

  @media (max-width: 520px) {
    .tb-tbtn .tb-txt { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }

  @media print {
    html[data-theme="dark"] {
      color-scheme: light;
      --bg: #fff;
      --paper: #fff;
      --field: #fff;
      --ink: #000;
      --ink-soft: #333;
      --muted: #666;
      --line: #ccc;
      --line-strong: #999;
      --solid-ink: #fff;
    }
    body { background: #fff; }
    .gen-layout { display: block; }
    .masthead, .tabs, .history, .history-rail, .collect-actions, .submitbar, .sheet-nav,
    .score-actions, #newBtn { display: none !important; }
    .sheet, .paper { border: 0; margin: 0; padding: 0; }
    .q { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="back" href="/">← 工具箱</a>
    <span class="brand">出题</span>
    <span class="model-state" id="modelState">模型检查中</span>
    <span class="tb-mount"></span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="出题小工具">
  <div class="wrap">
    <button class="tab is-on" id="tabBtnGenerate" type="button" role="tab"
            aria-selected="true" aria-controls="tabGenerate" data-tab="generate">出题</button>
    <button class="tab" id="tabBtnWrong" type="button" role="tab"
            aria-selected="false" aria-controls="tabWrong" data-tab="wrong">错题库</button>
    <button class="tab" id="tabBtnFav" type="button" role="tab"
            aria-selected="false" aria-controls="tabFav" data-tab="fav">收藏</button>
  </div>
</nav>

<main class="wrap">
  <noscript>
    <p class="msg">这个页面需要 JavaScript。</p>
  </noscript>

  <div class="tab-panel" id="tabGenerate" role="tabpanel" aria-labelledby="tabBtnGenerate">
    <div class="gen-layout" id="genLayout">
    <div class="gen-main">
    <section class="sheet" id="setup">
      <form id="setupForm" novalidate>
        <label class="field" for="topic">
          <span>主题</span>
          <input id="topic" type="text" maxlength="120" autocomplete="off"
                 placeholder="例如：光合作用、初中英语时态、HTTP 缓存">
        </label>

        <details class="material">
          <summary>资料（可选）</summary>
          <textarea id="material" maxlength="6000" rows="6"
                    placeholder="课件、笔记、书里的一段……只用于出题，不保存原文"></textarea>
          <div class="char-count"><span id="materialCount">0</span> / 6000 字</div>
        </details>

        <fieldset>
          <legend>题型</legend>
          <div class="pills" id="typeChoices"></div>
        </fieldset>

        <div class="row2">
          <fieldset>
            <legend>题量</legend>
            <div class="pills" id="countChoices"></div>
          </fieldset>
          <fieldset>
            <legend>难度</legend>
            <div class="pills" id="levelChoices"></div>
          </fieldset>
        </div>

        <p class="msg" id="setupMsg" role="alert"></p>
        <button class="primary" id="generateBtn" type="submit">生成题目</button>
      </form>
    </section>

    <section class="paper" id="paper" hidden>
      <div class="paper-head">
        <div>
          <h2 id="paperTitle"></h2>
          <p class="paper-meta" id="paperMeta"></p>
        </div>
        <button class="ghost" id="newBtn" type="button">重新出题</button>
      </div>
      <nav class="sheet-nav" id="answerSheet" aria-label="答题卡"></nav>
      <div id="questions"></div>
      <p class="msg" id="submitMsg" role="alert"></p>
      <div class="submitbar">
        <span class="progress-text" id="progressText">已答 0 / 0</span>
        <button class="primary" id="submitBtn" type="button">提交判分</button>
      </div>
    </section>

    <section class="paper" id="result" hidden>
      <div class="result-head">
        <div>
          <div class="score-line">
            <span class="score-num" id="scoreNum"></span>
            <span class="score-percent" id="scorePercent"></span>
          </div>
          <p class="score-meta" id="scoreMeta"></p>
          <p class="score-note" id="scoreNote"></p>
        </div>
        <div class="score-actions">
          <button class="ghost" id="retryBtn" type="button">再做一遍</button>
          <button class="ghost" id="resultNewBtn" type="button">重新出题</button>
        </div>
      </div>
      <div id="reviewList"></div>
    </section>

    </div>

    <aside class="history" id="historyPanel">
      <div class="history-head">
        <h2>最近出的题</h2>
        <div class="history-actions">
          <button class="ghost small" id="refreshHistory" type="button">刷新</button>
          <button class="icon-btn fold-btn" id="foldHistory" type="button"
                  aria-expanded="true" aria-controls="historyList" aria-label="收起记录"
                  title="收起记录">›</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <button class="history-rail" id="historyRail" type="button" aria-expanded="false"
            aria-controls="historyList" title="展开记录" hidden>出题记录</button>
    </div>
  </div>

  <div class="tab-panel" id="tabWrong" role="tabpanel" aria-labelledby="tabBtnWrong" hidden>
    <div class="sheet collect" id="wrongList"></div>
  </div>

  <div class="tab-panel" id="tabFav" role="tabpanel" aria-labelledby="tabBtnFav" hidden>
    <div class="sheet collect" id="favList"></div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/auth-guard.js" defer></script>
<script src="/static/quiz.js" defer></script>
</body>
</html>
