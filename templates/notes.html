<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>记录</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<script src="/static/auth-guard.js"></script>
<style>
:root{
  --acc:#b45309; --acc-2:#d97706; --acc-on:#ffffff;
  --acc-l:rgba(180,83,9,.09); --acc-line:rgba(180,83,9,.28);
  --bg:var(--tb-bg); --card:var(--tb-card); --field:var(--tb-field);
  --line:var(--tb-line); --line2:var(--tb-line-2);
  --ink:var(--tb-ink); --text:var(--tb-text); --muted:var(--tb-muted);
  --err:var(--tb-err); --err-bg:var(--tb-err-bg); --err-line:var(--tb-err-line);
  --ok:var(--tb-ok); --ok-bg:var(--tb-ok-bg); --ok-line:var(--tb-ok-line);
  --hm-0:#e8ede9; --hm-1:#c9f2d8; --hm-2:#8fe3ae; --hm-3:#4cc47d; --hm-4:#1d8d4c;
}
[data-theme="dark"]{
  --acc:#fbbf24; --acc-2:#f59e0b; --acc-on:#1a1205;
  --acc-l:rgba(251,191,36,.12); --acc-line:rgba(251,191,36,.32);
  --hm-0:rgba(255,255,255,.07); --hm-1:#133d26; --hm-2:#166534;
  --hm-3:#1f9d54; --hm-4:#4ade80;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 72px;position:relative;z-index:1}
.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.back{flex:0 0 auto;font-size:13px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);background:var(--field);border-radius:999px;
  padding:10px 14px;line-height:1.2;white-space:nowrap;align-self:flex-start}
.back:hover{color:var(--ink);border-color:var(--acc-line)}
.brand{flex:1 1 240px;min-width:0}
h1{font-size:20px;margin:0;color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 .stat{font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:0}
h1 .streak{font-size:12px;font-weight:600;letter-spacing:0;color:var(--acc);
  background:var(--acc-l);border:1px solid var(--acc-line);border-radius:999px;
  padding:0 8px;line-height:20px;white-space:nowrap}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.65}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;
  padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--card);
  color:var(--text);font-size:14px;cursor:pointer;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--tb-hover);color:var(--ink)}
.btn:active{opacity:.82}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-on);font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:var(--acc-on)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.search{position:relative;flex:1 1 280px;min-width:200px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search input{width:100%;border:1px solid var(--line2);border-radius:12px;background:var(--field);
  color:var(--text);padding:11px 36px 11px 35px;font-size:14.5px;outline:none}
.search input:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l)}
#searchClear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;display:none}
#searchClear:hover{background:var(--tb-hover);color:var(--ink)}
#searchClear.show{display:block}
.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--tb-glow-soft);padding:13px}
.panel-title{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.side-empty{font-size:12.5px;color:var(--muted);padding:8px 4px;line-height:1.6}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px}
.tag-btn{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:999px;
  padding:3px 9px;font-size:12px;line-height:1.6;cursor:pointer}
.tag-btn:hover{color:var(--ink);border-color:var(--acc-line)}
.tag-btn.on{color:var(--acc);border-color:var(--acc-line);background:var(--acc-l)}
.level-filter{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.level-filter button{border:1px solid var(--line);background:var(--field);color:var(--muted);
  border-radius:999px;padding:4px 11px;font-size:12.5px;line-height:1.6;cursor:pointer;min-height:31px}
.level-filter button:hover{color:var(--ink);border-color:var(--acc-line)}
.level-filter button.on{color:var(--acc-on);background:var(--acc);border-color:var(--acc);font-weight:600}
.level-filter button.on[data-level="2"]{color:var(--err);background:var(--err-bg);border-color:var(--err-line)}
.level-select{border:1px solid var(--line2);background:var(--field);color:var(--muted);
  border-radius:9px;padding:5px 7px;font-size:12.5px;min-height:32px;cursor:pointer;outline:none}
.level-select:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l)}
.level-select[data-level="1"]{color:var(--acc);border-color:var(--acc-line);background:var(--acc-l)}
.level-select[data-level="2"]{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.hm-head{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:8px}
.hm-nav{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:7px;
  background:var(--field);color:var(--muted);font-size:14px;line-height:1;cursor:pointer}
.hm-nav:hover{color:var(--ink);border-color:var(--acc-line)}
.hm-nav:disabled{opacity:.35;cursor:default}
.hm-nav:disabled:hover{color:var(--muted);border-color:var(--line)}
.hm-month{font-size:12.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.hm-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;
  font-size:10px;line-height:1.4;text-align:center;color:var(--muted)}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-width:0;
  padding:0;border:0;border-radius:6px;background:var(--hm-0);color:var(--muted);
  font-size:10.5px;line-height:1;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:box-shadow .12s,filter .12s}
.hm-cell[data-level="1"]{background:var(--hm-1)}
.hm-cell[data-level="2"]{background:var(--hm-2)}
.hm-cell[data-level="3"]{background:var(--hm-3)}
.hm-cell[data-level="4"]{background:var(--hm-4)}
.hm-cell[data-level="1"],.hm-cell[data-level="2"]{color:var(--ink)}
.hm-cell[data-level="3"],.hm-cell[data-level="4"]{color:#fff}
[data-theme="dark"] .hm-cell[data-level="4"]{color:#08301b}
.hm-key[data-level="1"]{background:var(--hm-1)}
.hm-key[data-level="2"]{background:var(--hm-2)}
.hm-key[data-level="3"]{background:var(--hm-3)}
.hm-key[data-level="4"]{background:var(--hm-4)}
.hm-cell.is-today{box-shadow:0 0 0 1px var(--acc-line)}
.hm-cell.is-sel{outline:2px solid var(--acc);outline-offset:1px}
.hm-cell.is-future{background:transparent;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.hm-cell.is-blank{background:transparent;visibility:hidden;pointer-events:none}
.hm-cell:not(.is-future):not(.is-blank):hover{filter:brightness(1.07);box-shadow:0 0 0 1px var(--acc-line)}
.hm-foot{display:flex;justify-content:flex-end;margin-top:8px;font-size:10px;color:var(--muted)}
.hm-legend{display:inline-flex;align-items:center;gap:3px}
.hm-key{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--hm-0)}
.usage{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column;gap:13px}
[hidden]{display:none!important}
.view-switch{display:inline-flex;align-self:flex-start;padding:3px;gap:3px;
  border:1px solid var(--line);border-radius:12px;background:var(--field)}
.view-switch button{border:0;background:transparent;color:var(--muted);border-radius:9px;
  padding:7px 15px;font-size:13.5px;line-height:1.2;cursor:pointer;min-height:34px}
.view-switch button:hover{color:var(--ink)}
.view-switch button.on{background:var(--card);color:var(--acc);font-weight:600;
  box-shadow:0 1px 4px rgba(20,25,40,.12)}
.view-analysis .toolbar,
.view-analysis .searchbar,
.view-analysis .daybar,
.view-analysis .composer,
.view-analysis #timeline{display:none!important}
.analysis-view{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--tb-glow-soft);padding:14px;min-height:260px}
.an-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.period-switch{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);
  border-radius:10px;background:var(--field)}
.period-switch button{border:0;background:transparent;color:var(--muted);border-radius:7px;
  padding:6px 13px;font-size:13px;cursor:pointer;min-height:31px}
.period-switch button.on{background:var(--acc);color:var(--acc-on);font-weight:600}
.an-nav{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.an-title{font-size:14px;font-weight:600;color:var(--ink);min-width:150px;text-align:center;
  line-height:1.45}
.an-nav .date-input{max-width:150px}
.an-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:11px 0}
.an-meta{font-size:12px;color:var(--muted);line-height:1.55;min-width:0}
.an-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.an-actions .btn.confirm{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.an-body{min-width:0}
.an-empty{text-align:center;padding:34px 14px;border:1px dashed var(--line2);border-radius:13px;
  color:var(--muted);font-size:13px;line-height:1.8}
.an-empty b{color:var(--ink);font-weight:600}
.an-empty .btn{margin-top:12px}
.an-loading{padding:38px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.an-notice{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;margin-bottom:11px;
  border:1px solid var(--acc-line);background:var(--acc-l);color:var(--acc);
  border-radius:10px;font-size:12.5px;line-height:1.6}
.an-notice .btn{margin-left:auto}
.an-headline{font-size:19px;line-height:1.45;color:var(--ink);margin:10px 0 5px}
.an-summary{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;
  margin:0 0 13px;overflow-wrap:anywhere}
.an-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.an-stat{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 10px}
.an-stat b{display:block;font-size:18px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.an-stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.an-chart{display:flex;align-items:flex-end;gap:2px;height:46px;padding:5px 1px 0;
  border-bottom:1px solid var(--line);margin:7px 0 11px}
.an-chart-bar{flex:1 1 0;min-width:2px;min-height:2px;background:var(--hm-3);border-radius:3px 3px 0 0;
  opacity:.75}
.an-chart-bar.zero{background:var(--hm-0);min-height:1px;opacity:1}
.an-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.an-tag{font-size:11.5px;color:var(--muted);background:var(--field);border:1px solid var(--line);
  border-radius:999px;padding:1px 8px;line-height:1.8}
.an-section{margin:14px 0 0}
.an-section h3{font-size:12.5px;letter-spacing:.03em;color:var(--muted);margin:0 0 8px;font-weight:600}
.an-list{margin:0;padding-left:19px;font-size:13.5px;line-height:1.8;color:var(--text)}
.an-list li{margin:2px 0}
.an-highlight{border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:6px 0;
  background:var(--field)}
.an-highlight-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.an-highlight-title{font-size:13.5px;font-weight:600;color:var(--ink)}
.an-day{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.an-highlight-detail{font-size:12.5px;line-height:1.7;color:var(--text);margin-top:3px}
.an-theme{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.an-theme:last-child{border-bottom:0}
.an-theme-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.an-theme-count{font-size:11px;color:var(--muted);white-space:nowrap}
.an-theme-note{font-size:12.5px;color:var(--text);line-height:1.65;min-width:0}
.an-suggest{border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:6px 0;
  background:var(--field)}
.an-suggest-action{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.6}
.an-suggest-why{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:2px}
.an-suggest-how{font-size:12.5px;color:var(--text);line-height:1.7;margin-top:3px}
.an-when{display:inline-block;font-size:11px;color:var(--acc);border:1px solid var(--acc-line);
  background:var(--acc-l);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.an-next-focus{font-size:14px;font-weight:600;color:var(--ink);line-height:1.65;
  padding:9px 11px;border:1px solid var(--acc-line);background:var(--acc-l);border-radius:11px;
  margin:6px 0 8px}
.an-next-label{font-size:11px;color:var(--acc);margin-right:6px}
.an-conn{border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:6px 0;
  background:var(--field)}
.an-conn-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;
  color:var(--muted)}
.an-conn-row{display:flex;gap:6px;font-size:12.5px;line-height:1.7;margin-top:4px}
.an-conn-key{flex:0 0 auto;color:var(--muted)}
.an-conn-text{color:var(--ink);overflow-wrap:anywhere}
.an-conn-relation{margin-top:5px;font-size:12.5px;line-height:1.7;color:var(--acc)}
.an-conn-suggest{margin-top:2px;font-size:12px;line-height:1.7;color:var(--muted)}
.an-foot{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:16px;
  border-top:1px solid var(--line);padding-top:9px}
.daybar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.daybar .date-input,.an-nav .date-input{border:1px solid var(--line2);background:var(--field);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:13.5px;min-height:38px;outline:none}
.daybar .date-input:focus,.an-nav .date-input:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l)}
.day-title{font-size:17px;font-weight:600;color:var(--ink);margin-right:auto;line-height:1.45}
.day-title small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:7px}
.iconbtn{min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:10px;
  font-size:16px;cursor:pointer;padding:0 9px}
.iconbtn:hover{background:var(--tb-hover);color:var(--ink)}
.composer{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--tb-glow-soft);padding:13px 14px 12px}
.composer:focus-within{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l),var(--tb-glow-soft)}
.composer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:var(--muted);margin-bottom:7px}
#draftHint{color:var(--ok);font-size:12px;opacity:0;transition:opacity .2s}
#draftHint.show{opacity:1}
#noteText{width:100%;border:0;background:transparent;color:var(--text);font-size:15.5px;
  line-height:1.75;resize:vertical;min-height:78px;outline:none;padding:2px 0 6px}
#noteText::placeholder{color:var(--tb-faint)}
.composer.drag{outline:2px dashed var(--acc-line);outline-offset:-5px;background:var(--acc-l)}
.queue{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 9px}
.thumb{position:relative;width:82px;height:82px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line2);background:var(--field);flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;right:3px;top:3px;width:21px;height:21px;border:0;border-radius:50%;
  background:rgba(10,15,25,.68);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
.thumb .rm:hover{background:var(--err)}
.thumb .pending{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,26,.48);color:#fff;font-size:11px;line-height:1.4;text-align:center;padding:4px}
.thumb.pending-item .pending{display:flex}
.composer-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);
  padding-top:10px;margin-top:3px}
.mini{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);
  background:var(--field);color:var(--muted);border-radius:9px;padding:6px 9px;font-size:12.5px;cursor:pointer;
  min-height:32px}
.mini:hover{color:var(--ink);border-color:var(--acc-line);background:var(--tb-hover)}
.tag-input{flex:1 1 160px;min-width:120px;border:0;border-bottom:1px dashed var(--line2);
  background:transparent;color:var(--text);font-size:13px;outline:none;padding:6px 2px;min-height:30px}
.tag-input:focus{border-bottom-color:var(--acc-line)}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;
  padding:4px 7px;font-size:12px;cursor:pointer}
.quick button:hover{background:var(--acc-l);color:var(--acc);border-color:var(--acc-line)}
.composer-row .spacer{flex:1}
.savehint{font-size:11.5px;color:var(--muted);white-space:nowrap}
#saveBtn{min-width:78px}
.timeline{display:flex;flex-direction:column;gap:10px;min-height:80px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--tb-glow-soft);padding:12px 14px 11px;position:relative}
.note:hover{border-color:var(--line2)}
.note-head{display:flex;align-items:center;gap:8px;min-height:25px}
.note-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note-edited{font-size:11px;color:var(--muted);margin-left:2px}
.note-level{font-size:11px;font-weight:600;line-height:18px;padding:0 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--field);white-space:nowrap}
.note-level.lv1{color:var(--acc);background:var(--acc-l);border-color:var(--acc-line)}
.note-level.lv2{color:var(--err);background:var(--err-bg);border-color:var(--err-line)}
.note-actions{margin-left:auto;display:flex;gap:2px;opacity:.6;transition:opacity .15s}
.note:hover .note-actions,.note:focus-within .note-actions{opacity:1}
.act{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;
  padding:3px 7px;font-size:12px;cursor:pointer;min-height:27px}
.act:hover{background:var(--tb-hover);color:var(--ink);border-color:var(--line)}
.act.danger:hover,.act.confirm{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.note-text{margin:3px 0 0;color:var(--text);font-size:14.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.note-text:empty{display:none}
.note-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.note-img{width:94px;height:94px;padding:0;border:1px solid var(--line2);background:var(--field);
  border-radius:9px;overflow:hidden;cursor:zoom-in;display:block}
.note-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .18s}
.note-img:hover img{transform:scale(1.035)}
.note-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.note-tag{border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:999px;
  padding:1px 8px;font-size:11.5px;line-height:1.8;cursor:pointer}
.note-tag:hover{color:var(--acc);border-color:var(--acc-line);background:var(--acc-l)}
.day-group{margin:4px 0 -2px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.day-group::after{content:"";height:1px;background:var(--line);flex:1}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:38px 12px;line-height:1.8;
  border:1px dashed var(--line2);border-radius:14px;background:var(--card)}
.empty b{color:var(--text);font-weight:500}
.loading{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}
.errorbox{padding:18px;border:1px solid var(--err-line);background:var(--err-bg);color:var(--err);
  border-radius:13px;font-size:13px;line-height:1.7}
.searchbar{display:none;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  background:var(--acc-l);border:1px solid var(--acc-line);border-radius:11px;padding:9px 11px}
.searchbar.show{display:flex}
.searchbar b{color:var(--ink);font-weight:600}
.searchbar button{margin-left:auto}
.search-mode .composer,.search-mode .daybar{display:none}
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--text);
  padding:0;width:min(560px,calc(100vw - 28px));box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(15,23,42,.45)}
[data-theme="dark"] dialog::backdrop{background:rgba(0,0,0,.64)}
.edit{padding:18px}
.edit h2{font-size:16px;margin:0 0 12px;color:var(--ink)}
#editText{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--field);
  color:var(--text);font-size:14.5px;line-height:1.7;padding:10px 11px;min-height:150px;resize:vertical;outline:none}
#editText:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l)}
.edit-meta{display:grid;grid-template-columns:150px 110px minmax(0,1fr);gap:9px;margin-top:10px}
.edit-meta input,.edit-meta select{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--field);
  color:var(--text);font-size:13.5px;padding:9px 10px;min-height:39px;outline:none}
.edit-meta input:focus,.edit-meta select:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-l)}
.edit-imgs{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.edit-actions{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.edit-actions .spacer{flex:1}
.err{color:var(--err);font-size:12.5px;margin:9px 0 0;line-height:1.6}
#lightbox{width:auto;max-width:calc(100vw - 24px);background:transparent;border:0;box-shadow:none;
  padding:0;overflow:visible}
#lightbox::backdrop{background:rgba(0,0,0,.82)}
.light-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:10px}
#lightImg{max-width:min(1100px,calc(100vw - 100px));max-height:86vh;border-radius:10px;
  display:block;box-shadow:0 24px 70px rgba(0,0,0,.55);background:#111}
.light-nav{width:40px;height:52px;border:1px solid rgba(255,255,255,.22);border-radius:10px;
  background:rgba(15,23,42,.55);color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto}
.light-nav:hover{background:rgba(15,23,42,.8)}
.light-close{position:absolute;right:-4px;top:-38px;width:32px;height:32px;border:0;border-radius:8px;
  background:rgba(15,23,42,.55);color:#fff;font-size:20px;cursor:pointer}
.light-count{position:absolute;left:0;bottom:-28px;color:rgba(255,255,255,.72);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:90;
  max-width:calc(100vw - 32px);padding:9px 15px;border-radius:10px;background:var(--tb-menu-bg);
  border:1px solid var(--line2);color:var(--text);font-size:13px;line-height:1.6;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{color:var(--err);border-color:var(--err-line)}
@media (max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:10px}
  .side .panel{flex:1 1 240px;min-width:0}
  .usage{margin:0;flex-basis:100%}
  .note-actions{opacity:1}
}
@media (max-width:600px){
  .wrap{padding:10px 10px 118px}
  .top{gap:8px;margin:2px 0 10px}
  .sub{display:none}
  .back{padding:8px 12px}
  .top-actions{width:100%;margin-left:0}
  .toolbar{margin-bottom:10px}
  .layout{gap:12px}
  .side{gap:8px}
  .side .panel{flex:1 1 100%;padding:9px 10px;min-width:0}
  .panel-title{margin-bottom:6px;font-size:11.5px}
  .hm-head{margin-bottom:6px}
  .hm-grid,.hm-week{gap:3px}
  .hm-cell{font-size:10px;border-radius:5px}
  .hm-key{width:12px;height:12px;border-radius:3px}
  .hm-foot{margin-top:8px}
  .usage{margin:0}
  .daybar{gap:6px}
  .day-title{flex:1 1 auto;font-size:16px;margin:0;min-width:0}
  #prevDay{order:1} #dayTitle{order:2} #nextDay{order:3}
  .daybar .date-input{order:4;flex:1 1 100%;width:100%;min-height:36px;font-size:13px}
  .view-switch{width:100%}
  .view-switch button{flex:1 1 0}
  .analysis-view{padding:11px}
  .an-head{align-items:stretch;gap:8px}
  .period-switch{width:100%}
  .period-switch button{flex:1 1 0}
  .an-nav{width:100%;margin-left:0;justify-content:space-between}
  .an-title{flex:1 1 auto;min-width:0;font-size:13px}
  .an-nav .date-input{order:4;flex:1 1 100%;max-width:none;width:100%}
  .an-bar{gap:7px}
  .an-actions{width:100%;margin-left:0}
  .an-actions .btn{flex:1 1 auto}
  .an-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .an-headline{font-size:17px}
  .an-chart{height:38px}
  .composer{padding:11px 12px 10px}
  #imgBtn{order:1}
  .composer-row .spacer{order:2}
  #saveBtn{order:3;min-width:64px;min-height:36px}
  .composer-row .tag-input{order:4;flex:1 1 100%;min-width:0}
  .composer-row .level-select{order:5}
  .composer-row .quick{order:6}
  .level-filter{flex:1 1 100%}
  .level-filter button{flex:1 1 auto;padding:5px 8px}
  .composer-row .savehint{display:none}
  .note{padding:11px 12px 10px}
  .note-img{width:78px;height:78px}
  .thumb{width:74px;height:74px}
  .edit-meta{grid-template-columns:minmax(0,1fr)}
  #lightImg{max-width:calc(100vw - 74px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
<script src="/static/quick-ai.js" defer></script>
<script src="/static/fish-mascot.js" defer></script>
<script src="/static/usage.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="/">← 工具箱</a>
    <div class="brand">
      <h1>记录 <span class="streak" id="streak" hidden></span></h1>
    </div>
    <div class="top-actions">
      <button class="btn" id="todayBtn" type="button">回到今天</button>
      <span class="tb-mount"></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <span class="ico">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜索文字或标签">
      <button id="searchClear" type="button" title="清除搜索" aria-label="清除搜索">×</button>
    </div>
    <div class="level-filter" id="levelFilter" role="group" aria-label="按重要程度筛选">
      <button type="button" data-level="" class="on">全部</button>
      <button type="button" data-level="0">普通</button>
      <button type="button" data-level="1">重要</button>
      <button type="button" data-level="2">关键</button>
    </div>
  </div>

  <div class="layout" id="layout">
    <aside class="side" aria-label="记录热力图和标签">
      <section class="panel hm-panel">
        <div class="hm-head">
          <button class="hm-nav" id="hmPrev" type="button" title="上个月" aria-label="上个月">‹</button>
          <span class="hm-month" id="hmMonth" aria-live="polite"></span>
          <button class="hm-nav" id="hmNext" type="button" title="下个月" aria-label="下个月">›</button>
        </div>
        <div class="hm-week" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="hm-grid" id="heatmap" role="group" aria-label="当月每日记录数量"></div>
        <div class="hm-foot">
          <span class="hm-legend" aria-label="颜色越深记录越多" title="颜色越深记录越多"><i class="hm-key" data-level="0"></i><i class="hm-key" data-level="1"></i><i class="hm-key" data-level="2"></i><i class="hm-key" data-level="3"></i><i class="hm-key" data-level="4"></i></span>
        </div>
      </section>
      <section class="panel">
        <p class="panel-title">标签</p>
        <div class="tag-cloud" id="tagCloud"><span class="side-empty">还没有标签</span></div>
      </section>
      <div class="usage" id="usage"></div>
    </aside>

    <main class="main">
      <div class="view-switch" id="viewSwitch" role="tablist" aria-label="切换记录或分析">
        <button type="button" data-view="notes" class="on" role="tab" aria-selected="true">记录</button>
        <button type="button" data-view="analysis" role="tab" aria-selected="false">AI 分析</button>
      </div>

      <div class="searchbar" id="searchBar">
        <span id="searchText"></span>
        <button class="btn sm ghost" id="searchBack" type="button">返回日期</button>
      </div>

      <div class="daybar" id="daybar">
        <button class="iconbtn" id="prevDay" type="button" title="前一天" aria-label="前一天">←</button>
        <div class="day-title" id="dayTitle">今天</div>
        <input class="date-input" id="dayInput" type="date" aria-label="选择日期">
        <button class="iconbtn" id="nextDay" type="button" title="后一天" aria-label="后一天">→</button>
      </div>

      <section class="composer" id="composer" aria-label="快速记录">
        <div class="composer-head">
          <span id="composerTitle">今天 · 写一条</span>
          <span id="draftHint">已自动保存草稿</span>
        </div>
        <textarea id="noteText" maxlength="10000" placeholder="写点什么…… 可以直接 Ctrl+V 粘贴截图"></textarea>
        <div class="queue" id="queue" hidden></div>
        <div class="composer-row">
          <button class="mini" id="imgBtn" type="button">＋ 图片</button>
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          <input class="tag-input" id="tagInput" type="text" autocomplete="off" placeholder="标签：空格或逗号分隔">
          <select class="level-select" id="levelSelect" aria-label="重要程度" title="重要程度">
            <option value="0">普通</option>
            <option value="1">重要</option>
            <option value="2">关键</option>
          </select>
          <div class="quick">
            <button type="button" data-tag="工作">工作</button>
            <button type="button" data-tag="生活">生活</button>
            <button type="button" data-tag="灵感">灵感</button>
          </div>
          <span class="spacer"></span>
          <span class="savehint" id="saveHint"></span>
          <button class="btn primary sm" id="saveBtn" type="button">保存</button>
        </div>
      </section>

      <section class="timeline" id="timeline" aria-live="polite">
        <div class="loading">加载中……</div>
      </section>

      <section class="analysis-view" id="analysisView" hidden aria-label="每日笔记 AI 分析">
        <div class="an-head">
          <div class="period-switch" id="analysisPeriods" role="group" aria-label="分析周期">
            <button type="button" data-period="day" class="on">日</button>
            <button type="button" data-period="week">周</button>
            <button type="button" data-period="month">月</button>
          </div>
          <div class="an-nav">
            <button class="iconbtn" id="analysisPrev" type="button" title="上一个周期" aria-label="上一个周期">←</button>
            <span class="an-title" id="analysisTitle">今天</span>
            <input class="date-input" id="analysisDate" type="date" aria-label="分析日期">
            <button class="btn sm ghost" id="analysisToday" type="button">今天</button>
            <button class="iconbtn" id="analysisNext" type="button" title="下一个周期" aria-label="下一个周期">→</button>
          </div>
        </div>
        <div class="an-bar">
          <span class="an-meta" id="analysisMeta"></span>
          <div class="an-actions">
            <button class="btn primary sm" id="analysisGenerate" type="button">生成分析</button>
            <button class="btn sm ghost" id="analysisAsk" type="button" hidden>问 AI</button>
            <button class="btn sm ghost" id="analysisCopy" type="button" hidden>复制</button>
            <button class="btn sm ghost" id="analysisDelete" type="button" hidden>删除结果</button>
          </div>
        </div>
        <div class="an-body" id="analysisBody">
          <div class="an-empty">切到「AI 分析」，选好日 / 周 / 月后点「生成分析」。</div>
        </div>
      </section>
    </main>
  </div>
</div>

<dialog id="editor" aria-labelledby="editTitle">
  <form class="edit" id="editForm" novalidate>
    <h2 id="editTitle">编辑笔记</h2>
    <textarea id="editText" maxlength="10000"></textarea>
    <div class="edit-meta">
      <input id="editDay" type="date" aria-label="日期">
      <select id="editImportance" aria-label="重要程度">
        <option value="0">普通</option>
        <option value="1">重要</option>
        <option value="2">关键</option>
      </select>
      <input id="editTags" type="text" autocomplete="off" placeholder="标签：空格或逗号分隔">
    </div>
    <div class="edit-imgs" id="editImgs"></div>
    <div class="edit-actions">
      <button class="mini" id="editImgBtn" type="button">＋ 图片</button>
      <input id="editFileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
      <span class="spacer"></span>
      <button class="btn ghost" id="editCancel" type="button">取消</button>
      <button class="btn primary" id="editSave" type="submit">保存</button>
    </div>
    <p class="err" id="editErr" hidden></p>
  </form>
</dialog>

<dialog id="lightbox" aria-label="查看图片">
  <div class="light-wrap">
    <button class="light-nav" id="lightPrev" type="button" aria-label="上一张">‹</button>
    <img id="lightImg" alt="笔记图片">
    <button class="light-nav" id="lightNext" type="button" aria-label="下一张">›</button>
    <button class="light-close" id="lightClose" type="button" aria-label="关闭">×</button>
    <span class="light-count" id="lightCount"></span>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/notes.js" defer></script>
<script src="/static/focus-widget.js" defer></script>
</body>
</html>
