<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D5A80">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<title>判断力小工具</title>
<style>
:root{
  --blue:#3D5A80; --blue-d:#2F4763; --blue-l:#EEF3F9; --blue-line:#C3D0E0;
  --ink:#22384F; --text:#3B4859; --muted:#8492A3;
  --bg:#F6F7F9; --card:#FFFFFF; --line:#E6EAF0;
  --green:#5F9E7C; --green-l:#EDF6F1;
  --orange:#CE8B45; --orange-l:#FBF3E8;
  --rose:#C08573; --rose-l:#FAF0ED;
  --r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -14px rgba(16,24,40,.18);
  /* 语义色：主题切换时只改这一组 */
  --primary:#3D5A80; --primary-d:#2F4763; --primary-off:#B9C4D2;
  --surface:#FFFFFF; --surface-2:#F2F4F7; --track:#EFF2F6; --bar-g:#9CC7AF; --bar-empty:#E6EAF0;
  --btn-active:#F3F5F8; --dot:#D7DDE6;
  --topbar-bg:rgba(246,247,249,.94); --tabbar-bg:rgba(255,255,255,.97); --rail-bg:rgba(255,255,255,.72);
  --text-2:#5A6879; --text-3:#4A5866;
  --green-ink:#3F7A5B; --green-line:#CBE3D8;
  --orange-ink:#9E6A2C; --orange-line:#EBD7B8;
  --rose-ink:#9B6350; --rose-line:#E8D2CA;
  --radar-fill:rgba(61,90,128,.16);
  --focus-ring:0 0 0 3px rgba(61,90,128,.08);
  color-scheme:light;
}
html[data-theme="dark"]{
  --blue:#93B4E0; --blue-d:#A9C6EC; --blue-l:#1D2839; --blue-line:#33445C;
  --ink:#E8EEF8; --text:#C2CDDE; --muted:#8593A9;
  --bg:#0E131C; --card:#161D29; --line:#27303F;
  --green:#7CC79E; --green-l:#152A20;
  --orange:#E0A868; --orange-l:#2B2113;
  --rose:#D89E8C; --rose-l:#2C1E1A;
  --sh:0 1px 2px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.75);
  --primary:#4E71A3; --primary-d:#40608C; --primary-off:#39465A;
  --surface:#1A2230; --surface-2:#212B3A; --track:#232E3E; --bar-g:#57A07A; --bar-empty:#2A3546;
  --btn-active:#232D3C; --dot:#33415A;
  --topbar-bg:rgba(14,19,28,.9); --tabbar-bg:rgba(18,24,34,.97); --rail-bg:rgba(16,22,32,.75);
  --text-2:#A9B5C8; --text-3:#B6C2D4;
  --green-ink:#8CD9AE; --green-line:#2E4B3C;
  --orange-ink:#E7B87A; --orange-line:#4A3A22;
  --rose-ink:#E4AC9B; --rose-line:#4A322C;
  --radar-fill:rgba(147,180,224,.22);
  --focus-ring:0 0 0 3px rgba(147,180,224,.18);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink)}
p{margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:480px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ghost{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ghost:hover{color:var(--blue);border-color:var(--blue-line)}
.ghost svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ghost .ic-moon{display:none}
html[data-theme="dark"] .ghost .ic-sun{display:none}
html[data-theme="dark"] .ghost .ic-moon{display:block}
.view{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card.tight{padding:14px}
.card-h{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.card-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:18px 2px 8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-line)}
.badge.g{background:var(--green-l);color:var(--green-ink);border-color:var(--green-line)}
.badge.o{background:var(--orange-l);color:var(--orange-ink);border-color:var(--orange-line)}
.badge.r{background:var(--rose-l);color:var(--rose-ink);border-color:var(--rose-line)}
.badge.n{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;transition:background .15s ease,opacity .15s ease}
.btn:active{background:var(--btn-active)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-d)}
.btn.primary:disabled{background:var(--primary-off);border-color:var(--primary-off);cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}
.sent{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15px;line-height:1.7;color:var(--text);cursor:pointer;transition:background .15s ease,border-color .15s ease;min-height:44px}
.sent.marked{border-color:var(--blue-line);background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.sent.found{border-color:var(--green-line);background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)}
.sent.missed{border-color:var(--orange-line);background:var(--orange-l);box-shadow:inset 3px 0 0 var(--orange)}
.sent.false{border-color:var(--rose-line);background:var(--rose-l);box-shadow:inset 3px 0 0 var(--rose)}
.sent.plain{opacity:.92}
.sent[disabled]{cursor:default}
.why{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:2px 0 4px;font-size:13.5px;line-height:1.7;color:var(--text-2);animation:fadeUp .32s ease-out both}
.why b{color:var(--ink);font-weight:600}
.why .lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.why{animation:none}}
.reveal{animation:fadeUp .32s ease-out both}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.score-i{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.score-n{font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
.score-l{font-size:11.5px;color:var(--muted);margin-top:2px}
.fb{font-size:14px;line-height:1.75;color:var(--text-3);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14.5px;line-height:1.6;cursor:pointer;min-height:44px}
.opt.on{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.opt .k{font-weight:600;color:var(--blue);margin-right:6px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);outline:none;min-height:44px;font-size:15px;line-height:1.6}
textarea{min-height:84px;resize:vertical;line-height:1.7}
textarea:focus,input:focus,select:focus{border-color:var(--blue-line);box-shadow:var(--focus-ring)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13.5px;cursor:pointer}
.chip.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.slider{width:100%;height:44px;display:flex;align-items:center}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--blue-line),var(--blue));border-radius:999px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--blue);box-shadow:0 1px 4px rgba(16,24,40,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.pct{font-size:26px;font-weight:600;color:var(--blue);line-height:1;text-align:center;padding:4px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.item-t{font-size:14.5px;line-height:1.65;color:var(--ink)}
.item-m{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;align-items:center;gap:10px}
.bar-wrap{margin-top:10px}
.bar-row{margin-bottom:10px}
.bar-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--blue-line)}
.bar.g>i{background:var(--bar-g)}
.bar.b>i{background:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:14px;height:120px;padding:0 2px;margin-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bars .col i{display:block;width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--blue-line);min-height:3px}
.bars .col i.g{background:var(--bar-g)}
.bars .col span{font-size:11.5px;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-i{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--sh)}
.stat-n{font-size:22px;font-weight:600;color:var(--ink);line-height:1.2}
.stat-l{font-size:11.5px;color:var(--muted);margin-top:3px}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:13.5px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}
.quote{font-size:14.5px;line-height:1.9;color:var(--text-3);background:var(--blue-l);border:1px solid var(--blue-line);border-radius:var(--r);padding:16px;text-align:center}
.quote span{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.matrix-i{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;line-height:1.6;background:var(--surface)}
.matrix-i b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.matrix-i.hl{border-color:var(--orange-line);background:var(--orange-l)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 0;background:none;border:0;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--blue);font-weight:600}
.onboard{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.onboard-in{width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.ob-skip{margin-left:auto;min-height:44px;padding:0 10px;background:none;border:0;color:var(--muted);font-size:13.5px;cursor:pointer}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.ob-icon{width:64px;height:64px;border-radius:20px;background:var(--blue-l);border:1px solid var(--blue-line);display:flex;align-items:center;justify-content:center;font-size:30px}
.ob-h{font-size:22px;font-weight:600;color:var(--ink);line-height:1.4}
.ob-p{font-size:15px;line-height:1.85;color:var(--text-3)}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.ob-dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);display:block}
.ob-dots i.on{background:var(--blue);width:20px;border-radius:999px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{font-size:13.5px;line-height:1.8;color:var(--text-3)}
.kv b{color:var(--ink)}
.q6{counter-reset:q;font-size:13.5px;line-height:1.9;color:var(--text-3)}
.q6 div{padding-left:2px}
.mini{font-size:11.5px;color:var(--muted)}
.bar-lab b{color:var(--ink);font-weight:600}
.bar.is-null>i{background:var(--bar-empty)}
.radar .rd-grid{fill:none;stroke:var(--line)}
.radar .rd-axis{stroke:var(--line)}
.radar .rd-shape{fill:var(--radar-fill);stroke:var(--blue);stroke-width:2;stroke-linejoin:round}
.radar .rd-dot{fill:var(--blue)}
.radar .rd-lab{fill:var(--muted);font-size:12px}

/* ===== 响应式：平板略加宽，桌面改为「左侧导航 + 双列内容」 ===== */
.brand{display:none}

@media (min-width:600px) and (max-width:899px){
  #app,.topbar-in,.tabbar-in{max-width:560px}
}

@media (min-width:900px){
  :root{--rail:232px}
  #app{margin-left:var(--rail);max-width:none;padding-bottom:32px}
  .ttl{font-size:19px}
  .topbar-in,.view{max-width:1040px;margin:0 auto}
  .topbar-in{padding:16px 28px}
  .view{padding:24px 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;align-items:start}
  /* 以阅读为主的模块：单列窄一些，和顶部标题同宽 */
  .v-scan .topbar-in,.v-scan .view,
  .v-lab .topbar-in,.v-lab .view,
  .v-me .topbar-in,.v-me .view{max-width:916px}
  .v-scan .view,.v-lab .view,.v-me .view{grid-template-columns:minmax(0,1fr)}
  .view>*{grid-column:1/-1}
  .view>.card,.view>.item{margin-bottom:0}
  .view>.sec-t{margin:4px 2px 0}
  .v-calib .item{grid-column:auto}
  /* 雷达卡：宽敞时 SVG 与进度条并排，避免大片留白 */
  .v-me .card:has(>svg){display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);
    column-gap:30px;row-gap:10px;align-items:center}
  .v-me .card:has(>svg)>svg{grid-column:1;grid-row:1/span 4;width:100%;height:auto}
  .v-me .card:has(>svg)>.hr{display:none}
  .v-me .card:has(>svg)>.bar-row,.v-me .card:has(>svg)>.mini{grid-column:2}
  /* 底部 Tab 变成左侧导航 */
  .tabbar{top:0;bottom:0;right:auto;width:var(--rail);border-top:0;
    border-right:1px solid var(--line);background:var(--rail-bg);
    display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
  .brand{display:block;padding:4px 12px 20px}
  .brand b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
  .brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
  .tabbar-in{max-width:none;width:100%;display:flex;flex-direction:column;gap:4px;padding:0}
  .tab{width:100%;flex-direction:row;justify-content:flex-start;gap:11px;
    min-height:46px;padding:0 12px;border-radius:11px;font-size:14.5px}
  .tab:hover{background:var(--blue-l)}
  .tab.active{background:var(--blue-l);color:var(--blue)}
  .onboard-in{max-width:560px}
  .ob-body{gap:18px}
}

/* 大屏：再放开一档，别让内容缩在中间 */
@media (min-width:1600px){
  .topbar-in,.view{max-width:1160px}
  .v-scan .topbar-in,.v-scan .view,
  .v-lab .topbar-in,.v-lab .view,
  .v-me .topbar-in,.v-me .view{max-width:1040px}
}
/* 返回工具箱 */
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;
  text-decoration:none;white-space:nowrap;flex:0 0 auto}
.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink);border-color:var(--blue-line);background:var(--blue-l)}
/* 小屏带不下标题，只留箭头 */
@media (max-width:479px){.back{width:36px;padding:0;gap:0;justify-content:center}.back span{display:none}}

/* 动态粒子背景铺在内容背后，底色由 html 出（body 已被置为透明） */
html{background-color:var(--bg);background-image:
  radial-gradient(1100px 520px at 12% -10%, var(--tb-page-glow-1), transparent 60%),
  radial-gradient(900px 480px at 105% 0%, var(--tb-page-glow-2), transparent 55%),
  radial-gradient(760px 620px at 50% 118%, var(--tb-page-glow-3), transparent 60%);
  background-attachment:fixed}
</style>
<script src="/static/auth-guard.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <a class="back" href="/" aria-label="返回工具箱"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>返回工具箱</span></a>
      <div>
        <div class="ttl" id="pageTitle">今日扫描</div>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深色 / 浅色">
          <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
        </button>
        <button class="ghost" id="helpBtn" title="重看新手引导" aria-label="重看新手引导">?</button>
      </div>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>
<nav class="tabbar">
  <div class="brand"><b>判断力小工具</b><span>察觉 / 拆解 / 校准</span></div>
  <div class="tabbar-in" id="tabbar"></div>
</nav>

<script>(function(){

function todayStr(d){
  var t = d || new Date();
  var m = t.getMonth()+1, day = t.getDate();
  return t.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function addDays(str, n){
  var p = str.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return todayStr(d);
}
function daysBetween(a, b){
  var pa=a.split('-'), pb=b.split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function markActive(){
  var d = todayStr();
  var arr = DB.get(K.days, []);
  if(arr.indexOf(d) < 0){ arr.push(d); arr.sort(); DB.set(K.days, arr); }
}
function streakDays(){
  var arr = DB.get(K.days, []);
  if(!arr.length) return 0;
  var set = {}; arr.forEach(function(d){ set[d]=1; });
  var cur = todayStr();
  if(!set[cur]) cur = addDays(cur, -1);
  var n = 0;
  while(set[cur]){ n++; cur = addDays(cur, -1); }
  return n;
}
function hashStr(s){
  var h = 2166136261;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

var scanNoJp = false;

function currentScanText(){
  var all = DB.get(K.scan, {});
  var today = todayStr();
  var rec = all[today];
  if(rec && rec.textId){
    var hit = SCAN_TEXTS.filter(function(x){ return x.id===rec.textId; })[0];
    if(hit) return hit;
  }
  return SCAN_TEXTS[hashStr(today) % SCAN_TEXTS.length];
}
function scanRecord(){ return DB.get(K.scan, {})[todayStr()] || null; }
function saveScanRec(rec){
  var all = DB.get(K.scan, {});
  all[todayStr()] = rec;
  DB.set(K.scan, all);
}
function scanFeedback(f, m, fa, total, noJp){
  if(noJp && total>0) return '你选了「这段没有判断点」，但这里面其实藏着 '+total+' 处。它们不是让你纠结的大事，恰恰相反——它们快得像呼吸，所以最难被看见。';
  if(f===total && fa===0 && total>0) return '全中，一个没多标。这不是运气好，是你真的停下来了。';
  if(m>0 && fa===0) return '你标出来的都算数，但还有 '+m+' 处，你其实已经替自己做完了判断，只是没意识到。判断不一定要纠结，很多时候它快得像个习惯。';
  if(m===0 && fa>0) return '判断点一个没漏。多标的 '+fa+' 句属于自动驾驶的部分——你把它们也算成了判断。这是警觉过头，比漏掉好治。';
  if(m===0 && fa===0) return '这段里藏了 '+total+' 个判断点，你一个都没标出来。第一次做基本都是这样——不是你迟钝，是这些判断太快了。';
  return '找到 '+f+' 个，漏掉 '+m+' 个，多标 '+fa+' 个。多标的是习惯动作，漏掉的是「太快了，快到不觉得需要停」。';
}

function viewScan(){
  var text = currentScanText();
  var rec = scanRecord();
  var marked = (rec && rec.marked) || [];
  var submitted = !!(rec && rec.submitted);
  scanNoJp = !!(rec && rec.noJp);
  var total = text.lines.filter(function(l){ return l.j; }).length;

  var head = '<div class="card">'+
    '<div class="row" style="justify-content:space-between;align-items:flex-start">'+
      '<div class="card-h">'+esc(text.title)+'</div>'+
      '<span class="badge">'+esc(text.tag)+'</span>'+
    '</div>'+
    '<div class="card-sub">'+(submitted
      ? '逐句对照一下：绿色的你标对了，橙色的你漏了，浅红的你标多了。'
      : '点一下你觉得「这里其实是判断点」的句子（可多选）。判断点不一定让你纠结，它可能只是一个很快的预测。')+'</div>'+
  '</div>';

  var list = text.lines.map(function(l, i){
    var on = marked.indexOf(i) >= 0;
    var cls = 'sent', mark = '';
    if(submitted){
      if(l.j && on){ cls += ' found'; mark = '<span class="badge g">判断点 · 找到了</span>'; }
      else if(l.j && !on){ cls += ' missed'; mark = '<span class="badge o">判断点 · 漏掉了</span>'; }
      else if(!l.j && on){ cls += ' false'; mark = '<span class="badge r">自动驾驶 · 多标了</span>'; }
      else { cls += ' plain'; mark = '<span class="badge n">自动驾驶</span>'; }
    } else if(on){ cls += ' marked'; }

    var html = '<button class="'+cls+'" data-i="'+i+'"'+(submitted?' disabled':'')+'>'+
      (on && !submitted ? '✓ ' : '') + esc(l.t) + '</button>';

    if(submitted){
      html += '<div class="why reveal" style="animation-delay:'+(i*45)+'ms">'+
        mark +
        '<span class="lbl" style="margin-top:6px">'+(l.j ? '这里你其实在赌什么' : '为什么这不算判断')+'</span>'+
        esc(l.why)+'</div>';
    }
    return html;
  }).join('');

  if(!submitted){
    return head +
      '<div class="sec-t">今天的流水账 · 约 200 字</div>' + list +
      '<button class="chip'+(scanNoJp?' on':'')+'" id="noJp" style="width:100%;margin-bottom:10px">这段没有判断点</button>'+
      '<button class="btn primary block" id="submitScan"'+(marked.length||scanNoJp?'':' disabled')+'>提交，逐句对答案</button>'+
      '<div class="mini" style="text-align:center;margin-top:8px">先标记，再揭晓。不标记是看不到解析的。</div>'+
      '<div class="btn-row"><button class="btn" id="nextScan">换一段流水账</button></div>';
  }

  var f = rec.found||0, m = rec.missed||0, fa = rec.false||0;
  return head +
    '<div class="sec-t">逐句对照</div>' + list +
    '<div class="card tight">'+
      '<div class="score">'+
        '<div class="score-i"><div class="score-n">'+f+'</div><div class="score-l">找到</div></div>'+
        '<div class="score-i"><div class="score-n">'+m+'</div><div class="score-l">漏掉</div></div>'+
        '<div class="score-i"><div class="score-n">'+fa+'</div><div class="score-l">多标</div></div>'+
      '</div>'+
      '<div class="fb">'+esc(scanFeedback(f, m, fa, total, rec.noJp))+'</div>'+
      '<div class="mini" style="margin-top:10px">这段一共 '+total+' 个判断点。今天已经练完，明天会换一段新的（内容库第 2 步补到 20 段）。</div>'+
    '</div>'+
    '<div class="btn-row"><button class="btn" id="nextScan">换一段</button><button class="btn" id="resetScan">清空重做</button></div>';
}

function bindScan(){
  var text = currentScanText();
  Array.prototype.forEach.call(document.querySelectorAll('.sent:not([disabled])'), function(b){
    b.onclick = function(){
      var i = +b.getAttribute('data-i');
      var rec = scanRecord() || { textId:text.id, marked:[], submitted:false };
      var p = rec.marked.indexOf(i);
      if(p>=0) rec.marked.splice(p,1); else rec.marked.push(i);
      rec.noJp = false;
      saveScanRec(rec);
      go('scan');
    };
  });
  var nj = document.getElementById('noJp');
  if(nj) nj.onclick = function(){
    var rec = scanRecord() || { textId:text.id, marked:[], submitted:false };
    rec.noJp = !rec.noJp;
    if(rec.noJp) rec.marked = [];
    saveScanRec(rec);
    go('scan');
  };
  var sb = document.getElementById('submitScan');
  if(sb) sb.onclick = function(){
    var rec = scanRecord() || { textId:text.id, marked:[], submitted:false };
    var f=0, m=0, fa=0;
    text.lines.forEach(function(l, i){
      var on = rec.marked.indexOf(i) >= 0;
      if(l.j && on) f++;
      if(l.j && !on) m++;
      if(!l.j && on) fa++;
    });
    rec.submitted = true; rec.found = f; rec.missed = m; rec.false = fa;
    saveScanRec(rec);
    markActive();
    go('scan');
  };
  var ns = document.getElementById('nextScan');
  if(ns) ns.onclick = function(){
    var i = SCAN_TEXTS.indexOf(currentScanText());
    var nx = SCAN_TEXTS[(i+1) % SCAN_TEXTS.length];
    saveScanRec({ textId:nx.id, marked:[], submitted:false, noJp:false });
    go('scan');
  };
  var rs = document.getElementById('resetScan');
  if(rs) rs.onclick = function(){
    saveScanRec({ textId:text.id, marked:[], submitted:false, noJp:false });
    go('scan');
  };
}

function viewCalib(){

    '<label class="f">会发生的事</label>'+
    '<input type="text" id="cEvent" placeholder="例：这周需求会在评审前又加一条">'+
    '<label class="f">在此之前</label>'+
    '<input type="date" id="cBy" value="'+addDays(today,7)+'">'+
    '<label class="f">你有多少把握</label>'+

    '<select id="cTag">'+TAGS.map(function(t){ return '<option>'+t+'</option>'; }).join('')+'</select>'+

  '</div>';

  var secDue = due.length ? '<div class="sec-t">该回访了（'+due.length+' 条）</div>' + due.map(function(r){ return calibItem(r, true); }).join('') : '';
  var secPend = pend.length ? '<div class="sec-t">等结果</div>' + pend.map(function(r){ return calibItem(r, false); }).join('') : '';
  var secDone = done.length ? '<div class="sec-t">已回访（'+done.length+' 条）</div>' + done.map(function(r){ return calibItem(r, false); }).join('') : '';

function calibItem(r, showBtns){
  var t = todayStr();
  var meta = '<span class="badge">'+esc(r.tag)+'</span>'+
    '<span>把握 '+r.conf+'%</span>'+
    '<span>截止 '+esc(r.by)+'</span>'+
    (r.demo ? '<span class="badge n">示例</span>' : '');
  var extra = '';
  if(r.outcome === 'yes') extra = '<span class="badge g">发生了</span>';
  if(r.outcome === 'no')  extra = '<span class="badge o">没发生</span>';
  if(!r.outcome && r.by >= t) extra = '<span class="mini">还有 '+daysBetween(t, r.by)+' 天</span>';
  var btns = showBtns
    ? '<div class="btn-row"><button class="btn sm" data-cy="'+r.id+'">发生了</button><button class="btn sm" data-cn="'+r.id+'">没发生</button></div>'
    : '';
  return '<div class="item"><div class="item-t">'+esc(r.event)+'</div><div class="item-m">'+meta+' '+extra+'</div>'+btns+'</div>';
}

function bucketOf(conf){ return Math.floor(conf/5)*5; }

function chartCard(done, all){
  if(!done.length){
    return '<div class="card">'+
      '<div class="card-h">校准曲线</div>'+
      '<div class="empty"><b>还没有回访过的预测</b>等你第一次点下「发生了」或「没发生」，这里就会开始长东西。<br>现在上面那些「示例」条目，是为了让你先看到形状——可以在「我」里一键清空。</div>'+
    '</div>';
  }
  var n = done.length;
  var hits = done.filter(function(r){ return r.outcome==='yes'; }).length;
  var rate = hits/n;
  var avgConf = done.reduce(function(s,r){ return s+r.conf; },0)/n;
  var err = done.reduce(function(s,r){ return s + Math.abs(r.conf/100 - (r.outcome==='yes'?1:0)); },0)/n;
  var gap = avgConf/100 - rate;

  var verdict;
  if(gap > 0.12) verdict = '按你自己报的把握，这些事本该发生 '+Math.round(avgConf)+'% 的次数。实际少了 '+(Math.round(avgConf)-Math.round(rate*100))+' 个百分点——你比实际情况更有把握，而且是有系统的。';
  else if(gap < -0.12) verdict = '你比自己以为的保守：说 '+Math.round(avgConf)+'% 把握的事，实际发生了 '+Math.round(rate*100)+'%。留意你是不是习惯性给自己留后路，以至于不敢下判断。';
  else verdict = '你报的把握和实际发生的频率差得不多。这不是说你判断得好，而是说——你对自己有多大把握这件事，心里是有数的。';

  var buckets = {};
  done.forEach(function(r){
    var b = bucketOf(r.conf);
    buckets[b] = buckets[b] || { n:0, hit:0 };
    buckets[b].n++; if(r.outcome==='yes') buckets[b].hit++;
  });
  var keys = Object.keys(buckets).map(Number).sort(function(a,b){ return a-b; });
  var bars = keys.map(function(b){
    var x = buckets[b], actual = Math.round(x.hit/x.n*100);
    return '<div class="bar-row">'+
      '<div class="bar-lab"><span>你说 '+b+'% 把握 · '+x.n+' 条</span><span>实际 '+actual+'%</span></div>'+
      '<div class="bar b"><i style="width:'+b+'%"></i></div>'+
      '<div class="bar g" style="margin-top:4px"><i style="width:'+actual+'%"></i></div>'+
    '</div>';
  }).join('');

  var tagRows = TAGS.map(function(tg){
    var arr = done.filter(function(r){ return r.tag===tg; });
    if(!arr.length) return '';
    var h = arr.filter(function(r){ return r.outcome==='yes'; }).length;
    var ac = arr.reduce(function(s,r){ return s+r.conf; },0)/arr.length;
    var d = Math.round(ac) - Math.round(h/arr.length*100);
    var word = d > 12 ? '最容易高估' : (d < -12 ? '最容易低估' : '比较稳');
    return '<div class="bar-lab" style="margin-bottom:2px"><span>'+tg+' · '+arr.length+' 条 · 平均报 '+Math.round(ac)+'%</span><span>实际 '+Math.round(h/arr.length*100)+'%（'+word+'）</span></div>'+
           '<div class="bar '+(d>12?'':'g')+'"><i style="width:'+Math.round(h/arr.length*100)+'%"></i></div>';
  }).join('');

  return '<div class="card">'+
    '<div class="card-h">校准曲线</div>'+
    '<div class="card-sub">蓝条 = 你声称的把握度，绿条 = 实际发生的比例。两条一样长，说明你心里那杆秤是准的。</div>'+
    '<div style="margin-top:12px">'+bars+'</div>'+
    '<div class="hr"></div>'+
    '<div class="card-h">大白话结论</div>'+
    '<div class="card-sub">你平均说 '+Math.round(avgConf)+'% 把握的事，实际发生了 '+Math.round(rate*100)+'%。<br>'+verdict+'</div>'+
    '<div class="mini" style="margin-top:8px">平均校准误差 '+(err*100).toFixed(0)+' 个百分点（越小越准）。粗略经验值，仅供参考：样本少于 20 条时，这个数字本身也不太稳。</div>'+
    (tagRows ? '<div class="hr"></div><div class="card-h">按领域看</div>'+tagRows : '')+
  '</div>';
}

function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }

function scoreAll(){
  var scanAll = DB.get(K.scan, {});
  var jpTotal = 0, missed = 0, fa = 0, scanN = 0;
  Object.keys(scanAll).forEach(function(k){
    var r = scanAll[k]; if(!r || !r.submitted) return;
    var t = SCAN_TEXTS.filter(function(x){ return x.id===r.textId; })[0];
    if(!t) return;
    scanN++;
    jpTotal += t.lines.filter(function(l){ return l.j; }).length;
    missed += (r.missed||0); fa += (r.false||0);
  });
  var labN = DB.get(K.lab, []).length;
  var st = streakDays();
  var calAll = DB.get(K.calib, []);
  var done = calAll.filter(function(r){ return !!r.outcome; });
  var ledAll = DB.get(K.ledger, []);

  var aware = null, missRate = null;
  if(jpTotal){ missRate = missed/jpTotal; aware = clamp(100 - missRate*100 - (fa/Math.max(1,jpTotal))*40); }
  var dec = clamp(labN*15 + Math.min(20, st*4));
  var cal = null, calErr = null;
  if(done.length){
    calErr = done.reduce(function(s, r){ return s + Math.abs(r.conf/100 - (r.outcome==='yes'?1:0)); }, 0) / done.length;
    cal = clamp(100 - calErr*150);
  }
  return { aware:aware, missRate:missRate, scanN:scanN, jpTotal:jpTotal, fa:fa,
           dec:dec, labN:labN, streak:st, cal:cal, calErr:calErr, doneN:done.length,
           total: scanN + labN + calAll.length + ledAll.length };
}

function radarSVG(vals){
  var cx = 110, cy = 104, R = 68, ang = [-90, 30, 150];
  function pt(i, r){
    var a = ang[i]*Math.PI/180;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  }
  var out = '<svg class="radar" viewBox="-14 -8 248 234" width="100%" height="212" role="img" aria-label="判断力三维雷达图">';
  [0.25,0.5,0.75,1].forEach(function(k){
    var p = []; for(var i=0;i<3;i++){ var q = pt(i,R*k); p.push(q[0].toFixed(1)+','+q[1].toFixed(1)); }
    out += '<polygon points="'+p.join(' ')+'" class="rd-grid"/>';
  });
  for(var i=0;i<3;i++){
    var q = pt(i,R);
    out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" class="rd-axis"/>';
  }
  var dp = [], dots = '';
  for(var j=0;j<3;j++){
    var v = Math.max(0, Math.min(100, vals[j]||0))/100;
    var q2 = pt(j, R*v);
    dp.push(q2[0].toFixed(1)+','+q2[1].toFixed(1));
    dots += '<circle cx="'+q2[0].toFixed(1)+'" cy="'+q2[1].toFixed(1)+'" r="3.4" class="rd-dot"/>';
  }
  out += '<polygon points="'+dp.join(' ')+'" class="rd-shape"/>'+dots;
  var labs = ['察觉力','拆解力','校准力'];
  for(var k2=0;k2<3;k2++){
    var q3 = pt(k2, R+26);
    var anchor = Math.abs(q3[0]-cx) < 6 ? 'middle' : (q3[0] > cx ? 'start' : 'end');
    var dy = q3[1] < cy ? -2 : 12;
    out += '<text x="'+q3[0].toFixed(1)+'" y="'+(q3[1]+dy).toFixed(1)+'" text-anchor="'+anchor+'" class="rd-lab">'+labs[k2]+'</text>';
    } 
  out += '</svg>';
  return out;
}

  return '<div class="bar-row">'+

    '<div class="bar'+(val===null?' is-null':' b')+'"><i style="width:'+w+'%"></i></div>'+
  '</div>';
}

  };
  document.getElementById('helpBtn').onclick = showOnboard;
  renderTabs();
  go('scan');
  if(!DB.get(K.onboard, false)) showOnboard();
}
init();

})();
</script>
