<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F8F6B">
<title>判断力教练</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<style>
:root{
  --acc:#2F8F6B; --acc-d:#26755A; --acc-l:#EAF6F1; --acc-line:#C4E3D6;
  --ink:#17262B; --text:#3B4859; --muted:#8492A3;
  --bg:#F5F8F7; --card:#FFFFFF; --line:#E3EAE8;
  --ok:#1C7A58; --ok-l:#EAF5F0; --ok-line:#C6E2D6;
  --warn:#8A6516; --warn-l:#FBF4E6; --warn-line:#E7D6B0;
  --err:#B23A52; --err-l:#FBEEF1; --err-line:#EED0D7;
  --r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -14px rgba(16,24,40,.18);
  --field:#FFFFFF; --soft:#F1F5F4; --bg-blur:rgba(245,248,247,.9);
  --focus-ring:0 0 0 3px rgba(47,143,107,.14);
}
[data-theme="dark"]{
  --acc:#5FCF9F; --acc-d:#8EE0B8; --acc-l:#10241C; --acc-line:#1F4436;
  --ink:#E8F1EF; --text:#C2CFCC; --muted:#8698A4;
  --bg:#0B1416; --card:#111E21; --line:#1E3134;
  --ok:#7CC79E; --ok-l:#12261E; --ok-line:#2A4536;
  --warn:#E0A868; --warn-l:#241C10; --warn-line:#453722;
  --err:#FF9B8F; --err-l:#2A1416; --err-line:#52282C;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.5);
  --field:#0E1A1D; --soft:#172528; --bg-blur:rgba(11,20,22,.92);
  --focus-ring:0 0 0 3px rgba(95,207,159,.16);
  color-scheme:dark;
}
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .btn.primary:hover{color:#08211A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(56px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg-blur);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.back{margin-left:auto;flex:0 0 auto;font-size:13px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;white-space:nowrap}
.back:hover{color:var(--ink);border-color:var(--acc-line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);margin-top:14px}
.card-h{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.mini{font-size:11.5px;color:var(--muted);line-height:1.7}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);margin:22px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);
  cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--acc-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px;font-weight:600}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:96px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;
  background:var(--acc-l);color:var(--acc);border:1px solid var(--acc-line)}
.badge.g{background:var(--ok-l);color:var(--ok);border-color:var(--ok-line)}
.badge.o{background:var(--warn-l);color:var(--warn);border-color:var(--warn-line)}
.badge.n{background:var(--soft);color:var(--muted);border-color:var(--line)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 6px}
label.f:first-child{margin-top:0}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:var(--field);outline:none;min-height:44px;line-height:1.7;color:var(--ink)}
textarea{min-height:104px;resize:vertical}
textarea:focus,input:focus{border-color:var(--acc-line);box-shadow:var(--focus-ring)}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.72}
.conf{display:flex;align-items:baseline;gap:8px}
.conf-n{font-size:24px;font-weight:600;color:var(--acc);line-height:1}
.slider{width:100%;height:38px;display:flex;align-items:center}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;border-radius:999px;
  background:linear-gradient(90deg,var(--acc-line),var(--acc));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:var(--field);border:3px solid var(--acc);box-shadow:0 2px 6px rgba(16,24,40,.22);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--field);
  border:3px solid var(--acc);cursor:pointer}
.ana-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.box{background:var(--acc-l);border:1px solid var(--acc-line);border-radius:12px;padding:11px 14px;
  font-size:14.5px;line-height:1.7;color:var(--ink);font-weight:600}
.box .k{display:block;font-size:11.5px;color:var(--acc);margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media (min-width:620px){.two{grid-template-columns:1fr 1fr}}
.fb{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--field)}
.fb.f{border-color:var(--ok-line);background:var(--ok-l)}
.fb.g{border-color:var(--warn-line);background:var(--warn-l)}
.fh{font-size:12px;font-weight:600;margin-bottom:6px}
.fb.f .fh{color:var(--ok)}
.fb.g .fh{color:var(--warn)}
.fb ul{margin:0;padding-left:16px}
.fb li{font-size:13.5px;line-height:1.7;margin-bottom:4px}
.fb li:last-child{margin-bottom:0}
.line{display:flex;gap:10px;font-size:13.5px;line-height:1.75;margin-top:12px;
  border-top:1px dashed var(--line);padding-top:11px}
.line .k{flex:0 0 66px;font-size:12px;color:var(--muted);padding-top:2px;white-space:nowrap}
.line.check{border-top:0;border:1px solid var(--acc-line);background:var(--acc-l);
  border-radius:12px;padding:11px 13px}
.line.check .k{color:var(--acc);font-weight:600}
.line.check .v{color:var(--ink)}
.save{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.save select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--field);
  color:var(--ink);font-size:13.5px;outline:none;min-height:44px}
.save .btn{flex:1;min-width:140px}
.item{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.item.due{border-color:var(--warn-line);background:var(--warn-l)}
.item-t{font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:600}
.item-m{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{font-size:13.5px;line-height:1.75;margin-top:7px}
.kv b{color:var(--ink)}
.item textarea{min-height:56px;margin-top:9px;font-size:13.5px}
.lnk{background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
.lnk:hover{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats-i{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stats-n{font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
.stats-l{font-size:11.5px;color:var(--muted);margin-top:2px}
.bar-row{margin-top:12px}
.bar-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.bar.claim>i{background:var(--acc-line)}
.empty{text-align:center;padding:14px 10px;color:var(--muted);font-size:13px;line-height:1.7}
.err{background:var(--err-l);border:1px solid var(--err-line);border-radius:12px;padding:11px 14px;
  font-size:13.5px;color:var(--err);margin-top:12px}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));
  background-size:200% 100%;animation:sk 1.1s linear infinite;height:12px;margin-top:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:currentColor;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:50;
  background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;
  font-size:13.5px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none;opacity:.6}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div>
      <div class="ttl">判断力教练</div>
      <div class="sub">拿自己身上的真事练，先押注，再看牌</div>
    </div>
    <a class="back" href="/">← 返回工具箱</a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <label class="f" for="caseText">一件你正在犹豫的真事</label>
    <textarea id="caseText" placeholder="发生了什么、谁在里面、你手上有什么信息、卡在哪。"></textarea>

    <label class="f" for="lean">你打算怎么做</label>
    <input id="lean" type="text" placeholder="例：这周先不接，等他把资源写清楚 —— 上次没问清，加班的是我">

    <label class="f">你现在有几成把握</label>
    <div class="conf"><span class="conf-n" id="confN">70%</span>
      <span class="mini">这个数以后要对答案的</span></div>
    <div class="slider"><input type="range" id="conf" min="50" max="95" step="5" value="70"></div>

    <button class="btn primary block big" id="goBtn" type="button">先押注，再看牌</button>
    <div class="mini" id="goTip" style="text-align:center;margin-top:8px"></div>
  </div>

  <div id="out"></div>
  <section id="book"></section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';

/* 案例、押注、回访记录只存这台设备的浏览器里 */
var K_REC = 'jt_cases_v2';

var S = { ai:true, busy:false, data:null, source:'', err:'' };
var recs = [];

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function load(k, fb){
  try{ var v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); }
  catch(e){ return fb; }
}
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function dayStr(d){
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}
function todayStr(){ return dayStr(new Date()); }
function addDays(s, n){
  var p = s.split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  d.setDate(d.getDate() + n);
  return dayStr(d);
}
function daysBetween(a, b){
  var pa = a.split('-'), pb = b.split('-');
  return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2]) - new Date(+pa[0],+pa[1]-1,+pa[2])) / 86400000);
}
function api(path, body){
  return fetch(path, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(body || {})
  }).then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, msg:'请求失败，看下服务还在不在' }; });
}
function titleOf(r){
  var t = String(r.text || '').replace(/\s+/g, ' ');
  var cut = t.split(/[。！？；;]/)[0] || t;
  return cut.length > 26 ? cut.slice(0, 26) + '…' : cut;
}

function formState(){
  var c = $('caseText').value.trim(), l = $('lean').value.trim();
  var missing = [];
  if(c.length < 8){ missing.push('这件事'); }
  if(l.length < 2){ missing.push('你的打算'); }
  return { text:c, lean:l, missing:missing };
}
function refreshForm(){
  var f = formState();
  $('goBtn').disabled = f.missing.length > 0 || S.busy;
  if(S.busy){ $('goTip').textContent = ''; return; }
  $('goTip').textContent = f.missing.length
    ? ('还差：' + f.missing.join('、'))
    : (S.ai ? '' : '服务端没配模型 Key，这次走本地规则粗拆');
}

function analyze(){
  var f = formState();
  if(f.missing.length){ toast('还差：' + f.missing.join('、')); return; }
  S.busy = true; S.err = ''; S.data = null;
  refreshForm(); renderOut();
  api('/judgement-trainer/api/analyze',
      { case:f.text, lean:f.lean, conf:Number($('conf').value) || 70 })
    .then(function(d){
      S.busy = false;
      if(!d || !d.ok){ S.err = (d && d.msg) || '拆解失败，再点一次'; }
      else { S.data = d.data; S.source = d.source || 'ai'; }
      refreshForm(); renderOut();
      var el = $('out');
      if(el && el.scrollIntoView){ el.scrollIntoView({ behavior:'smooth', block:'start' }); }
    });
}

function block(title, cls, list){
  var body = (list && list.length)
    ? '<ul>' + list.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
    : '<ul><li>这条里没有</li></ul>';
  return '<div class="fb ' + cls + '"><div class="fh">' + title + '</div>' + body + '</div>';
}

function renderOut(){
  var out = $('out');
  if(S.busy){
    out.innerHTML = '<div class="card"><div class="sk" style="width:30%"></div>' +
      '<div class="sk"></div><div class="sk" style="width:76%"></div><div class="sk" style="width:50%"></div></div>';
    return;
  }
  if(S.err){ out.innerHTML = '<div class="err">' + esc(S.err) + '</div>'; return; }
  if(!S.data){ out.innerHTML = ''; return; }

  var d = S.data, h = '<div class="card"><div class="ana-h">';
  if(d.kind){ h += '<span class="badge">' + esc(d.kind) + '</span>'; }
  if(d.trap){ h += '<span class="badge n">陷阱：' + esc(d.trap) + '</span>'; }
  h += '<span class="badge ' + (S.source === 'ai' ? 'g' : 'o') + '">' +
       (S.source === 'ai' ? 'AI 拆的' : '本地规则粗拆') + '</span></div>';
  h += '<div class="box"><span class="k">你其实在赌</span>' + esc(d.bet || '—') + '</div>';
  h += '<div class="two">' + block('事实（能核对的）', 'f', d.facts) +
       block('猜测（你加上去的）', 'g', d.guesses) + '</div>';
  if(d.unknowns && d.unknowns.length){
    h += '<div class="line"><span class="k">你没提到的</span><span>' +
         d.unknowns.map(esc).join('<br>') + '</span></div>';
  }
  if(d.counter){
    h += '<div class="line"><span class="k">反方视角</span><span>' + esc(d.counter) + '</span></div>';
  }
  if(d.check){
    h += '<div class="line check"><span class="k">去查</span><span class="v">' + esc(d.check) + '</span></div>';
  }
  h += '<div class="save"><select id="days">' +
       '<option value="30" selected>30 天后回访</option>' +
       '<option value="7">7 天后回访</option>' +
       '<option value="90">90 天后回访</option></select>' +
       '<button class="btn primary" id="saveBtn" type="button">记进本子</button></div></div>';
  out.innerHTML = h;
  $('saveBtn').onclick = saveRec;
}

function saveRec(){
  var f = formState();
  var days = Number($('days').value) || 30;
  var at = todayStr();
  recs.unshift({
    id:'c' + Date.now(), at:at, text:f.text, lean:f.lean,
    conf:Number($('conf').value) || 70, ai:S.data, source:S.source,
    days:days, due:addDays(at, days), outcome:null, note:'', reviewedAt:null
  });
  save(K_REC, recs);
  $('caseText').value = ''; $('lean').value = '';
  $('conf').value = 70; $('confN').textContent = '70%';
  S.data = null; S.err = ''; S.source = '';
  refreshForm(); renderOut(); renderBook();
  toast('记进本子，' + days + ' 天后提醒你回访');
  var b = $('book');
  if(b && b.scrollIntoView){ b.scrollIntoView({ behavior:'smooth', block:'start' }); }
}

/* ---------- 本子 ---------- */
function statCell(n, label){
  return '<div class="stats-i"><div class="stats-n">' + n + '</div><div class="stats-l">' +
         label + '</div></div>';
}
function dueItem(r){
  return '<div class="item due">' +
    '<div class="item-t">' + esc(titleOf(r)) + '</div>' +
    '<div class="item-m"><span class="badge o">该回访</span><span>报 ' + r.conf + '%</span>' +
      '<span>' + esc(r.at) + '</span></div>' +
    '<div class="kv"><b>打算：</b>' + esc(r.lean) + '</div>' +
    (r.ai && r.ai.bet ? '<div class="kv"><b>你当时在赌：</b>' + esc(r.ai.bet) + '</div>' : '') +
    '<textarea id="note_' + r.id + '" placeholder="实际发生了什么（可空）"></textarea>' +
    '<div class="btn-row">' +
      '<button class="btn sm" type="button" data-yes="' + r.id + '">发生了</button>' +
      '<button class="btn sm" type="button" data-no="' + r.id + '">没发生</button>' +
      '<button class="btn sm" type="button" data-del="' + r.id + '">删掉</button></div></div>';
}
function pendItem(r, today){
  return '<div class="item"><div class="item-t">' + esc(titleOf(r)) + '</div>' +
    '<div class="item-m"><span class="badge n">等结果</span><span>报 ' + r.conf + '%</span>' +
      '<span>' + Math.max(1, daysBetween(today, r.due)) + ' 天后回访</span>' +
      '<button class="lnk" type="button" data-early="' + r.id + '">现在就回访</button>' +
      '<button class="lnk" type="button" data-del="' + r.id + '">删掉</button></div>' +
    '<div class="kv"><b>打算：</b>' + esc(r.lean) + '</div></div>';
}
function doneItem(r){
  var yes = r.outcome === 'yes';
  var note = '';
  if(yes && r.conf >= 80){ note = '报得很高，它真发生了'; }
  else if(yes && r.conf <= 65){ note = '报得偏低，结果比你想的顺'; }
  else if(!yes && r.conf >= 80){ note = '报得很高，结果没发生 —— 这次是高估'; }
  else if(!yes && r.conf <= 65){ note = '你本来就留了余地，结果确实没成'; }
  return '<div class="item"><div class="item-t">' + esc(titleOf(r)) + '</div>' +
    '<div class="item-m"><span class="badge ' + (yes ? 'g' : 'o') + '">' +
      (yes ? '发生了' : '没发生') + '</span><span>报 ' + r.conf + '%</span>' +
      (note ? '<span class="mini">' + esc(note) + '</span>' : '') + '</div>' +
    '<div class="kv"><b>当初打算：</b>' + esc(r.lean) + '</div>' +
    (r.note ? '<div class="kv"><b>结果：</b>' + esc(r.note) + '</div>' : '') + '</div>';
}
function calibCard(done){
  var n = done.length;
  var hits = done.filter(function(r){ return r.outcome === 'yes'; }).length;
  var rate = hits / n;
  var avg = done.reduce(function(s, r){ return s + r.conf; }, 0) / n;
  var gap = avg / 100 - rate;
  var verdict;
  if(gap > 0.12){ verdict = '你报的把握比实际高 ' + Math.round(gap * 100) + ' 个百分点，而且不是一两次的事。'; }
  else if(gap < -0.12){ verdict = '你比自己以为的保守 —— 说六成的事，实际发生得更多。'; }
  else { verdict = '你报的把握和实际差不多，心里那杆秤是准的。'; }

  var buckets = {};
  done.forEach(function(r){
    var b = Math.floor(r.conf / 5) * 5;
    buckets[b] = buckets[b] || { n:0, hit:0 };
    buckets[b].n++;
    if(r.outcome === 'yes'){ buckets[b].hit++; }
  });
  var bars = Object.keys(buckets).map(Number).sort(function(a, b){ return a - b; }).map(function(b){
    var x = buckets[b], act = Math.round(x.hit / x.n * 100);
    return '<div class="bar-row"><div class="bar-lab"><span>你说 ' + b + '% · ' + x.n + ' 条</span>' +
      '<span>实际 ' + act + '%</span></div><div class="bar claim"><i style="width:' + b + '%"></i></div>' +
      '<div class="bar" style="margin-top:4px"><i style="width:' + act + '%"></i></div></div>';
  }).join('');

  return '<div class="card"><div class="card-h">校准</div>' +
    '<div class="mini">浅条是你声称的把握，绿条是实际发生的比例。</div>' + bars +
    '<div class="kv" style="margin-top:14px">回访 ' + n + ' 条，平均报 ' + Math.round(avg) +
      '% 把握，实际发生 ' + Math.round(rate * 100) + '%。' + (n >= 5 ? esc(verdict) : '') + '</div>' +
    (n < 5 ? '<div class="mini" style="margin-top:6px">样本还少，攒到 5 条以上再看趋势。</div>' : '') +
    '</div>';
}
function renderBook(){
  var today = todayStr();
  var due = recs.filter(function(r){ return !r.outcome && r.due <= today; });
  var pend = recs.filter(function(r){ return !r.outcome && r.due > today; });
  var done = recs.filter(function(r){ return !!r.outcome; });

  var h = '<div class="sec-t">本子</div><div class="card"><div class="stats">' +
    statCell(recs.length, '记录') + statCell(due.length + pend.length, '待回访') +
    statCell(done.length, '已回访') + '</div>' +
    (recs.length ? '' : '<div class="empty">还没有记录。上面记下第一个判断，到期回来对答案。</div>') +
    '</div>';
  if(due.length){ h += '<div class="sec-t">该回访了（' + due.length + '）</div>' + due.map(dueItem).join(''); }
  if(pend.length){ h += '<div class="sec-t">等结果</div>' + pend.map(function(r){ return pendItem(r, today); }).join(''); }
  if(done.length){ h += '<div class="sec-t">已回访（' + done.length + '）</div>' + done.map(doneItem).join(''); }
  if(done.length){ h += calibCard(done); }
  $('book').innerHTML = h;
  bindBook();
}
function review(id, val){
  var noteEl = $('note_' + id);
  var note = noteEl ? noteEl.value.trim() : '';
  recs.forEach(function(r){
    if(r.id === id){ r.outcome = val; r.note = note; r.reviewedAt = todayStr(); }
  });
  save(K_REC, recs);
  renderBook();
  toast(val === 'yes' ? '记下了：发生了' : '记下了：没发生');
}
function bindBook(){
  function each(attr, fn){
    Array.prototype.forEach.call(document.querySelectorAll('[' + attr + ']'), function(b){
      b.onclick = function(){ fn(b.getAttribute(attr)); };
    });
  }
  each('data-yes', function(id){ review(id, 'yes'); });
  each('data-no', function(id){ review(id, 'no'); });
  each('data-del', function(id){
    if(!confirm('删掉这条记录？')){ return; }
    recs = recs.filter(function(r){ return r.id !== id; });
    save(K_REC, recs); renderBook();
  });
  each('data-early', function(id){
    recs.forEach(function(r){ if(r.id === id){ r.due = todayStr(); } });
    save(K_REC, recs); renderBook();
  });
}

function init(){
  recs = load(K_REC, []) || [];
  $('conf').oninput = function(){ $('confN').textContent = $('conf').value + '%'; };
  ['caseText', 'lean'].forEach(function(id){ $(id).oninput = refreshForm; });
  $('caseText').onkeydown = function(e){
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ analyze(); }
  };
  $('goBtn').onclick = analyze;
  refreshForm(); renderOut(); renderBook();
  fetch('/judgement-trainer/api/status').then(function(r){ return r.json(); }).then(function(d){
    S.ai = !!(d && d.ai);
    refreshForm();
  }).catch(function(){});
}
init();

})();
</script>
</body>
