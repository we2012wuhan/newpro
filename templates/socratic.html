<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4C5AA8">
<title>苏格拉底提问</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<script src="/static/auth-guard.js"></script>
<script src="/static/voice.js"></script>
<script src="/static/export-md.js"></script>
<style>
:root{
  --acc:#4C5AA8; --acc-d:#3B4685; --acc-l:#EEF0FA; --acc-line:#CBD2EC;
  --ink:#1F2A37; --text:#3B4859; --muted:#8492A3;
  --bg:#F6F7FA; --card:#FFFFFF; --line:#E6EAF0;
  --ok:#3F7A5B; --ok-l:#EDF6F1; --ok-line:#CFE6DA;
  --warn:#9E6A2C; --warn-l:#FBF3E8; --warn-line:#EBDCC0;
  --err:#C0392B; --err-l:#FBEDEB; --err-line:#EFD3CE;
  --r:16px; --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -14px rgba(16,24,40,.18);
  --bg-blur:rgba(246,247,250,.9); --field:#FFFFFF; --soft:#F3F5F8;
  --focus-ring:0 0 0 3px rgba(76,90,168,.1);
}
[data-theme="dark"]{
  --acc:#93A0E8; --acc-d:#B3BCF2; --acc-l:#1A1D33; --acc-line:#343A63;
  --ink:#EDEFF7; --text:#C6CBDD; --muted:#8B93AB;
  --bg:#101322; --card:#171A2B; --line:#282D45;
  --ok:#7CC79E; --ok-l:#12261E; --ok-line:#2A4536;
  --warn:#E0A868; --warn-l:#241C10; --warn-line:#453722;
  --err:#FF9B8F; --err-l:#2A1416; --err-line:#52282C;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.5);
  --bg-blur:rgba(16,19,34,.92); --field:#1B1F33; --soft:#20253C;
  --focus-ring:0 0 0 3px rgba(147,160,232,.16);
  color-scheme:dark;
}
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .btn.primary:hover{color:#12162A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg-blur);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.back{margin-left:auto;flex:0 0 auto;font-size:13px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;white-space:nowrap}
.back:hover{color:var(--ink);border-color:var(--acc-line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);margin-top:14px}
.card-h{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.card-sub{font-size:12.5px;color:var(--muted);line-height:1.65}
.mini{font-size:11.5px;color:var(--muted);line-height:1.7}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:20px 2px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:var(--field);outline:none;min-height:80px;resize:vertical;line-height:1.7;color:var(--ink)}
textarea:focus{border-color:var(--acc-line);box-shadow:var(--focus-ring)}
textarea::placeholder{color:var(--muted);opacity:.72}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--acc-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.primary:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;
  background:var(--acc-l);color:var(--acc);border:1px solid var(--acc-line)}
.badge.n{background:var(--soft);color:var(--muted);border-color:var(--line)}
.badge.g{background:var(--ok-l);color:var(--ok);border-color:var(--ok-line)}
.steps4{margin:14px 0 0;padding:0;list-style:none;counter-reset:s4}
.steps4 li{counter-increment:s4;position:relative;padding-left:30px;font-size:12.5px;color:var(--muted);
  line-height:1.6;margin-bottom:7px}
.steps4 li::before{content:counter(s4);position:absolute;left:0;top:1px;width:20px;height:20px;
  border-radius:50%;background:var(--acc-l);color:var(--acc);border:1px solid var(--acc-line);
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps4 li b{color:var(--ink);font-weight:600}

/* ===== 进度条 ===== */
.prog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.prog-i{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--field);color:var(--muted)}
.prog-i i{font-style:normal;font-size:10.5px;width:15px;height:15px;border-radius:50%;
  background:var(--soft);display:flex;align-items:center;justify-content:center}
.prog-i.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:600}
.prog-i.on i{background:var(--acc);color:#fff}
.prog-i.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-l)}
.prog-i.done i{background:var(--ok);color:#fff}

/* ===== 对话 ===== */
.msg{margin-top:14px;display:flex;flex-direction:row;align-items:flex-start;gap:9px}
.msg.me{flex-direction:row-reverse}
.msg .col{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.me .col{align-items:flex-end}
.av{flex:0 0 34px;width:34px;height:34px;border-radius:11px;overflow:hidden;
  background:var(--soft);border:1px solid var(--line)}
.av svg{display:block;width:100%;height:100%}
.who{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:flex;gap:7px;align-items:center}
.bubble{border:1px solid var(--line);background:var(--field);border-radius:14px;padding:11px 14px;
  font-size:15px;line-height:1.75;color:var(--ink);max-width:min(100%,560px);white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{border-top-left-radius:4px;box-shadow:inset 3px 0 0 var(--acc-line)}
.msg.me .bubble{border-top-right-radius:4px;background:var(--acc-l);border-color:var(--acc-line)}
.msg.think .bubble{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13.5px}
.bubble.typing::after{content:'\258D';margin-left:2px;color:var(--acc);opacity:.6;
  animation:caret 1.05s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.finish{border:1px solid var(--ok-line);background:var(--ok-l);color:var(--ok);border-radius:12px;
  padding:11px 14px;font-size:12.5px;line-height:1.7;margin-top:14px}

/* ===== 输入 ===== */
.composer{position:sticky;bottom:0;z-index:2;background:var(--card);border-top:1px dashed var(--line);margin-top:16px;padding:12px 0 4px}
.composer-row{display:flex;align-items:center;gap:10px;margin-top:9px}
.composer-row .mini{flex:1 1 auto}
.composer-row .btn{flex:0 0 auto}

/* ===== 右侧历史 ===== */
.hist-i{display:flex;align-items:stretch;gap:4px;margin-top:8px}
.hist-open{flex:1 1 auto;min-width:0;text-align:left;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--field);cursor:pointer;transition:border-color .15s,background .15s}
.hist-open:hover{border-color:var(--acc-line);background:var(--acc-l)}
.hist-i.on .hist-open{border-color:var(--acc);background:var(--acc-l);box-shadow:inset 3px 0 0 var(--acc)}
.hist-t{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-m{display:block;font-size:11px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-del{flex:0 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--field);
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.hist-del:hover{color:var(--err);border-color:var(--err-line);background:var(--err-l)}
.col-main{min-width:0}
/* ===== 右侧历史：搜索框 ===== */
.hsearch{position:relative;margin-top:6px}
.hsearch input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 34px 10px 12px;
  background:var(--field);color:var(--ink);font-family:inherit;font-size:14px;outline:none;min-height:42px}
.hsearch input:focus{border-color:var(--acc-line);box-shadow:var(--focus-ring)}
.hsearch input::placeholder{color:var(--muted);opacity:.72}
.hq-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border:0;border-radius:50%;background:var(--soft);color:var(--muted);cursor:pointer;
  font-size:15px;line-height:1;padding:0}
.hq-clear:hover{color:var(--err)}
.hq-info{margin-top:6px}
.hq-info:empty{display:none}
#history mark{background:var(--acc-l);color:var(--acc);border-radius:3px;padding:0 1px}
.hist-s{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:1100px){
  .topbar-in,.wrap{max-width:1180px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}
  .col-side{position:sticky;top:78px}
}
.err{background:var(--err-l);border:1px solid var(--err-line);border-radius:12px;padding:11px 14px;
  font-size:13px;color:var(--err);margin-top:12px;line-height:1.7}
.warnbox{background:var(--warn-l);border:1px solid var(--warn-line);border-radius:12px;padding:11px 14px;
  font-size:13px;color:var(--warn);margin-top:12px;line-height:1.7}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--acc);animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bubble.typing::after{animation:none;opacity:.6}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:50;
  background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;
  font-size:13.5px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 朗读 ===== */
.vctl{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.vbtn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--field);color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.vbtn:hover{border-color:var(--acc-line);color:var(--ink)}
.vbtn.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:600}
.vbtn[hidden]{display:none}
.say{margin-top:6px;display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0;
  background:none;border:0;color:var(--muted);font-size:11.5px;cursor:pointer}
.say:hover{color:var(--acc)}
.say.on{color:var(--acc);font-weight:600}
.xbtn{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--field);color:var(--muted);font-family:inherit;font-size:12.5px;cursor:pointer}
.xbtn:hover{border-color:var(--acc-line);color:var(--ink)}
.xbtn:disabled{opacity:.55;cursor:default}
.linerow{display:flex;align-items:center;gap:10px}
.linerow .mini{flex:1 1 auto;min-width:0}
.hist-exp{flex:0 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--field);
  color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer}
.hist-exp:hover{color:var(--acc);border-color:var(--acc-line);background:var(--acc-l)}
.hist-exp:disabled{opacity:.55;cursor:default}
@media (max-width:560px){
  .vbtn{padding:0 9px;font-size:12px}
  .back{padding:8px 10px;font-size:12.5px}
  .linerow{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div>
      <div class="ttl">苏格拉底提问</div>
      <div class="sub">它只会问你问题，不会替你回答</div>
    </div>
    <a class="back" href="/">← 返回工具箱</a>
    <div class="vctl" id="vctl" hidden>
      <button class="vbtn" id="vStop" type="button" hidden>⏹ 停</button>
      <button class="vbtn" id="vAuto" type="button" aria-pressed="false">🔊 自动朗读</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="col-main">
    <section id="start"></section>
    <section id="chat"></section>
  </div>
  <aside class="col-side">
    <div class="card">
      <div class="card-h">历史记录</div>
      <div class="hsearch">
        <input type="text" id="hq" placeholder="搜标题、问过的话、聊过的内容" autocomplete="off" spellcheck="false" aria-label="搜索历史记录">
        <button class="hq-clear" id="hqClear" type="button" title="清空搜索" hidden>×</button>
      </div>
      <div class="hq-info mini" id="hqInfo"></div>
      <div id="history"></div>
    </div>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
/* 「记录总览」直接跳过来用的：地址上带 ?r=<记录 id> 就打开那一条 */
var deepOpened = false;
function wantRecId(){
  try{
    var m = /[?&]r=([0-9]+)/.exec(window.location.search || '');
    return m ? m[1] : '';
  }catch(e){ return ''; }
}


var STEPS = ['澄清问题', '已有信息', '换个视角', '推导结论'];

var S = {
  ai: true, busy: false, err: '',
  sid: null, sess: null, draft: '',
  items: [], listErr: '', hq: '', hit: null, listBusy: false,
  pin: true, _offScroll: null        // 流式期间要不要跟着往下贴；用户一滚就放手
};

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

/* ===================== 朗读（/static/voice.js） =====================
   用浏览器自带语音，不联网、不花钱、不用后端。
   没引到 voice.js、或浏览器不支持，整块朗读自动消失，页面照常用。 */
var VOICE = (window.TBVoice && window.TBVoice.available()) ? window.TBVoice : null;
var sayTexts = [];         // 这一屏里每条引导者回复的原文，按钮上的 data-say 就是它的下标
var autoReadNext = false;  // 这一次回复取回来之后要不要念

/* 把「正在念哪条」标到按钮上。聊天区整块会被重画，所以每次重画后都要再对一次。 */
function syncSay(st){
  if(!VOICE){ return; }
  st = st || { speaking: VOICE.isSpeaking(), text: VOICE.currentText() };
  var cur = String(st.text || '');
  Array.prototype.forEach.call(document.querySelectorAll('.say[data-say]'), function(b){
    var t = sayTexts[Number(b.getAttribute('data-say'))] || '';
    var on = !!(st.speaking && t && t === cur);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  var sb = $('vStop');
  if(sb){ sb.hidden = !st.speaking; }
}

function syncAuto(){
  var b = $('vAuto');
  if(b && VOICE){ b.classList.toggle('on', VOICE.autoOn()); }
}

function bindSay(){
  if(!VOICE){ return; }
  Array.prototype.forEach.call(document.querySelectorAll('.say[data-say]'), function(b){
    b.onclick = function(){
      var t = sayTexts[Number(b.getAttribute('data-say'))] || '';
      if(t){ VOICE.toggle(t); }
    };
  });
}

/* 念最后一条引导者说的话 */
function autoReadLast(){
  if(!VOICE || !VOICE.autoOn()){ return; }
  var msgs = (S.sess && S.sess.msgs) || [];
  for(var i = msgs.length - 1; i >= 0; i--){
    if(msgs[i].role !== 'me' && msgs[i].text){ VOICE.speak(msgs[i].text); return; }
  }
}

function initVoice(){
  var box = $('vctl');
  if(!VOICE){ if(box){ box.hidden = true; } return; }
  if(box){ box.hidden = false; }
  VOICE.on(syncSay);
  VOICE.on(syncAuto);
  var auto = $('vAuto');
  if(auto){
    auto.onclick = function(){
      var on = !VOICE.autoOn();
      VOICE.setAuto(on);
      syncAuto();
      if(!on){ VOICE.stop(); return; }
      toast(VOICE.hasZhVoice() ? '新回复会自动念出来' : '这台设备好像没装中文语音，念起来可能有点怪');
    };
  }
  var sb = $('vStop');
  if(sb){ sb.onclick = function(){ VOICE.stop(); }; }
}

/* ===================== 导出 Markdown（/static/export-md.js） =====================
   拼文本、起文件名、落盘这些活都在那个公共件里，这里只管「把这段对话拼成
   什么形状」。没引到 export-md.js 时导出按钮不出现，页面照常用。 */
var EX = (window.TBExport && typeof window.TBExport.chat === 'function') ? window.TBExport : null;

function expName(s){
  return '苏格拉底提问 ' + ((s && (s.title || s.ask)) || '对话');
}

function expMarkdown(s){
  if(!EX || !s){ return ''; }
  var step = Number(s.step) || 1;
  var turns = ((s.msgs) || []).map(function(m){
    var me = m.role === 'me';
    var n = Number(m.step) || 0;
    return {
      name: me ? '我' : '引导者',
      note: me ? ('第 ' + (n || step) + ' 步')
               : (n > 0 ? ('第 ' + n + ' 步 · ' + stepName(n)) : ''),
      text: m.text
    };
  });
  return EX.chat({
    title: '苏格拉底提问｜' + ((s.title || s.ask) || '未命名'),
    meta: [
      ['想理清的事', s.ask || '—'],
      ['走到', s.finished ? '四步走完了' : ('第 ' + step + ' 步 · ' + stepName(step))],
      ['条数', turns.length + ' 条'],
      ['开始', s.started_at || '—'],
      ['最后更新', s.updated_at || '—']
    ],
    turns: turns
  });
}

/* 手上就有全文的：直接存 */
function exportSession(s){
  if(!EX){ toast('导出件没加载，刷新一下页面'); return; }
  EX.run({ md: expMarkdown(s), filename: EX.filename(expName(s)) }, {
    done: function(ok){ toast(ok ? 'Markdown 存下来了' : '没存下来，再点一次'); }
  });
}

/* 从右侧历史点一条：列表里不带正文，先把这条拉下来再存 */
function exportById(id, btn){
  if(!EX){ toast('导出件没加载，刷新一下页面'); return; }
  if(btn){ btn.disabled = true; }
  req('GET', '/socratic/api/sessions/' + id).then(function(d){
    if(btn){ btn.disabled = false; }
    if(!d.ok || !d.session){ toast(d.message || '这条读不出来'); return; }
    exportSession(d.session);
  });
}

/* 后端出错时也带 message，别让页面只看到「失败」两个字 */
function req(method, path, body){
  var opt = { method:method, headers:{} };
  if(body !== undefined){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function(r){
    return r.text().then(function(txt){
      var d = {};
      try{ d = JSON.parse(txt) || {}; }catch(e){ d = {}; }
      if(d.ok === undefined){ d.ok = r.ok; }
      if(!d.ok && !d.message){ d.message = '服务返回 ' + r.status; }
      return d;
    });
  }).catch(function(){ return { ok:false, message:'请求失败，看看服务还在不在' }; });
}

/* 流式请求：服务端一个字一个字推（SSE 的 data: 行里包着 JSON），边收边回调。
   返回值：全部成功 -> {ok:true, cut:''}；一个字都没拿到 -> {ok:false, message}。
   cut 有值表示「模型说到一半断了，但这段已经存进库了」——
   这时候不能把文字撤掉，只能提示一句。 */
function streamReq(path, body, onEvent){
  return fetch(path, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    // 开流之前就出错（没配 key / 找不到会话 / 没登录），拿到的还是普通 JSON
    if(!r.ok || !r.body || !r.body.getReader){
      return r.text().then(function(txt){
        var d = {};
        try{ d = JSON.parse(txt) || {}; }catch(e){ d = {}; }
        return { ok:false, message: d.message || ('服务返回 ' + r.status) };
      });
    }
    var reader = r.body.getReader();
    var dec = new TextDecoder('utf-8');
    var buf = '', out = {};

    function drain(raw){
      var lines = raw.split('\n');
      for(var i = 0; i < lines.length; i++){
        var line = lines[i];
        if(line.indexOf('data:') !== 0){ continue; }
        var payload = line.slice(5).trim();
        if(!payload){ continue; }
        var d = null;
        try{ d = JSON.parse(payload); }catch(e){ continue; }
        if(!d){ continue; }
        if(d.err){ out.err = d.err; continue; }
        if(d.cut){ out.cut = d.cut; continue; }
        if(onEvent){ onEvent(d); }
      }
    }
    function pump(){
      return reader.read().then(function(res){
        if(res.done){ drain(buf); buf = ''; return; }
        buf += dec.decode(res.value, { stream:true });
        var i;
        while((i = buf.indexOf('\n\n')) >= 0){
          drain(buf.slice(0, i));
          buf = buf.slice(i + 2);
        }
        return pump();
      });
    }
    return pump().then(function(){
      if(out.err){ return { ok:false, message: out.err }; }
      return { ok:true, cut: out.cut || '' };
    });
  }).catch(function(){
    return { ok:false, message:'连接断了，看看服务还在不在' };
  });
}

function stepName(n){
  n = Number(n) || 0;
  if(n <= 0){ return '开场'; }
  return STEPS[Math.min(n, STEPS.length) - 1];
}
function shortTime(t){
  var s = String(t || '');
  return s.length >= 16 ? s.slice(5, 16) : s;
}

/* ===================== 头像 =====================
   由 seed 算出来的一张小图，不用图片、不用网络。
   同一个 seed 永远长一样 —— 所以一段对话里的头像不会刷一次变一次，
   换个新对话才会换一张脸。 */
var AV_HUES = [214, 246, 268, 292, 326, 6, 26, 44, 152, 176];

function hashOf(str){
  var h = 2166136261;
  for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
/* 确定性随机：seed 相同，抽出来的序列就相同 */
function rngFrom(seed){
  var n = (hashOf(String(seed)) % 2147483647) || 1;
  return function(){ n = (n * 48271) % 2147483647; return n / 2147483647; };
}
/* 5×5 左右对称的方块阵，比纯色圆点更像一张「脸」 */
function cellRect(x, y){
  var c = 20;
  return '<rect x="' + (x * c + 1) + '" y="' + (y * c + 1) + '" width="' + (c - 2) +
         '" height="' + (c - 2) + '" rx="4"/>';
}
function avatarSVG(seed){
  var rnd = rngFrom(seed);
  var hue = AV_HUES[Math.floor(rnd() * AV_HUES.length)];
  var body = '', count = 0;
  for(var y = 0; y < 5; y++){
    for(var x = 0; x < 3; x++){
      if(rnd() < 0.46){ continue; }
      count++;
      body += cellRect(x, y);
      if(x < 2){ body += cellRect(4 - x, y); }
    }
  }
  if(!count){ body = cellRect(2, 2); }   // 极小概率抽到全空，补一块，别给个白板
  return '<span class="av" style="color:hsl(' + hue + ',46%,52%)" aria-hidden="true">' +
    '<svg viewBox="-8 -8 116 116"><g fill="currentColor">' + body + '</g></svg></span>';
}

/* ===================== 开始那个卡片 ===================== */
function renderStart(){
  var el = $('start');
  if(S.sid){ el.innerHTML = ''; return; }
  var h = '<div class="card"><div class="card-h">把你现在纠结的那件事，写一句话</div>' +
    '<div class="card-sub">它不会给你答案，会陪你按四步把这件事想清楚。一次只问你一个问题。</div>' +
    '<textarea id="ask" style="margin-top:12px;min-height:76px;font-size:15.5px" ' +
      'placeholder="例：我该不该辞职去做独立开发"></textarea>' +
    '<button class="btn primary block big" id="goBtn" style="margin-top:14px">开始梳理</button>' +
    '<div class="mini" id="goTip" style="text-align:center;margin-top:8px"></div>' +
    '<ol class="steps4">' +
      '<li><b>澄清问题</b>你想理的到底是什么</li>' +
      '<li><b>已有信息</b>你已经知道什么、哪些还只是猜的</li>' +
      '<li><b>换个视角</b>你还没想到的角度、别人的立场</li>' +
      '<li><b>推导结论</b>你自己说出打算怎么做</li>' +
    '</ol></div>';
  el.innerHTML = h;

  var ta = $('ask');
  ta.value = S.draft;
  ta.oninput = function(){ S.draft = ta.value; refreshGo(); };
  ta.onkeydown = function(e){
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); start(); }
  };
  $('goBtn').onclick = start;
  refreshGo();
  ta.focus();
}

function refreshGo(){
  var b = $('goBtn');
  if(!b){ return; }
  var ok = S.draft.trim().length >= 4;
  b.disabled = !ok || S.busy;
  $('goTip').textContent = S.busy ? '正在读你的问题…'
    : (!S.ai ? '服务端没配模型 Key，这个工具用不了' : (ok ? '' : '写满四个字再开始'));
}

/* ===================== 对话 ===================== */
function renderChat(){
  var el = $('chat');
  if(!S.sid || !S.sess){ el.innerHTML = ''; return; }
  var s = S.sess, msgs = s.msgs || [];
  var step = Number(s.step) || 1;
  var fin = !!s.finished;

  var h = '<div class="card">';
  h += '<div class="prog">';
  for(var i = 0; i < STEPS.length; i++){
    var n = i + 1;
    var cls = fin ? 'done' : (n < step ? 'done' : (n === step ? 'on' : ''));
    h += '<span class="prog-i ' + cls + '"><i>' + (n < step || fin ? '✓' : n) + '</i>' + STEPS[i] + '</span>';
  }
  h += '</div>';
  h += '<div class="linerow"><div class="mini">你在理的这件事：' + esc(s.ask || '') + '</div>' +
    (EX ? '<button class="xbtn" type="button" id="expNow" title="把这段对话存成 Markdown">⤓ 导出</button>' : '') +
    '</div>';

  var avG = avatarSVG('guide-' + (s.id != null ? s.id : S.sid));   // 这段对话里的引导者
  var avMe = avatarSVG('me');                                      // 我，一直是我
  sayTexts = [];
  msgs.forEach(function(m){
    if(m.role === 'me'){
      h += '<div class="msg me">' + avMe + '<div class="col"><div class="who">我</div>' +
           '<div class="bubble">' + esc(m.text) + '</div></div></div>';
    } else {
      var tag = m.step > 0 ? '<span class="badge n">第 ' + m.step + ' 步 · ' + stepName(m.step) + '</span>' : '';
      var say = VOICE ? '<button class="say" type="button" data-say="' + sayTexts.length +
        '" aria-pressed="false" title="把这个问题念出来">🔊 朗读</button>' : '';
      sayTexts.push(m.text);
      h += '<div class="msg ai">' + avG + '<div class="col"><div class="who">引导者 ' + tag + '</div>' +
           '<div class="bubble">' + esc(m.text) + '</div>' + say + '</div></div>';
    }
  });

  if(S.busy){ h += '<div class="msg ai think">' + avG + '<div class="col"><div class="bubble">' +
    '<span class="spin"></span>它在想下一个问题…</div></div></div>'; }

  if(S.err){ h += '<div class="err">' + esc(S.err) + '</div>'; }

  if(fin){
    h += '<div class="finish">四步走完了。上面那段是它把你自己说过的话串起来的 —— ' +
         '结论是你自己得的，它一个字的建议都没加。想接着聊，直接说就行。</div>';
  }

  h += '<div class="composer">' +
    '<textarea id="say" rows="2" placeholder="' + (fin ? '还想接着聊就写在这儿…' : '写下你的回答…') + '"></textarea>' +
    '<div class="composer-row"><span class="mini">Enter 发送 · Shift+Enter 换行 · ' +
    '想不出来就说「先跳过」</span>' +
    '<button class="btn primary" id="sendBtn">发送</button></div>' +
    '</div>';
  h += '</div>';
  el.innerHTML = h;
  bindSay();
  syncSay();
  var expNow = $('expNow');
  if(expNow){ expNow.onclick = function(){ exportSession(S.sess); }; }

  var ta = $('say');
  if(ta){
    ta.value = S.draft;
    // 少了 refreshSend()：键盘输入后 S.draft 有值了，但「发送」按钮还是灰的，
    // 只有按 Enter 能发出去，鼠标点按钮点不动。
    ta.oninput = function(){ S.draft = ta.value; refreshSend(); };
    ta.onkeydown = function(e){
      if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
    };
  }
  var sb = $('sendBtn');
  if(sb) sb.onclick = send;
  refreshSend();
  if(S.focusSay && ta){
    ta.focus({ preventScroll:true });   // 别让 focus 自己乱滚，滚哪儿由下面决定
    S.focusSay = false;
    scrollToNewest(el);
  }
}

/* 滚到最新那条消息。
   之前滚的是 .composer，但输入框是 position:sticky、永远贴在视口底部，
   浏览器认为它「本来就可见」，对它调 scrollIntoView 基本不生效 ——
   新回复于是被吸底的输入框压住，非要手动往下拉一下才看得见。
   改成滚最后一条消息本身，就不会再有这个毛病：
   · 这条装得下 → 贴到输入框上方（跟正常聊天一样）
   · 这条装不下 → 从第一行开始显示，长回复也能从头读 */
function scrollToNewest(el){
  var cp = el.querySelector('.composer');
  if(!cp){ return; }
  var last = cp.previousElementSibling;        // 输入框上面那一块：消息 / 报错 / 收尾提示
  if(!last || !last.scrollIntoView){ return; }
  var bar = document.querySelector('.topbar');
  var top = (bar ? bar.offsetHeight : 0) + 12;  // 顶栏是吸顶的，别让它盖住第一行
  var bottom = cp.offsetHeight + 12;            // 输入框是吸底的，别让它盖住最后一行
  last.style.scrollMarginTop = top + 'px';
  last.style.scrollMarginBottom = bottom + 'px';
  var room = window.innerHeight - top - bottom;
  setTimeout(function(){
    last.scrollIntoView({ behavior:'smooth', block: last.offsetHeight <= room ? 'end' : 'start' });
  }, 40);
}

/* ===================== 流式专用 ===================== */

/* 用户现在是不是贴着底看？贴着我才会自动跟着滚；
   他已经翻上去看前面了，就别硬把他拽回来。 */
function nearBottom(){
  var doc = document.documentElement;
  var y = window.scrollY || doc.scrollTop || 0;
  return (doc.scrollHeight - y - window.innerHeight) <= 140;
}

/* 跟着最新那条往下贴。流式期间不能用 smooth ——
   每来一个字都触发一次平滑滚动，几路动画会互相打架，看起来就是在抖。 */
function pinBottom(){
  var el = $('chat');
  if(!el){ return; }
  var cp = el.querySelector('.composer');
  if(!cp){ return; }
  var last = cp.previousElementSibling;
  if(!last || !last.scrollIntoView){ return; }
  var bar = document.querySelector('.topbar');
  var top = (bar ? bar.offsetHeight : 0) + 12;
  var bottom = cp.offsetHeight + 12;
  last.style.scrollMarginTop = top + 'px';
  last.style.scrollMarginBottom = bottom + 'px';
  var room = window.innerHeight - top - bottom;
  last.scrollIntoView({ block: last.offsetHeight <= room ? 'end' : 'start' });
}

/* 只认「用户自己的手势」，不听 scroll 事件 ——
   滚动事件分不清是他在滚还是我们在滚，会自己把自己关掉。 */
function watchScroll(){
  S.pin = nearBottom();
  function off(){ S.pin = false; }
  S._offScroll = function(){
    window.removeEventListener('wheel', off);
    window.removeEventListener('touchmove', off);
    S._offScroll = null;
  };
  window.addEventListener('wheel', off, { passive:true });
  window.addEventListener('touchmove', off, { passive:true });
}
function unwatchScroll(){
  if(S._offScroll){ S._offScroll(); }
}

/* 把那个「它在想…」的占位气泡就地接管成真正的回复气泡。
   之后每个片段只改这个节点的 textContent，不整块重画聊天区 ——
   否则每来一个字都全表重建，会闪，滚动位置也会被搅乱。 */
function streamInto(){
  var el = $('chat');
  if(!el){ return null; }
  var b = el.querySelector('.msg.think .bubble');
  if(!b){ return null; }
  var col = b.parentNode;                  // .col
  var box = col ? col.parentNode : null;   // .msg
  if(box){ box.classList.remove('think'); }
  if(col && !col.querySelector('.who')){
    var st = Number((S.sess || {}).step) || 1;
    var w = document.createElement('div');
    w.className = 'who';
    w.innerHTML = '引导者 <span class="badge n">第 ' + st + ' 步 · ' + esc(stepName(st)) + '</span>';
    col.insertBefore(w, b);
  }
  b.classList.add('typing');
  b.textContent = '';
  return b;
}

/* 流完了从库里把权威状态取回来。屏幕上先照旧显示着刚流出来的字，
   等这一趟回来才整块重画 —— 中间不会出现「文字先消失一下」的闪。 */
function reload(){
  if(!S.sid){ S.busy = false; renderAll(); return; }
  req('GET', '/socratic/api/sessions/' + S.sid).then(function(d){
    S.busy = false;
    if(d.ok){ S.sess = d.session; }
    else { S.err = d.message || '这次会话读不回来了'; }
    S.focusSay = true;
    renderAll();
    loadHistory();
    if(d.ok && autoReadNext){ autoReadNext = false; autoReadLast(); }
  });
}

function refreshSend(){
  var b = $('sendBtn');
  if(!b){ return; }
  b.disabled = S.busy || !S.draft.trim();
  b.textContent = S.busy ? '等它一下…' : '发送';
}

/* ===================== 右侧历史（读的是 SQLite） ===================== */
function loadHistory(){
  var q = (S.hq || '').trim();
  var url = '/socratic/api/sessions' + (q ? ('?q=' + encodeURIComponent(q)) : '');
  S.listBusy = true;
  renderHqInfo();
  req('GET', url).then(function(d){
    S.listBusy = false;
    S.items = (d.ok && d.items) || [];
    S.listErr = d.ok ? '' : (d.message || '读不到历史记录');
    S.hit = d.ok ? { total:(typeof d.total === 'number' ? d.total : S.items.length), q:d.q || '' } : null;
    renderHistory();
  });
}

/* 搜索框下面那行：命中几条 / 没搜到 / 搜着… */
function renderHqInfo(){
  var info = $('hqInfo'), clr = $('hqClear');
  var q = (S.hq || '').trim();
  if(clr){ clr.hidden = !q; }
  if(!info){ return; }
  if(!q || S.listErr){ info.textContent = ''; return; }
  if(S.listBusy){ info.textContent = '搜着…'; return; }
  if(!S.hit){ info.textContent = ''; return; }
  info.textContent = S.hit.total ? ('命中 ' + S.hit.total + ' 条') : '没搜到';
}

/* 把命中的关键词标出来。先 esc 再高亮，顺序不能反。 */
function hl(text, q){
  var out = esc(text);
  var terms = String(q || '').trim().split(/\s+/).filter(Boolean).slice(0, 6)
    .map(function(t){ return esc(t); }).filter(Boolean);
  if(!terms.length){ return out; }
  var re = terms.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  if(!re){ return out; }
  try{ return out.replace(new RegExp('(' + re + ')', 'ig'), '<mark>$1</mark>'); }
  catch(e){ return out; }
}

function hasTerm(text, q){
  var terms = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  var low = String(text || '').toLowerCase();
  for(var i = 0; i < terms.length; i++){ if(low.indexOf(terms[i]) >= 0){ return true; } }
  return false;
}

/* 命中的词要是只在那件「原始需求」里，光看标题不知道为什么命中 —— 抠一句出来。
   列表接口不带整段对话（太重），所以这里能翻的就是它当初写的那件事。 */
function snippet(it, q){
  var terms = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length){ return ''; }
  var fields = [it.ask || '', it.title || ''];
  for(var i = 0; i < fields.length; i++){
    var f = String(fields[i] || '');
    if(!f){ continue; }
    var low = f.toLowerCase(), at = -1;
    for(var k = 0; k < terms.length; k++){
      var pos = low.indexOf(terms[k]);
      if(pos >= 0 && (at < 0 || pos < at)){ at = pos; }
    }
    if(at < 0){ continue; }
    var start = Math.max(0, at - 10);
    var end = Math.min(f.length, at + 46);
    return (start > 0 ? '…' : '') + f.slice(start, end) + (end < f.length ? '…' : '');
  }
  return '';
}

function renderHistory(){
  var el = $('history');
  if(!el){ return; }
  renderHqInfo();
  var q = (S.hq || '').trim();
  if(S.listErr){
    el.innerHTML = '<div class="mini" style="margin-top:6px">' + esc(S.listErr) + '</div>';
    return;
  }
  if(!S.items.length){
    el.innerHTML = '<div class="mini" style="margin-top:6px">' + (q
      ? ('没有含「' + esc(q) + '」的记录。换个词试试，或者它是更早以前的 —— 搜索只看最近 400 条。')
      : '还没有。上面开始聊一次，这里就会留下一条，换台设备也还在。') + '</div>';
    return;
  }
  var h = S.items.map(function(it){
    var cur = String(it.id) === String(S.sid);
    var state = it.finished ? '已收尾' : ('第 ' + (it.step || 1) + ' 步 · ' + stepName(it.step || 1));
    var meta = [state, (it.count || 0) + ' 条', shortTime(it.updated_at)].filter(Boolean).join(' · ');
    var title = it.title || it.ask || '（没写标题）';
    var snip = q ? snippet(it, q) : '';
    var extra = (snip && !hasTerm(title, q)) ? ('<span class="hist-s">' + hl(snip, q) + '</span>') : '';
    return '<div class="hist-i' + (cur ? ' on' : '') + '">' +
      '<button class="hist-open" type="button" data-open="' + it.id + '">' +
        '<span class="hist-t">' + hl(title, q) + '</span>' +
        '<span class="hist-m">' + esc(meta) + '</span>' + extra +
      '</button>' +
      (EX ? '<button class="hist-exp" type="button" data-exp="' + it.id + '" title="导出这条 Markdown">⤓</button>' : '') +
      '<button class="hist-del" type="button" data-del="' + it.id + '" title="删掉这条">×</button>' +
    '</div>';
  }).join('');
  h += '<div class="mini" style="margin-top:10px">' + (q
    ? '点一条就能接着聊。搜索是连对话正文一起找的，中间说过什么词都算。'
    : '点一条就能接着聊，之前说到哪、它问过什么都在。') + '</div>';
  el.innerHTML = h;

  Array.prototype.forEach.call(el.querySelectorAll('[data-open]'), function(b){
    b.onclick = function(){ open(Number(b.getAttribute('data-open'))); };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){ del(Number(b.getAttribute('data-del'))); };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-exp]'), function(b){
    b.onclick = function(){ exportById(b.getAttribute('data-exp'), b); };
  });
}

/* ===================== 动作 ===================== */
function start(){
  var ask = S.draft.trim();
  if(ask.length < 4){ toast('把那件事写长一点'); return; }
  S.busy = true; S.err = '';
  renderStart(); renderChat();
  req('POST', '/socratic/api/sessions', { ask:ask }).then(function(d){
    S.busy = false;
    if(!d.ok){ S.err = d.message || '没能开始，再点一次'; renderStart(); return; }
    S.draft = '';
    S.sess = d.session;
    S.sid = d.session.id;
    S.focusSay = true;
    renderAll();
    loadHistory();
  });
}

function open(id){
  if(String(id) === String(S.sid)){ return; }
  S.busy = true; S.err = ''; S.draft = ''; S.sid = id; S.sess = null;
  renderAll();
  req('GET', '/socratic/api/sessions/' + id).then(function(d){
    S.busy = false;
    if(!d.ok){
      S.sid = null; S.err = '';
      toast(d.message || '打不开这条记录');
      renderAll(); return;
    }
    S.sess = d.session;
    S.focusSay = true;
    renderAll();
  });
}

function send(){
  var text = S.draft.trim();
  if(!text || S.busy || !S.sid){ return; }
  if(VOICE){ VOICE.stop(); }        // 我一开口，就别再念上一条了
  var mine = { role:'me', text:text, at:'', step:Number(S.sess.step) || 1 };
  S.sess.msgs = (S.sess.msgs || []).concat([mine]);
  S.draft = ''; S.busy = true; S.err = '';
  S.focusSay = true;            // 自己发的那条要立刻滚出来，别等回复才动
  renderAll();

  var bubble = null, acc = '';
  watchScroll();
  streamReq('/socratic/api/sessions/' + S.sid + '/reply', { text:text }, function(ev){
    if(!ev.t){ return; }
    acc += ev.t;
    if(!bubble){ bubble = streamInto(); }
    if(!bubble){ return; }
    bubble.textContent = acc;
    if(S.pin){ pinBottom(); }
  }).then(function(d){
    unwatchScroll();
    if(!d.ok || !acc){
      // 一个字都没收到：把他那句撤回输入框，别在屏幕上留半截对话
      S.busy = false;
      S.sess.msgs.pop();
      S.draft = text;
      S.err = d.message || '这次没发出去，再试一次';
      S.focusSay = true;
      renderAll();
      loadHistory();
      return;
    }
    // 说了一半断的：那些字已经存进库了，不能撤，只提示一句
    if(d.cut){ toast(d.cut); }
    autoReadNext = true;              // 取回权威状态、重画完再念，念的是落库后的原文
    reload();
  });
}

function del(id){
  if(!confirm('删掉这条对话记录？删了就找不回来了。')){ return; }
  req('DELETE', '/socratic/api/sessions/' + id).then(function(d){
    if(!d.ok){ toast(d.message || '没删掉'); return; }
    if(String(id) === String(S.sid)){ S.sid = null; S.sess = null; S.err = ''; }
    toast('删掉了');
    renderAll();
    loadHistory();
  });
}

/* 搜索框只在启动时绑一次：它不在 #history 里面，重画列表不会把它冲掉，
   所以打字打一半不会被清空、也不会丢焦点。 */
var hqTimer = null;
function bindSearch(){
  var el = $('hq');
  if(!el){ return; }
  el.value = S.hq || '';
  el.oninput = function(){
    S.hq = el.value;
    renderHqInfo();
    clearTimeout(hqTimer);
    hqTimer = setTimeout(loadHistory, 260);
  };
  el.onkeydown = function(e){
    if(e.key === 'Enter'){ e.preventDefault(); clearTimeout(hqTimer); loadHistory(); }
    else if(e.key === 'Escape'){ el.value = ''; S.hq = ''; clearTimeout(hqTimer); loadHistory(); }
  };
  var clr = $('hqClear');
  if(clr){ clr.onclick = function(){ el.value = ''; S.hq = ''; clearTimeout(hqTimer); loadHistory(); el.focus(); }; }
}

function renderAll(){ renderStart(); renderChat(); refreshSend(); }

/* ===================== 启动 ===================== */
function init(){
  initVoice();
  bindSearch();
  renderAll();
  loadHistory();
  var deepId = wantRecId();
  if(deepId){ open(Number(deepId)); }
  req('GET', '/socratic/api/status').then(function(d){
    S.ai = !!(d && d.ai);
    if(!S.ai){ S.err = '服务端没配模型 Key（DEEPSEEK_API_KEY），这个工具用不了。'; }
    renderAll();
  });
}
init();

})();
</script>
