<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E9384">
<title>OPC 资讯</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<script src="/static/particles.js"></script>
<script src="/static/export-md.js"></script>
<style>
:root{
  --acc:#0E9384; --acc-d:#0B7A6E; --acc-l:#E7F5F2; --acc-line:#BFE1DA;
  --ink:#17262B; --text:#3B4859; --muted:#8492A3;
  --bg:#F5F8F7; --card:#FFFFFF; --line:#E3EAE8;
  --gold:#B7791F; --gold-l:#FBF3E4; --gold-line:#EBD9B4;
  --ok:#1C7A58; --ok-l:#EAF5F0; --ok-line:#C6E2D6;
  --warn:#8A6516; --warn-l:#FBF4E6; --warn-line:#E7D6B0;
  --err:#B23A52; --err-l:#FBEEF1; --err-line:#EED0D7;
  --r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -14px rgba(16,24,40,.18);
  --field:#FFFFFF; --soft:#F1F5F4; --bg-blur:rgba(245,248,247,.9);
  --focus-ring:0 0 0 3px rgba(14,147,132,.14);
}
[data-theme="dark"]{
  --acc:#5EEAD4; --acc-d:#99F6E4; --acc-l:#102A28; --acc-line:#1E4A45;
  --ink:#E8F1EF; --text:#C2CFCC; --muted:#8698A4;
  --bg:#0B1416; --card:#111E21; --line:#1E3134;
  --gold:#FFB454; --gold-l:#241C10; --gold-line:#4A3A22;
  --ok:#7CC79E; --ok-l:#12261E; --ok-line:#2A4536;
  --warn:#E0A868; --warn-l:#241C10; --warn-line:#453722;
  --err:#FF9B8F; --err-l:#2A1416; --err-line:#52282C;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.5);
  --field:#0E1A1D; --soft:#172528; --bg-blur:rgba(11,20,22,.92);
  --focus-ring:0 0 0 3px rgba(94,234,212,.16);
  color-scheme:dark;
}
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .btn.primary:hover{color:#08211E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
h1,h2,h3{margin:0;font-weight:600;color:var(--ink)}
p{margin:0}
.wrap{max-width:840px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg-blur);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:840px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.back{margin-left:auto;flex:0 0 auto;font-size:13px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;white-space:nowrap}
.back:hover{color:var(--ink);border-color:var(--acc-line)}
/* 顶栏下面的导航 */
.tabs{max-width:840px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--field);color:var(--muted);font-family:inherit;font-size:13.5px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:var(--ink);border-color:var(--acc-line)}
.tab.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:600}
/* 资料架 */
.ref-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ref-copy{flex:0 0 auto;margin-left:auto;font-family:inherit;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:var(--field);border-radius:999px;padding:2px 10px;cursor:pointer}
.ref-copy:hover{color:var(--acc);border-color:var(--acc-line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);margin-top:14px}
.card-h{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.card-sub{font-size:12.5px;color:var(--muted);line-height:1.7}
.mini{font-size:11.5px;color:var(--muted);line-height:1.7}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);margin:20px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);
  cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--acc-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;
  background:var(--acc-l);color:var(--acc);border:1px solid var(--acc-line)}
.badge.g{background:var(--ok-l);color:var(--ok);border-color:var(--ok-line)}
.badge.o{background:var(--warn-l);color:var(--warn);border-color:var(--warn-line)}
.badge.r{background:var(--err-l);color:var(--err);border-color:var(--err-line)}
.badge.n{background:var(--soft);color:var(--muted);border-color:var(--line)}
.badge.gold{background:var(--gold-l);color:var(--gold);border-color:var(--gold-line)}
.sbar{display:flex;gap:10px}
.sbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:var(--field);outline:none;min-height:44px;color:var(--ink)}
.sbar input:focus{border-color:var(--acc-line);box-shadow:var(--focus-ring)}
.sbar input::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);
  color:var(--text);font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--acc-line)}
.chip.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:600}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.ctrl select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);
  color:var(--ink);font-size:13.5px;outline:none;min-height:36px}
.ctrl .lab{font-size:12.5px;color:var(--muted)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.meta .mini{flex:1;min-width:160px}
.repo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--sh);margin-top:12px}
.repo-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.repo-n{font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;word-break:break-all;line-height:1.45}
.repo-n:hover{color:var(--acc);text-decoration:underline}
.repo-flags{margin-left:auto;display:flex;gap:6px;flex:none;flex-wrap:wrap}
.repo-m{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.repo-m b{color:var(--ink);font-weight:600}
.repo-d{font-size:13.5px;line-height:1.75;color:var(--text);margin-top:9px}
.repo-d.empty{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--soft);
  border-radius:999px;padding:1px 8px;line-height:1.8}
.ai{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.ai div{font-size:13.5px;line-height:1.7;color:var(--text)}
.ai div+div{margin-top:5px}
.ai .k{display:inline-block;min-width:52px;color:var(--acc);font-weight:600;font-size:12.5px;margin-right:4px}
.insight{background:var(--acc-l);border:1px solid var(--acc-line);border-radius:12px;padding:11px 14px;
  font-size:13.5px;line-height:1.75;color:var(--ink);margin-top:12px}
.insight b{color:var(--acc)}
.err{background:var(--err-l);border:1px solid var(--err-line);border-radius:12px;padding:11px 14px;
  font-size:13.5px;line-height:1.75;color:var(--err);margin-top:12px}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));
  background-size:200% 100%;animation:sk 1.1s linear infinite;height:12px;margin-top:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:currentColor;animation:sp .7s linear infinite;vertical-align:-2px}
.btn:not(.primary) .spin{border-color:var(--line);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:50;
  background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;
  font-size:13.5px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){
  .sbar .btn{min-width:66px;padding:0 14px}
  .repo-flags{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none;opacity:.6}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div>
      <div class="ttl">OPC 资讯</div>
      <div class="sub">GitHub 上值得一人公司看的项目</div>
    </div>
    <a class="back" href="/">← 返回工具箱</a>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="OPC 分区">
    <button class="tab on" type="button" role="tab" data-tab="proj" aria-selected="true">OPC 项目</button>
    <button class="tab" type="button" role="tab" data-tab="ref" aria-selected="false">OPC 资料</button>
  </nav>
</header>

<main class="wrap">
  <section id="panelProj" role="tabpanel" aria-label="OPC 项目">
  <div class="card">
    <div class="sbar">
      <input id="kw" type="text" placeholder="关键词，例如 ai saas starter" autocomplete="off">
      <button class="btn primary" id="goBtn" type="button">搜</button>
    </div>
    <div class="chips" id="topicChips"></div>
    <div class="ctrl">
      <span class="lab">最低 star</span>
      <select id="minStars">
        <option value="0">不限</option>
        <option value="50" selected>50+</option>
        <option value="200">200+</option>
        <option value="1000">1000+</option>
        <option value="3000">3000+</option>
      </select>
      <button class="chip" id="aliveChip" type="button">只看活跃</button>
      <span class="mini" id="quota"></span>
    </div>
  </div>
  <div id="out"></div>
  </section>

  <section id="panelRef" role="tabpanel" aria-label="OPC 资料" hidden>
    <div class="card">
      <div class="sbar">
        <input id="rkw" type="text" placeholder="搜资料：收款、部署、社区、书…" autocomplete="off">
      </div>
      <div class="chips" id="refChips"></div>
      <div class="meta"><span class="mini" id="refMeta"></span>
        <button class="btn sm" id="refExp" type="button">导出这批</button></div>
    </div>
    <div id="refOut"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';

/* ============================================================
   数据都在服务端拼好后返回，这里只负责渲染和本地缓存
   ============================================================ */
var K_AI = 'opc_ai_v1';    // 已经解读过的仓库，按名字存着，换关键词也不丢
var K_CFG = 'opc_cfg_v1';  // 上次用的关键词 / 筛选条件

var TOPICS = [
  ['one person company', '一人公司'],
  ['indie hacker', '独立开发者'],
  ['solo founder', '单人创始'],
  ['indie developer', '独立开发'],
  ['ai saas starter', 'AI SaaS 起步'],
  ['micro saas boilerplate', '微 SaaS 脚手架'],
  ['ai side hustle', 'AI 副业'],
  ['awesome indie hacker', '资源清单']
];

var S = {
  q: 'one person company', minStars: 50, alive: false,
  repos: [], total: 0, remaining: '', ghToken: false,
  ai: false, aiBusy: false, aiErr: '', insight: '', aiSource: '',
  busy: false, err: '', ran: false
};

var aiCache = {};

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function load(key, fb){
  try{ var v = localStorage.getItem(key); return v === null ? fb : JSON.parse(v); }
  catch(e){ return fb; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
function api(path, body){
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  }).then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, msg:'请求失败，看下服务还在不在' }; });
}
function fmtStars(n){
  n = Number(n) || 0;
  if(n >= 10000){ return (n/10000).toFixed(1).replace(/\.0$/,'') + ' 万'; }
  if(n >= 1000){ return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k'; }
  return String(n);
}
function agoText(days){
  days = Number(days);
  if(!(days >= 0)){ return '更新时间未知'; }
  if(days === 0){ return '今天还在提交'; }
  if(days < 30){ return days + ' 天前更新'; }
  if(days < 365){ return Math.round(days/30) + ' 个月前更新'; }
  return (days/365).toFixed(1).replace(/\.0$/,'') + ' 年前更新';
}
function actBadge(r){
  if(r.archived){ return '<span class="badge r">已归档</span>'; }
  var a = r.activity || '未知';
  var cls = a === '活跃' ? 'g' : (a === '维护中' ? 'o' : 'n');
  return '<span class="badge ' + cls + '">' + esc(a) + '</span>';
}

/* ---- 渲染 ---- */
function repoSkeleton(){
  return '<div class="repo"><div class="sk" style="width:38%"></div>' +
    '<div class="sk" style="width:62%"></div><div class="sk" style="width:80%"></div></div>';
}

function repoHTML(r){
  var flags = actBadge(r);
  var desc = r.desc
    ? '<div class="repo-d">' + esc(r.desc) + '</div>'
    : '<div class="repo-d empty">作者没写描述，点进去自己看</div>';
  var tags = (r.topics && r.topics.length)
    ? '<div class="tags">' + r.topics.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
    : '';
  var ai = '';
  if(r.ai && r.ai.what){
    ai = '<div class="ai">' +
      '<div><span class="k">是什么</span>' + esc(r.ai.what) + '</div>' +
      '<div><span class="k">有什么用</span>' + esc(r.ai.use || '—') + '</div>' +
      '<div><span class="k">适合谁</span>' + esc(r.ai.fit || '—') + '</div>' +
    '</div>';
  }
  return '<div class="repo">' +
    '<div class="repo-h">' +
      '<a class="repo-n" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.name) + ' ↗</a>' +
      '<span class="repo-flags">' + flags + '</span>' +
    '</div>' +
    '<div class="repo-m">' +
      '<span>★ <b>' + fmtStars(r.stars) + '</b></span>' +
      '<span>分支 ' + fmtStars(r.forks) + '</span>' +
      (r.lang ? '<span>' + esc(r.lang) + '</span>' : '') +
      '<span>' + esc(agoText(r.days)) + '</span>' +
    '</div>' +
    desc + tags + ai +
  '</div>';
}

function render(){
  var html = '';

  if(S.ran && !S.busy){
    var meta = '命中 ' + S.total + ' 个 · 显示 ' + S.repos.length + ' 个';
    if(S.remaining !== '' && S.remaining != null){ meta += ' · GitHub 剩余额度 ' + esc(S.remaining); }
    var btn;
    if(S.aiBusy){ btn = '<button class="btn sm" disabled><span class="spin"></span> 解读中</button>'; }
    else if(!S.ai){ btn = '<button class="btn sm" disabled title="服务端没配模型 Key">AI 解读（未配 Key）</button>'; }
    else { btn = '<button class="btn sm" id="aiBtn" type="button">AI 解读这 ' + S.repos.length + ' 个</button>'; }
    html += '<div class="meta"><span class="mini">' + esc(meta) + '</span>' + btn + '</div>';
  }

  if(S.err){ html += '<div class="err">' + esc(S.err) + '</div>'; }
  if(S.aiErr){ html += '<div class="err">' + esc(S.aiErr) + '</div>'; }
  if(S.insight){ html += '<div class="insight"><b>这批怎么看：</b>' + esc(S.insight) + '</div>'; }

  if(S.busy){
    html += repoSkeleton() + repoSkeleton() + repoSkeleton();
  } else if(S.ran && !S.err){
    if(!S.repos.length){
      html += '<div class="card"><div class="card-sub">没搜到。换个说法试试，或者把最低 star 调低。</div></div>';
    } else {
      html += S.repos.map(repoHTML).join('');
    }
  }
  $('out').innerHTML = html;
  var b = $('aiBtn');
  if(b){ b.onclick = runDigest; }
  paintTopics();
  $('aliveChip').className = 'chip' + (S.alive ? ' on' : '');
  $('quota').textContent = S.ghToken ? 'GitHub Token 已配置' : '';
}
/* ---- 搜索 ---- */
function runSearch(query){
  if(S.busy){ return; }
  var q = String(query == null ? $('kw').value : query).trim();
  if(q.length < 2){ toast('先给个关键词'); return; }
  S.q = q;
  S.minStars = Number($('minStars').value) || 0;
  $('kw').value = q;
  S.busy = true; S.err = ''; S.aiErr = ''; S.ran = true; S.insight = '';
  render();

  api('/opc/api/search', { q:q, minStars:S.minStars, alive:S.alive, per:12 })
    .then(function(d){
      S.busy = false;
      if(!d || !d.ok){
        S.repos = []; S.total = 0;
        S.err = (d && d.msg) || '搜索失败，稍后再试';
        render(); return;
      }
      S.repos = (d.repos || []).map(function(r){
        if(aiCache[r.name]){ r.ai = aiCache[r.name]; }
        return r;
      });
      S.total = d.total || 0;
      S.remaining = d.remaining;
      S.ghToken = !!d.token;
      save(K_CFG, { q:q, minStars:S.minStars, alive:S.alive });
      render();
    });
}

/* ---- AI 解读 ---- */
function runDigest(){
  if(!S.repos.length || S.aiBusy){ return; }
  S.aiBusy = true; S.aiErr = '';
  render();
  var payload = S.repos.map(function(r){
    return { name:r.name, desc:r.desc, lang:r.lang, stars:r.stars, pushed:r.pushed,
             activity:r.activity, topics:r.topics, archived:r.archived };
  });
  api('/opc/api/digest', { repos:payload })
    .then(function(d){
      S.aiBusy = false;
      if(!d || !d.ok){ S.aiErr = (d && d.msg) || '解读失败，稍后再试'; render(); return; }
      (d.items || []).forEach(function(it, i){
        if(S.repos[i] && it && it.what){
          S.repos[i].ai = it;
          aiCache[S.repos[i].name] = it;
        }
      });
      save(K_AI, aiCache);
      S.insight = d.insight || '';
      S.aiSource = d.source || '';
      render();
    });
}

/* ---- 主题标签 ---- */
function paintTopics(){
  $('topicChips').innerHTML = TOPICS.map(function(t, i){
    var on = t[0] === S.q ? ' on' : '';
    return '<button class="chip' + on + '" type="button" data-topic="' + esc(t[0]) + '">' + esc(t[1]) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('topicChips').querySelectorAll('[data-topic]'), function(b){

/* ---- OPC 资料：筛选 + 渲染 ---- */
var RS = { cat:'全部', kw:'' };
var EX = (window.TBExport && typeof window.TBExport.doc === 'function') ? window.TBExport : null;

/* 分类 + 关键字，两边都得过 */
function refHit(g, it){
  if(RS.cat !== '全部' && g.t !== RS.cat){ return false; }
  var kw = RS.kw.trim().toLowerCase();
  if(!kw){ return true; }
  var hay = (it.n + ' ' + (it.d || '') + ' ' + (it.tags || []).join(' ') + ' ' + g.t).toLowerCase();
  return hay.indexOf(kw) >= 0;
}

function refFiltered(){
  var out = [];
  REF.forEach(function(g){
    var items = g.items.filter(function(it){ return refHit(g, it); });
    if(items.length){ out.push({ t:g.t, why:g.why, items:items }); }
  });
  return out;
}

function refTotal(){
  return REF.reduce(function(a, g){ return a + g.items.length; }, 0);
}

function refItemHTML(it){
  return '<div class="repo">' +
    '<div class="repo-h">' +
      (it.u
        ? '<a class="repo-n" href="' + esc(it.u) + '" target="_blank" rel="noopener noreferrer">' + esc(it.n) + ' ↗</a>' +
          '<button class="ref-copy" type="button" data-copy="' + esc(it.u) + '">复制链接</button>'
        : '<span class="repo-n">' + esc(it.n) + '</span>') +
    '</div>' +
    (it.d ? '<div class="repo-d">' + esc(it.d) + '</div>' : '') +
    ((it.tags && it.tags.length)
      ? '<div class="tags">' + it.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
      : '') +
  '</div>';
}

function renderRefChips(){
  var cats = ['全部'].concat(REF.map(function(g){ return g.t; }));
  $('refChips').innerHTML = cats.map(function(c){
    return '<button class="chip' + (c === RS.cat ? ' on' : '') + '" type="button" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('refChips').querySelectorAll('[data-cat]'), function(b){
    b.onclick = function(){ RS.cat = b.getAttribute('data-cat'); renderRef(); };
  });
}

function renderRef(){
  var groups = refFiltered();
  var n = groups.reduce(function(a, g){ return a + g.items.length; }, 0);
  var total = refTotal();

  if(!n){
    // 分类和关键词是「同时满足」，所以卡在某个分类里搜不到时，得点破这一层
    var tip = (RS.cat === '全部')
      ? '没找到。换个词试试，比如「收款」「部署」「社区」。'
      : ('「' + RS.cat + '」这一组里没有。把上面的分类切回「全部」再搜一次。');
    $('refOut').innerHTML = '<div class="card"><div class="card-sub">' + esc(tip) + '</div></div>';
  } else {
    $('refOut').innerHTML = groups.map(function(g){
      return '<div class="sec-t">' + esc(g.t) + '</div>' +
        (g.why ? '<div class="mini" style="margin:0 2px 2px">' + esc(g.why) + '</div>' : '') +
        g.items.map(refItemHTML).join('');
    }).join('');
  }

  var kw = RS.kw.trim();
  $('refMeta').textContent = '共 ' + total + ' 条' + (n === total ? '' : ' · 命中 ' + n + ' 条') +
    (kw ? ' · 关键词「' + kw + '」' : '') + (EX ? '' : ' · 复制功能没加载');
  $('refExp').disabled = !n;

  renderRefChips();
  Array.prototype.forEach.call($('refOut').querySelectorAll('[data-copy]'), function(b){
    b.onclick = function(){
      var url = b.getAttribute('data-copy') || '';
      if(!url){ return; }
      if(!EX){ toast(url); return; }   // 没引到公共件也别让人白点
      EX.copy(url).then(function(ok){ toast(ok ? '链接复制好了' : '这浏览器不让复制，手动选中吧'); });
    };
  });
}

/* 把当前筛出来的导成一份 Markdown，丢给谁看都行 */
function exportRefs(){
  if(!EX){ toast('导出件没加载，刷新一下页面'); return; }
  var groups = refFiltered();
  if(!groups.length){ toast('当前没内容可导'); return; }
  var body = [];
  groups.forEach(function(g){
    body.push('## ' + g.t);
    if(g.why){ body.push('> ' + g.why); }
    g.items.forEach(function(it){
      body.push('- **' + it.n + '**' + (it.d ? '：' + it.d : '') + (it.u ? '  <' + it.u + '>' : ''));
    });
  });
  var kw = RS.kw.trim();
  EX.run({
    md: EX.doc({
      title: 'OPC 资料｜一人公司 / 独立开发',
      meta: [
        ['筛的是', RS.cat === '全部' ? '全部分类' : RS.cat],
        kw ? ['关键词', kw] : null,
        ['条数', groups.reduce(function(a, g){ return a + g.items.length; }, 0) + ' 条'],
        ['导出时间', EX.now()]
      ],
      body: body
    }),
    filename: EX.filename('OPC 资料 一人公司')
  }, { done: function(ok){ toast(ok ? 'Markdown 存下来了' : '没存下来，再点一次'); } });
}

/* ---- 导航 ---- */
function setTab(name, remember){
  var t = (name === 'ref') ? 'ref' : 'proj';
  $('panelProj').hidden = (t !== 'proj');
  $('panelRef').hidden = (t !== 'ref');
  Array.prototype.forEach.call($('tabs').querySelectorAll('[data-tab]'), function(b){
    var on = b.getAttribute('data-tab') === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  // 换 tab 记在地址上，刷新还能回到原地；不用 pushState，免得后退键变乱
  if(remember !== false){
    try{ history.replaceState(null, '', t === 'ref' ? '#ref' : location.pathname + location.search); }catch(e){}
  }
}

/* ---- 启动 ---- */
function init(){
  aiCache = load(K_AI, {}) || {};
  var cfg = load(K_CFG, null);
  if(cfg && cfg.q){
    S.q = cfg.q;
    S.minStars = Number(cfg.minStars) || 0;
    S.alive = !!cfg.alive;
  }
  $('kw').value = S.q;
  $('minStars').value = String(S.minStars);
  $('aliveChip').className = 'chip' + (S.alive ? ' on' : '');

  paintTopics();
  render();

  $('goBtn').onclick = function(){ runSearch(); };
  $('kw').onkeydown = function(e){ if(e.key === 'Enter'){ runSearch(); } };
  $('minStars').onchange = function(){ runSearch(); };
  $('aliveChip').onclick = function(){ S.alive = !S.alive; runSearch(); };

  // 服务端有没有配模型 Key / GitHub Token，只影响按钮文案
  fetch('/opc/api/status').then(function(r){ return r.json(); }).then(function(d){
    S.ai = !!(d && d.ai);
    S.ghToken = !!(d && d.github_token);
    render();
  }).catch(function(){ render(); });

  // 导航：两个 tab 互切，选中状态记在地址上
  Array.prototype.forEach.call($('tabs').querySelectorAll('[data-tab]'), function(b){
    b.onclick = function(){ setTab(b.getAttribute('data-tab')); };
  });
  setTab(/^#ref$/.test(location.hash) ? 'ref' : 'proj', false);

  // 资料 tab：本地筛选，不发请求
  $('rkw').oninput = function(){ RS.kw = $('rkw').value; renderRef(); };
  $('refExp').onclick = exportRefs;
  renderRef();

  runSearch(S.q);
}
init();

})();
</script>
