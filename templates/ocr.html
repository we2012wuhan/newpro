<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR图片识别</title>
<link rel="icon" href="data:,">
<script>try{if(localStorage.getItem('tb_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
:root{
  --bg:var(--tb-bg);
  --line:var(--tb-line);
  --text:var(--tb-ink);
  --muted:var(--tb-muted);
  --acc1:#22d3ee;
  --acc2:#6366f1;
  --ok:var(--tb-ok);
  --err:var(--tb-err);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(1100px 520px at 10% -10%, rgba(34,211,238,.2), transparent 60%),
    radial-gradient(900px 480px at 105% 0%, rgba(99,102,241,.18), transparent 55%),
    radial-gradient(700px 600px at 50% 120%, rgba(56,189,248,.12), transparent 60%),
    linear-gradient(160deg,var(--tb-bg) 0%,var(--tb-bg-2) 55%,var(--tb-bg) 100%);
  background-attachment:fixed;
}
.wrap{max-width:980px;margin:0 auto;padding:26px 20px 80px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:14px}
.back:hover{color:var(--tb-ink)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:13px}
.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(135deg,#22d3ee 0%,#6366f1 100%);
  box-shadow:0 10px 28px rgba(34,211,238,.4)}
h1{margin:0;font-size:23px;letter-spacing:.4px}
.card{background:linear-gradient(180deg,var(--tb-card),var(--tb-card-2));
  border:1px solid var(--line);border-radius:18px;padding:20px;backdrop-filter:blur(8px);
  box-shadow:0 20px 46px var(--tb-sh)}
.card + .card{margin-top:16px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:34px 20px;border:1.5px dashed var(--tb-line);border-radius:14px;cursor:pointer;
  background:var(--tb-field);transition:border-color .18s,background .18s;text-align:center}
.drop:hover,.drop.over{border-color:rgba(34,211,238,.7);background:rgba(34,211,238,.07)}
.drop-ico{font-size:34px;line-height:1}
.drop-main{font-size:16px;font-weight:600}
.drop-sub{font-size:13px;color:var(--muted)}
.stage{display:flex;align-items:center;justify-content:center;background:var(--tb-field);
  border:1px solid var(--tb-line);border-radius:14px;padding:12px;max-height:420px;overflow:auto}
.stage img{max-width:100%;max-height:396px;border-radius:8px;display:block}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:11px;padding:11px 22px;font-size:15px;cursor:pointer;font-weight:700;display:inline-flex;
  align-items:center;gap:8px;transition:transform .12s ease,box-shadow .15s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-main{color:#04211b;background:linear-gradient(135deg,#22d3ee,#34d399);box-shadow:0 10px 26px rgba(34,211,238,.32)}
.btn-main:hover:not(:disabled){box-shadow:0 12px 32px rgba(34,211,238,.48)}
.btn-ghost{background:var(--tb-card);border:1px solid var(--tb-line);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--tb-hover)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.spinner{width:16px;height:16px;border:2px solid var(--tb-line);border-top-color:var(--tb-line);border-radius:50%;
  animation:spin .8s linear infinite;display:none}
.spinner.on{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{margin-top:14px;font-size:13.5px;line-height:1.8;display:none}
#msg.show{display:block}
#msg.err{color:var(--err);background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.25);padding:10px 14px;border-radius:10px}
#msg.info{color:var(--c-bfe9ff);background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);padding:10px 14px;border-radius:10px}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stats{font-size:13px;color:var(--muted)}
.res-btns{display:flex;gap:8px;flex-wrap:wrap}
textarea#out{width:100%;min-height:230px;resize:vertical;padding:13px 14px;font-size:15px;line-height:1.9;color:var(--text);
  background:var(--tb-field);border:1px solid var(--tb-line);border-radius:12px;outline:none;
  font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
textarea#out:focus{border-color:rgba(34,211,238,.7);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
[hidden]{display:none !important}
</style>
<script src="/static/auth-guard.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回工具箱</a>
  <header class="top">
    <div class="logo">
      <div class="mark">🔍</div>
      <div><h1>OCR图片识别</h1></div>
    </div>
  </header>

  <div class="card">
    <div id="drop" class="drop">
      <div class="drop-ico">🖼️</div>
      <div class="drop-main">粘贴截图，或点击 / 拖拽图片到这里</div>
      <div class="drop-sub">Ctrl + V 直接粘贴截图</div>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div class="card" id="stage" hidden>
    <div class="stage"><img id="preview" alt=""></div>
    <div class="actions">
      <button class="btn btn-main" id="btnRun"><span class="spinner" id="spinner"></span>识别文字</button>
      <button class="btn btn-ghost" id="btnReset">重新选择</button>
    </div>
  </div>

  <div id="msg"></div>

  <div class="card" id="result" hidden>
    <div class="res-head">
      <span class="stats" id="stats"></span>
      <div class="res-btns">
        <button class="btn btn-ghost sm" id="btnCopy">复制</button>
        <button class="btn btn-ghost sm" id="btnSave">下载 .txt</button>
        <button class="btn btn-ghost sm" id="btnClear">清空</button>
      </div>
    </div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $('file'), drop = $('drop'), stage = $('stage'), preview = $('preview');
  var msg = $('msg'), spinner = $('spinner'), out = $('out');
  var current = null, objectUrl = null;

  var MAX_UP = 1000 * 1024;  // 免费接口单张上限 1 MB
  var OK_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/bmp', 'image/tiff'];

  function showMsg(text, kind) {
    msg.textContent = text || '';
    msg.className = text ? ('show ' + (kind || 'info')) : '';
  }
  function clearMsg() { msg.className = ''; msg.textContent = ''; }

  // —— 图片预处理：接口只收 png/jpg/gif/bmp/tiff 且单张 ≤1MB ——
  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('load failed')); };
      im.src = url;
    });
  }
  function toBlob(canvas, type, quality) {
    return new Promise(function (resolve) { canvas.toBlob(resolve, type, quality); });
  }

  function prepare(file) {
    var type = (file.type || '').toLowerCase();
    if (OK_TYPES.indexOf(type) >= 0 && file.size <= MAX_UP) {
      return Promise.resolve({ blob: file, name: file.name || 'screenshot.png' });
    }
    // webp / 超大图：先用 canvas 重编码（先降质量，再降分辨率）压到 1MB 以内
    return loadImage(file).then(function (im) {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var scale = 1;
      var tries = [
        { t: 'image/png' },
        { t: 'image/jpeg', q: 0.92 },
        { t: 'image/jpeg', q: 0.8 },
        { t: 'image/jpeg', q: 0.65 }
      ];
      function attempt(i) {
        if (i >= tries.length) {
          scale *= 0.7;
          if (scale < 0.15) { return Promise.resolve(null); }
          return attempt(0);
        }
        var spec = tries[i];
        canvas.width = Math.max(1, Math.round(im.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(im.naturalHeight * scale));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(im, 0, 0, canvas.width, canvas.height);
        return toBlob(canvas, spec.t, spec.q).then(function (b) {
          if (b && b.size <= MAX_UP) {
            return { blob: b, name: spec.t === 'image/png' ? 'screenshot.png' : 'screenshot.jpg' };
          }
          return attempt(i + 1);
        });
      }
      return attempt(0);
    });
  }

  function setFile(f) {
    if (!f) { return; }
    if (!/^image\//.test(f.type || '')) { showMsg('请选择图片文件', 'err'); return; }
    clearMsg();
    $('btnRun').disabled = true;
    prepare(f).then(function (prepared) {
      if (!prepared) {
        showMsg('图片太大，压缩不到 1 MB 以内，请裁剪后再试', 'err');
        $('btnRun').disabled = false;
        return;
      }
      if (objectUrl) { URL.revokeObjectURL(objectUrl); }
      objectUrl = URL.createObjectURL(prepared.blob);
      current = prepared;
      preview.src = objectUrl;
      stage.hidden = false;
      $('result').hidden = true;
      out.value = '';
      $('stats').textContent = '';
      run();
    }).catch(function () {
      showMsg('图片读取失败，请换一张试试', 'err');
      $('btnRun').disabled = false;
    });
  }

  function reset() {
    current = null;
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    preview.removeAttribute('src');
    stage.hidden = true;
    $('result').hidden = true;
    out.value = '';
    $('stats').textContent = '';
    fileInput.value = '';
    $('btnRun').disabled = false;
    clearMsg();
  }

  function run() {
    if (!current) { showMsg('请先粘贴或选择图片', 'err'); return; }
    clearMsg();
    spinner.classList.add('on');
    $('btnRun').disabled = true;
    var fd = new FormData();
    fd.append('file', current.blob, current.name);
    fetch('/ocr/api/recognize', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { showMsg(d.message || '识别失败，请重试', 'err'); return; }
        out.value = d.text || '';
        $('result').hidden = false;
        $('stats').textContent = d.count
          ? (d.count + ' 行 · 耗时 ' + d.elapsed + 's')
          : '未识别到文字';
        if (!d.count) { showMsg('没有识别到文字，换一张更清晰的图片试试', 'info'); }
      })
      .catch(function () { showMsg('请求失败，请检查服务是否在运行', 'err'); })
      .finally(function () {
        spinner.classList.remove('on');
        $('btnRun').disabled = false;
      });
  }

  function copyText(text, btn) {
    function done() {
      var old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = old; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { setFile(fileInput.files[0]); });
  $('btnRun').addEventListener('click', run);
  $('btnReset').addEventListener('click', reset);

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    drop.addEventListener(ev, function () { drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    setFile(f);
  });

  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { e.preventDefault(); setFile(f); return; }
      }
    }
  });

  $('btnCopy').addEventListener('click', function () {
    if (out.value) { copyText(out.value, $('btnCopy')); }
  });
  $('btnSave').addEventListener('click', function () {
    if (!out.value) { return; }
    var blob = new Blob([out.value], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ocr-' + Date.now() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('btnClear').addEventListener('click', function () {
    out.value = '';
    $('stats').textContent = '';
    clearMsg();
  });
})();
</script>
</body>
</html>
