<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B5FCC">
<script>(function(){try{var v=JSON.parse(localStorage.getItem('sdd_theme'));if(v==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<title>SDD 需求拆解器</title>
<style>
:root{
  --blue:#4B5FCC; --blue-d:#3A4BA6; --blue-l:#EEF0FB; --blue-line:#C7CDF0;
  --ink:#1F2A44; --text:#3C4759; --muted:#8492A3;
  --bg:#F6F7F9; --card:#FFFFFF; --line:#E6EAF0;
  --green:#5F9E7C; --green-l:#EDF6F1; --green-ink:#3F7A5B; --green-line:#CBE3D8;
  --amber:#C8922F; --amber-l:#FDF5E4; --amber-ink:#8F6A1F; --amber-line:#EBDCB4;
  --rose:#C08573; --rose-l:#FAF0ED; --rose-ink:#9B6350; --rose-line:#E8D2CA;
  --r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 24px -14px rgba(16,24,40,.18);
  --primary:#4B5FCC; --primary-d:#3A4BA6; --primary-off:#B7BEDD;
  --surface:#FFFFFF; --surface-2:#F2F4F7; --track:#EFF2F6; --btn-active:#F3F5F8; --dot:#D7DDE6;
  --topbar-bg:rgba(246,247,249,.94); --tabbar-bg:rgba(255,255,255,.97); --rail-bg:rgba(255,255,255,.72);
  --text-2:#5A6879; --text-3:#4A5866; --code-bg:#FBFCFE;
  --focus-ring:0 0 0 3px rgba(75,95,204,.12);
  color-scheme:light;
}
html[data-theme="dark"]{
  --blue:#9BA9F5; --blue-d:#B4BFF9; --blue-l:#1D2338; --blue-line:#333C5E;
  --ink:#E8ECF8; --text:#C2CBDE; --muted:#8593A9;
  --bg:#0E1119; --card:#161B26; --line:#272E3D;
  --green:#7CC79E; --green-l:#152A20; --green-ink:#8CD9AE; --green-line:#2E4B3C;
  --amber:#E0B45C; --amber-l:#2A2314; --amber-ink:#EBC57E; --amber-line:#4A3E22;
  --rose:#D89E8C; --rose-l:#2C1E1A; --rose-ink:#E4AC9B; --rose-line:#4A322C;
  --sh:0 1px 2px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.75);
  --primary:#4E63C4; --primary-d:#3F51A8; --primary-off:#39415C;
  --surface:#1A2130; --surface-2:#212A3A; --track:#232E3E; --btn-active:#232D3C; --dot:#33415A;
  --topbar-bg:rgba(14,17,25,.9); --tabbar-bg:rgba(18,22,32,.97); --rail-bg:rgba(16,20,30,.75);
  --text-2:#A9B5C8; --text-3:#B6C2D4; --code-bg:#131924;
  --focus-ring:0 0 0 3px rgba(155,169,245,.2);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink)}
p{margin:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-size:17px;font-weight:600;color:var(--ink);line-height:1.3}
.sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ghost{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ghost:hover{color:var(--blue);border-color:var(--blue-line)}
.ghost svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ghost .ic-moon{display:none}
html[data-theme="dark"] .ghost .ic-sun{display:none}
html[data-theme="dark"] .ghost .ic-moon{display:block}
.view{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card.tight{padding:13px 14px}
.card-h{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.card-sub{font-size:12.5px;color:var(--muted);line-height:1.65}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:18px 2px 8px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;line-height:1.8;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-line);white-space:nowrap}
.badge.g{background:var(--green-l);color:var(--green-ink);border-color:var(--green-line)}
.badge.o{background:var(--amber-l);color:var(--amber-ink);border-color:var(--amber-line)}
.badge.r{background:var(--rose-l);color:var(--rose-ink);border-color:var(--rose-line)}
.badge.n{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.mini{font-size:11.5px;color:var(--muted);line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14.5px;cursor:pointer;transition:background .15s ease,opacity .15s ease}
.btn:active{background:var(--btn-active)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-d)}
.btn.primary:disabled{background:var(--primary-off);border-color:var(--primary-off);cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:120px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--primary);background:var(--blue-l);color:var(--blue);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);outline:none;min-height:42px;font-size:14.5px;line-height:1.65;color:var(--text)}
textarea{resize:vertical;line-height:1.75}
input:focus,textarea:focus,select:focus{border-color:var(--blue-line);box-shadow:var(--focus-ring)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
.hr{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13.5px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}
.hintbox{border:1px dashed var(--blue-line);background:var(--blue-l);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.75;color:var(--blue);margin-bottom:12px}
.qlist{margin:0;padding-left:18px;font-size:13px;line-height:1.85;color:var(--text-2)}
.qlist li{margin-bottom:3px}
.mist{border-left:2px solid var(--rose-line);padding-left:11px;margin-bottom:10px}
.mist .mt{font-size:13px;color:var(--rose-ink);font-weight:600;line-height:1.6}
.mist .mw{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:3px}
.eg{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.8;color:var(--text-2);white-space:pre-wrap}
.det{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.det>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;background:var(--card)}
.det>summary::-webkit-details-marker{display:none}
.det>summary:hover{background:var(--btn-active)}
.det .no{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--blue-l);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1px solid var(--blue-line)}
.det .nm{font-size:14.5px;font-weight:600;color:var(--ink)}
.det .en{font-size:11.5px;color:var(--muted)}
.det .caret{margin-left:auto;color:var(--muted);font-size:12px;transition:transform .2s ease}
.det[open] .caret{transform:rotate(90deg)}
.det .body{padding:0 14px 14px}
.reqitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;background:var(--surface)}
.lvl{display:flex;gap:6px;margin-bottom:8px}
.lvl button{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--muted)}
.lvl button.on{background:var(--blue-l);border-color:var(--primary);color:var(--blue);font-weight:600}
.pv{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:60vh;overflow:auto;color:var(--text-2)}
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:36px;border:0;background:none;border-radius:9px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--blue);font-weight:600;box-shadow:var(--sh)}
.ck{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--text-2)}
.ck:last-child{border-bottom:0}
.ck .dotm{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.ck .dotm.r{background:#D2695C}
.ck .dotm.y{background:#D8A63C}
.ck .dotm.g{background:#5F9E7C}
.ck .jump{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--blue);cursor:pointer;background:none;border:0;padding:2px 4px;text-decoration:underline}
.tpl{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);margin-bottom:10px;cursor:pointer;box-shadow:var(--sh)}
.tpl:hover{border-color:var(--blue-line)}
.tpl.on{border-color:var(--primary);background:var(--blue-l)}
.tpl .tn{font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.tpl .td{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:4px}
.rec{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);margin-bottom:10px;box-shadow:var(--sh)}
.rec .rt{font-size:14.5px;font-weight:600;color:var(--ink)}
.rec .rm{font-size:12px;color:var(--muted);margin-top:4px}
.rec .ra{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:rgba(31,42,68,.94);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .2s ease,bottom .2s ease}
.toast.on{opacity:1;bottom:calc(108px + env(safe-area-inset-bottom))}
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
.sheet-in{max-width:760px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.sheet .sh-top{position:sticky;top:0;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 0;background:none;border:0;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--blue);font-weight:600}
.brand{display:none}
.work-switch{margin-bottom:12px}
@media (min-width:1000px){
  :root{--rail:228px}
  #app{margin-left:var(--rail);max-width:none;padding-bottom:40px}
  .topbar-in,.view{max-width:1000px;margin:0 auto}
  .topbar-in{padding:16px 26px}
  .view{padding:22px 26px}
  .tabbar{top:0;bottom:0;right:auto;width:var(--rail);border-top:0;border-right:1px solid var(--line);
    background:var(--rail-bg);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
  .brand{display:block;padding:4px 12px 18px}
  .brand b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
  .brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
  .tabbar-in{max-width:none;width:100%;display:flex;flex-direction:column;gap:4px;padding:0}
  .tab{width:100%;flex-direction:row;justify-content:flex-start;gap:11px;min-height:44px;padding:0 12px;border-radius:11px;font-size:14.5px}
  .tab:hover{background:var(--blue-l)}
  .tab.active{background:var(--blue-l)}
  .toast{bottom:40px}
  .toast.on{bottom:52px}
}
@media (min-width:1200px){
  .v-work .view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:20px;align-items:start;max-width:1320px}
  .v-work .work-side{position:sticky;top:82px;max-height:calc(100vh - 106px);overflow:auto}
  .v-work .work-switch{display:none}
  .v-work.mode-prev .work-main{display:block}
  .v-work.mode-form .work-side{display:block}
}
@media (max-width:1199px){
  .v-work.mode-prev .work-main{display:none}
  .v-work.mode-form .work-side{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* 返回工具箱 */
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;
  text-decoration:none;white-space:nowrap;flex:0 0 auto}
.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink);border-color:var(--blue-line);background:var(--blue-l)}
/* 小屏带不下标题，只留箭头 */
@media (max-width:479px){.back{width:36px;padding:0;gap:0;justify-content:center}.back span{display:none}}
</style>
<script src="/static/auth-guard.js"></script>
</head>
<body>
<div id="app" class="app v-work">
  <header class="topbar">
    <div class="topbar-in">
      <a class="back" href="/" aria-label="返回工具箱"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>返回工具箱</span></a>
      <div>
        <div class="ttl" id="pageTitle">拆解工作台</div>

          <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>

      </div>

  <main class="view" id="view"></main>
</div>
<nav class="tabbar">
  <div class="brand"><b>SDD 需求拆解器</b><span>七段式 · 从模糊想法到可交付规格</span></div>
  <div class="tabbar-in" id="tabbar"></div>
</nav>
<div class="sheet" id="sheet" hidden></div>

<script>(function(){
'use strict';

/* ============================================================
   0. 通用工具
   ============================================================ */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){ return 'r' + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36); }
function nowStr(){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function lines(s){
  return String(s==null?'':s).split('\n').map(function(x){ return x.replace(/^\s+|\s+$/g,''); })
    .filter(function(x){ return x.length > 0; });
}
function nonEmpty(s){ return String(s==null?'':s).replace(/\s/g,'').length > 0; }
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 1600);
}
function copyText(text, okMsg){
  var done = function(){ toast(okMsg || '已复制'); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    done();
  }catch(e){ toast('这台浏览器不让复制，请手动选中'); }
}
function download(name, text){
  try{
    var blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 600);
    toast('已下载 ' + name);
  }catch(e){ toast('这台浏览器不支持直接下载'); }
}

/* ============================================================
   1. 存储层：key 统一 sdd_ 前缀，数据只留在这台设备
   ============================================================ */
var K = {
  draft   : 'sdd_draft',
  tpl     : 'sdd_tpl',
  records : 'sdd_records',
  opt     : 'sdd_opt',
  theme   : 'sdd_theme',
  help    : 'sdd_help_seen'
};
var DB = {
  get: function(k, fb){
    try{ var v = localStorage.getItem(k); return v===null ? fb : JSON.parse(v); }
    catch(e){ return fb; }
  },
  set: function(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ============================================================
   2. 七段式知识库：每一段 = 引导问题 + 常见错误 + 示例 + 字段
   ============================================================ */
var SECS = [
{
  id:'pain', no:'①', icon:'🩺', name:'痛点解读', en:'Why', catchField:'scene',
  tagline:'不是复述需求，是把"难受"翻译成一个问题',
  formula:'我在【场景】里，因为【原因】，导致【代价】；目前的凑合办法是【现状】。',
  questions:[
    '上一次你被这件事烦到，具体是在什么时间、什么地点、手上正在做什么？',

         {k:'lang', kw:['中文','英文','双语','界面语言']} ],
  done:[ {k:'criteria', kw:['验收','算做完','做完','标准','做到这些']},
         {k:'verify', kw:['验证','测试','走一遍','跑一遍','试一遍']},
         {k:'files', kw:['交付物','文件','目录','.html','.py','.md','放哪','叫什么']},
         {k:'rhythm', kw:['分步','分几步','分两步','分三步','第一步','先给','先做','节奏','里程碑']} ]
};
function pickField(secId, clause){
  var rules = FIELD_KW[secId];
  if(!rules) return null;
  var best = null, bestN = 0;
  rules.forEach(function(r){
    var n = 0;
    r.kw.forEach(function(k){ if(clause.indexOf(k) >= 0) n++; });
    if(n > bestN){ bestN = n; best = r.k; }
  });
  return best;
}
var LEVEL_KW = {
  M:['必须','一定要','务必','核心','不能少','最少','至少'],
  S:['应该','最好','希望能','尽量','比较重要','挺重要'],
  C:['可以','顺便','如果方便','锦上添花','有更好','可选','也可以']
};

var AUDIENCES = [
  { k:'generic', name:'通用', desc:'任何能读写文件的 agent' },

var state = { tab:'work', mode:'form', draft:null, opt:null, records:[], smart:null };

function blankDraft(){
  var s = {};
  SECS.forEach(function(sec){
    if(sec.req){ s[sec.id] = { items:[] }; return; }
    var o = {};
    sec.fields.forEach(function(f){ o[f.k] = ''; });
    s[sec.id] = o;
  });
  return { title:'', raw:'', tpl:'', hints:{}, s:s, open:{}, at:nowStr() };
}
function secById(id){
  for(var i=0;i<SECS.length;i++){ if(SECS[i].id===id) return SECS[i]; }
  return null;
}
function secFilled(d, id){
  var sec = secById(id);
  if(id==='req'){
    return (d.s.req.items||[]).some(function(it){ return nonEmpty(it.text) || nonEmpty(it.assert); });
  }
  return sec.fields.some(function(f){ return nonEmpty(d.s[id][f.k]); });
}
function secEmpty(d, id){ return !secFilled(d, id); }
function cut(s, n){
  s = String(s==null?'':s);
  return s.length > (n||18) ? s.slice(0, n||18) + '…' : s;
}

/* ============================================================
   7. 智能起步：把一段大白话按关键词粗分到七段
   ============================================================ */
function splitClauses(text){
  var raw = String(text==null?'':text).replace(/\r/g,'');
  var parts = raw.split(/[\n。；;！!？?]/);
  var out = [];
  parts.forEach(function(p){
    p = p.replace(/^\s+|\s+$/g,'');
    if(!p) return;
    if(p.length > 56){
      p.split(/[，,]/).forEach(function(q){
        q = q.replace(/^\s+|\s+$/g,'');
        if(q.length > 3) out.push(q);
      });
    } else if(p.length > 3){ out.push(p); }
  });
  return out;
}
function scoreClause(secId, c){
  var kws = KW[secId] || [], n = 0;
  kws.forEach(function(k){ if(c.indexOf(k) >= 0) n++; });
  return n;
}
function guessLevel(c){
  var i, arr;
  for(var lv in LEVEL_KW){
    arr = LEVEL_KW[lv];
    for(i=0;i<arr.length;i++){ if(c.indexOf(arr[i]) >= 0) return lv; }
  }
  return 'M';
}
function smartStart(text){
  var clauses = splitClauses(text);
  var assign = {}, unmatched = [];
  SECS.forEach(function(s){ assign[s.id] = []; });
  clauses.forEach(function(c){
    var neg = scoreClause('nongoal', c);
    var best = null, bestN = 0;
    SECS.forEach(function(s){
      if(s.id === 'goal') return;
      var n = scoreClause(s.id, c);
      if(n > bestN){ bestN = n; best = s.id; }
    });
    if(neg > 0 && (best === null || neg >= bestN)){ assign.goal.push({ c:c, neg:true }); return; }
    if(best === null || bestN === 0){ unmatched.push(c); return; }
    assign[best].push({ c:c, neg:false });
  });
  return { text:text, assign:assign, unmatched:unmatched };
}
function applySmart(){
  var sm = state.smart;
  if(!sm) return;
  var d = state.draft;
  var hit = 0;
  SECS.forEach(function(sec){
    var arr = sm.assign[sec.id] || [];
    if(!arr.length) return;
    hit += arr.length;
    if(sec.id === 'req'){
      arr.forEach(function(x){
        var lv = guessLevel(x.c);
        d.s.req.items.push({ lvl:lv, text:x.c, assert:'' });
      });
      return;
    }
    if(sec.id === 'goal'){
      var g = [], ng = [];
      arr.forEach(function(x){ (x.neg ? ng : g).push(x.c); });
      if(g.length){
        d.s.goal.goals = (d.s.goal.goals ? d.s.goal.goals + '\n' : '') + g.join('\n');
      }
      if(ng.length){
        d.s.goal.nongoals = (d.s.goal.nongoals ? d.s.goal.nongoals + '\n' : '') + ng.join('\n');
      }
      return;
    }
    var byField = {};
    arr.forEach(function(x){
      var key = pickField(sec.id, x.c) || sec.catchField;
      byField[key] = byField[key] || [];
      byField[key].push(x.c);
    });
    Object.keys(byField).forEach(function(key){
      var old = d.s[sec.id][key] || '';
      d.s[sec.id][key] = (old ? old + '\n' : '') + byField[key].join('\n');
    });
    d.open[sec.id] = true;
  });
  if(!nonEmpty(d.title) && nonEmpty(sm.text)){
    d.title = cut(sm.text.replace(/[\n。；;！!？?]/g,' ').replace(/^\s+|\s+$/g,''), 16);
  }
  saveDraft();
  state.smart = { text:sm.text, assign:sm.assign, unmatched:sm.unmatched, done:true, hit:hit };
  return hit;
}
function sendTo(secId, idx){
  var sm = state.smart;
  if(!sm) return;
  var c = sm.unmatched[idx];
  if(c == null) return;
  sm.unmatched.splice(idx, 1);
  var d = state.draft;
  if(secId === 'req'){
    d.s.req.items.push({ lvl:'M', text:c, assert:'' });
  } else if(secId === 'goal'){
    d.s.goal.nongoals = (d.s.goal.nongoals ? d.s.goal.nongoals + '\n' : '') + c;
  } else {
    var sec = secById(secId);
    var key2 = pickField(secId, c) || sec.catchField;
    var old = d.s[secId][key2];
    d.s[secId][key2] = (old ? old + '\n' : '') + c;
  }
  d.open[secId] = true;
  saveDraft();
  renderWork();
}

/* ============================================================
   8. 编译器：七段 -> 提示词 / 规格说明 / 验收清单

function painSentence(d){
  var p = d.s.pain;
  var a = nonEmpty(p.scene) ? p.scene.split('\n')[0] : '';
  var b = nonEmpty(p.reason) ? p.reason.split('\n')[0] : '';
  var c = nonEmpty(p.cost) ? p.cost.split('\n')[0] : '';
  var e = nonEmpty(p.workaround) ? p.workaround.split('\n')[0] : '';
  if(!a && !b && !c && !e) return '';
  return '我在【'+(a||'待补充')+'】里，因为【'+(b||'待补充')+'】，导致【'+(c||'待补充')+'】；目前的凑合办法是【'+(e||'待补充')+'】。';
}
function detailOf(opt){ return opt.detail || 'std'; }
function painBlock(d, opt){
  var head = painSentence(d);
  var det = joinBlocks([
    blockField('场景', d.s.pain.scene, opt),
    blockField('原因', d.s.pain.reason, opt),
    blockField('代价', d.s.pain.cost, opt),
    blockField('现状', d.s.pain.workaround, opt)
  ]);
  if(!head) return det || '';
  if(!det) return head;
  return head + '\n\n补充细节\n' + det;
}
function keepEmpty(opt){ return detailOf(opt) === 'full'; }

function blockField(label, val, opt){
  if(!nonEmpty(val)){
    if(keepEmpty(opt)) return label + '：待补充（这里我没想清楚，请你先问我）';
    return '';
  }
  var ls = lines(val);
  if(ls.length > 1){
    return label + '：\n' + ls.map(function(x){ return '  - ' + x; }).join('\n');
  }
  return label + '：' + ls[0];
}
function blockList(val, opt, bullet){
  if(!nonEmpty(val)){
    if(keepEmpty(opt)) return bullet + '待补充（这里我没想清楚，请你先问我）';
    return '';
  }
  return lines(val).map(function(x){ return bullet + x; }).join('\n');
}
function joinBlocks(arr){ return arr.filter(function(x){ return x && x.length; }).join('\n\n'); }

function buildPrompt(d, opt){
  var L = [];
  var det = detailOf(opt);
  var title = nonEmpty(d.title) ? d.title : '未命名需求';

  if(opt.restate){
    L.push('**动手之前**：请先用 5 句话复述你对这份规格的理解——你打算怎么做、哪些地方你还不确定——等我确认之后再开始动代码。');
  }
  L.push('# 需求规格：' + title);
  L.push('这份规格是按 SDD 七段式写死的。请严格按它实现，**不要自行扩展范围，也不要顺手加我没写在这里的功能**。');

  L.push('## 一、痛点与背景（Why）');
  L.push(painBlock(d, opt) || '待补充');

  L.push('## 二、目标与非目标（What / Not）');
  L.push('### 这次要做成\n' + (blockList(d.s.goal.goals, opt, '- ') || '待补充'));
  L.push('### 这次明确不做（请务必不要加进来）\n' + (blockList(d.s.goal.nongoals, opt, '- ') || '待补充'));

  if(det !== 'slim'){
    L.push('## 三、用户与场景（Who / When）');
    L.push(joinBlocks([
      blockField('谁在用', d.s.user.who, opt),
      blockField('什么时候用', d.s.user.when, opt),
      blockField('多久用一次', d.s.user.freq, opt),
      blockField('单次停留', d.s.user.stay, opt),
      blockField('设备', d.s.user.device, opt),
      blockField('当时的状态', d.s.user.mood, opt)
    ]) || '待补充');
  }

  var reqTxt = LEVELS.map(function(lv){
    var arr = (d.s.req.items || []).filter(function(it){ return it.lvl === lv.k && nonEmpty(it.text); });
    if(!arr.length){
      if(keepEmpty(opt)) return '### ' + lv.k + ' ' + lv.name + '（' + lv.hint + '）\n- 待补充';
      return '';
    }
    return '### ' + lv.k + ' ' + lv.name + '（' + lv.hint + '）\n' + arr.map(function(it){
      var s = '- ' + it.text;
      s += '\n  验收：' + (nonEmpty(it.assert) ? it.assert : '（我还没写验收断言，请你先按你的理解提一个给我确认）');
      return s;
    }).join('\n');
  }).filter(function(x){ return x.length; }).join('\n\n');
  L.push('## 四、功能规格（Requirements）');
  L.push(reqTxt || '待补充');

  if(det !== 'slim'){
    L.push('## 五、交互与形态（How it feels）');
    L.push(joinBlocks([
      blockField('主流程', d.s.ux.flow, opt),
      blockField('关键界面', d.s.ux.screens, opt),
      blockField('空状态', d.s.ux.empty, opt),
      blockField('边界与异常', d.s.ux.fail, opt),
      blockField('数据流向', d.s.ux.dataflow, opt),
      blockField('不可逆操作', d.s.ux.irreversible, opt)
    ]) || '待补充');

    L.push('## 六、技术约束（Constraints）');
    L.push(joinBlocks([
      blockField('技术栈', d.s.tech.stack, opt),
      blockField('部署方式', d.s.tech.deploy, opt),
      blockField('数据存储', d.s.tech.store, opt),
      blockField('联网与外部依赖', d.s.tech.network, opt),
      blockField('性能', d.s.tech.perf, opt),
      blockField('兼容性', d.s.tech.compat, opt),
      blockField('界面语言', d.s.tech.lang, opt)
    ]) || '待补充');
  }

  L.push('## 七、验收标准与交付物（Done）');
  L.push('### 验收标准（做到这些才算做完）\n' + (blockList(d.s.done.criteria, opt, '- [ ] ') || '待补充'));
  L.push(joinBlocks([
    blockField('怎么验证', d.s.done.verify, opt),
    blockList(d.s.done.files, opt, '- 交付物：'),
    blockField('交付节奏', d.s.done.rhythm, opt)
  ]));

  if(opt.checklist){
    var ck = (d.s.done.criteria ? lines(d.s.done.criteria) : []).map(function(x){ return '- [ ] ' + x; });
    (d.s.req.items || []).forEach(function(it){
      if(it.lvl === 'M' && nonEmpty(it.assert)) ck.push('- [ ] ' + it.assert);
    });
    ck.push('- [ ] 控制台没有报错，入口能正常打开');
    ck.push('- [ ] 没有实现「非目标」里明确说不做的东西');
    L.push('## 交付前请自查这一份清单\n' + ck.join('\n'));
  }
  if(opt.stepwise){
    L.push('## 交付方式：分步交付\n请先给一个能跑通的最小版本，说明这一步做了什么、怎么验证；等我确认之后再继续下一步。不要一次把所有功能都写完。');
  }
  L.push('## 分工说明\n' + AUDIENCE_TAIL[opt.audience || 'generic']);
  return L.filter(function(x){ return x && x.length; }).join('\n\n');
}

function buildSpec(d, opt){
  var L = [];
  L.push('# 规格说明：' + (nonEmpty(d.title) ? d.title : '未命名需求'));
  L.push('生成时间：' + nowStr());
  L.push('## 原始想法\n' + (nonEmpty(d.raw) ? d.raw : '（没有留下原始输入）'));
  SECS.forEach(function(sec){
    var body;
    if(sec.id === 'req'){
      body = LEVELS.map(function(lv){
        var arr = (d.s.req.items||[]).filter(function(it){ return it.lvl===lv.k && nonEmpty(it.text); });
        if(!arr.length) return '';
        return '**' + lv.k + ' ' + lv.name + '**\n' + arr.map(function(it){
          return '- ' + it.text + '\n  - 验收：' + (nonEmpty(it.assert) ? it.assert : '待补充');
        }).join('\n');
      }).filter(function(x){ return x.length; }).join('\n\n');
    } else if(sec.id === 'pain'){
      body = painBlock(d, opt);
    } else {
      body = joinBlocks(sec.fields.map(function(f){
        var v = d.s[sec.id][f.k];
        return blockField(f.label.split('：')[0], v, opt);
      }));
    }
    L.push('## ' + sec.no + ' ' + sec.name + '\n' + (body || '【待补充】'));
  });
  return L.join('\n\n');
}

function buildChecklist(d, opt){
  var L = [];
  L.push('# 验收清单：' + (nonEmpty(d.title) ? d.title : '未命名需求'));
  L.push('## 一定要做到（M）');
  var ms = (d.s.req.items||[]).filter(function(it){ return it.lvl==='M' && nonEmpty(it.text); });
  L.push(ms.length ? ms.map(function(it){
    return '- [ ] ' + it.text + '\n      判定：' + (nonEmpty(it.assert) ? it.assert : '待补充');
  }).join('\n') : '待补充');
  var ss = (d.s.req.items||[]).filter(function(it){ return it.lvl==='S' && nonEmpty(it.text); });
  if(ss.length){
    L.push('## 应该有（S）');
    L.push(ss.map(function(it){
      return '- [ ] ' + it.text + '\n      判定：' + (nonEmpty(it.assert) ? it.assert : '待补充');
    }).join('\n'));
  }
  var cs = (d.s.req.items||[]).filter(function(it){ return it.lvl==='C' && nonEmpty(it.text); });
  if(cs.length){
    L.push('## 可以有（C，做不完可以砍）');
    L.push(cs.map(function(it){ return '- [ ] ' + it.text; }).join('\n'));
  }
  L.push('## 整体验收标准');
  L.push(blockList(d.s.done.criteria, opt, '- [ ] ') || '待补充');
  if(nonEmpty(d.s.done.verify)) L.push('## 怎么验证\n' + d.s.done.verify);
  if(nonEmpty(d.s.goal.nongoals)) L.push('## 出现这些东西就是跑偏了\n' + blockList(d.s.goal.nongoals, opt, '- [ ] 没有做：'));
  return L.join('\n\n');
}

function buildOutput(d, opt, view){
  if(view === 'spec') return buildSpec(d, opt);
  if(view === 'checklist') return buildChecklist(d, opt);
  return buildPrompt(d, opt);
}

var VAGUE = ['流畅','友好','美观','好看','简单','方便','好用','舒适','人性化','智能','合理','清晰','贴心','稳定','快','顺手'];
function vagueHit(s){
  if(/\d/.test(s)) return '';
  for(var i=0;i<VAGUE.length;i++){ if(s.indexOf(VAGUE[i]) >= 0) return VAGUE[i]; }
  return '';
}
function runCheck(d){
  var out = [];
  SECS.forEach(function(sec){
    if(secEmpty(d, sec.id)){
      out.push({ lvl:'r', sec:sec.id, text:'「' + sec.no + ' ' + sec.name + '」还是空的。这一段空着，agent 就会替你脑补。' });
    }
  });
  if(!nonEmpty(d.s.goal.nongoals)){
    out.push({ lvl:'y', sec:'goal', text:'没有写「非目标」——这是 agent 自作主张加一堆用不上的功能的最大来源。' });
  }
  if(!nonEmpty(d.s.done.criteria)){
    out.push({ lvl:'r', sec:'done', text:'没有写验收标准，于是"做完了"变成 agent 说了算。' });
  }
  if(nonEmpty(d.s.goal.goals) && lines(d.s.goal.goals).length > 3){
    out.push({ lvl:'y', sec:'goal', text:'目标写了 ' + lines(d.s.goal.goals).length + ' 条。超过 3 条通常说明这次要解决的事还没收敛。' });
  }
  var items = (d.s.req.items || []).filter(function(it){ return nonEmpty(it.text) || nonEmpty(it.assert); });
  if(!items.length){
    out.push({ lvl:'y', sec:'req', text:'功能规格里一条都没写。' });
  }
  items.forEach(function(it){
    var name = nonEmpty(it.text) ? cut(it.text) : '（只有验收、没有需求描述）';
    if(!nonEmpty(it.assert)){
      out.push({ lvl:'y', sec:'req', text:'「' + name + '」还没有验收断言——写完要能回答"做到了没有"。' });
    } else {
      var v = vagueHit(it.assert);
      if(v) out.push({ lvl:'y', sec:'req', text:'「' + name + '」的验收里出现了"' + v + '"这种感觉词。加上数字或可观察的结果，比如"手机上单手 3 步内完成一次记录"。' });
    }
  });
  var ms = items.filter(function(it){ return it.lvl === 'M' && nonEmpty(it.text); }).length;
  if(items.length > 2 && ms === items.length){
    out.push({ lvl:'y', sec:'req', text:'所有需求都被标成了 M（必须）。全是必须等于没有必须，agent 在取舍时没有东西可以砍。' });
  }
  if(!out.length){
    out.push({ lvl:'g', sec:'', text:'七段都填了，需求可验收，非目标和验收标准也都在。这份规格可以直接丢给 agent 了。' });
  }
  return out;
}
function checkStatus(list){
  if(list.some(function(x){ return x.lvl === 'r'; })) return 'r';
  if(list.some(function(x){ return x.lvl === 'y'; })) return 'y';
  return 'g';
}

function smartPanel(){
  var sm = state.smart;
  if(!sm) return '';
  if(!sm.done){
    var rows = SECS.map(function(sec){
      var arr = sm.assign[sec.id] || [];
      if(!arr.length){
        return '<div class="ck"><span class="dotm y"></span><div style="flex:1"><b>'+sec.no+' '+esc(sec.name)+'</b> · 【待补充】：没有识别到相关内容</div></div>';
      }
      return '<div class="ck"><span class="dotm g"></span><div style="flex:1"><b>'+sec.no+' '+esc(sec.name)+'</b> · 识别到 '+arr.length+' 条<br><span class="mini">'+arr.map(function(x){ return esc(cut(x.c, 28)); }).join(' · ')+'</span></div></div>';
    }).join('');
    var un = sm.unmatched.length ? '<div class="hr"></div><div class="card-h">没归类的 '+sm.unmatched.length+' 条</div><div class="mini" style="margin-bottom:8px">点一下放进对应的段落，或直接忽略。</div>'+
      sm.unmatched.map(function(c, i){
        return '<div class="reqitem"><div class="mini" style="margin-bottom:6px">'+esc(c)+'</div><div class="chips">'+
          SECS.map(function(s){ return '<button class="chip" data-send="'+s.id+'" data-idx="'+i+'">→ '+esc(s.name)+'</button>'; }).join('')+
        '</div></div>';
      }).join('') : '';
    return '<div class="hr"></div><div class="card-h">智能起步 · 粗分结果</div>'+
      '<div class="mini" style="margin-bottom:6px">这只是按关键词的粗分，确认写入之后你还要逐段改写。</div>'+ rows + un +
      '<div class="btn-row"><button class="btn primary" id="smartApply">写进七段</button><button class="btn" id="smartCancel">取消</button></div>';
  }
  return '<div class="hr"></div><div class="ck"><span class="dotm g"></span><div style="flex:1">已写入 '+sm.hit+' 条。没覆盖到的段落标着【待补充】，逐段补一下就行。</div></div>';
}

  var cls = st==='r' ? 'r' : (st==='y' ? 'o' : 'g');
  return '<div class="card tight">'+
    '<div class="spread"><div class="card-h" style="margin:0">质量自检</div><span class="badge '+cls+'">'+word+'</span></div>'+
    '<div style="margin-top:6px">'+list.map(function(x){
      return '<div class="ck"><span class="dotm '+x.lvl+'"></span><div style="flex:1">'+esc(x.text)+'</div>'+
        (x.sec ? '<button class="jump" data-jump="'+x.sec+'">去补</button>' : '')+'</div>';
    }).join('')+'</div>'+
  '</div>';
}

  if(o.stepwise) a.push('交付方式：分步交付。先给一个能跑通的最小版本，等我确认之后再继续下一步。');

function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(function(t){
    return '<button class="tab'+(state.tab===t.id?' active':'')+'" data-tab="'+t.id+'">'+
      '<svg viewBox="0 0 24 24">'+ICON[t.id]+'</svg><span>'+esc(t.label)+'</span></button>';
  }).join('');
}
function appClass(){
  var c = 'app v-' + state.tab;
  if(state.tab === 'work') c += ' mode-' + state.mode;
  return c;
}
function go(tab){
  state.tab = tab;
  var t = TABS.filter(function(x){ return x.id===tab; })[0] || TABS[0];
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSub').textContent = t.sub;
  document.getElementById('app').className = appClass();
  renderTabs();
  window.scrollTo(0,0);
  renderView();
}
function renderView(){
  var v = document.getElementById('view');
  if(state.tab === 'work'){ v.innerHTML = viewWork(); bindDetails(); }
  else if(state.tab === 'tpl') v.innerHTML = viewTpl();
  else if(state.tab === 'mine') v.innerHTML = viewMine();
  else v.innerHTML = viewOpt();
}
function renderWork(){ renderView(); }
function renderSide(){
  var side = document.querySelector('.work-side');
  if(!side) return;
  var box = document.getElementById('pvBox');
  var top = box ? box.scrollTop : 0;
  side.innerHTML = checkCard() + previewCard();
  var nb = document.getElementById('pvBox');
  if(nb) nb.scrollTop = top;
}
function bindDetails(){
  Array.prototype.forEach.call(document.querySelectorAll('details.det'), function(det){
    det.addEventListener('toggle', function(){
      state.draft.open[det.getAttribute('data-sec')] = det.open;
      saveDraft();
    });
  });
}
function setMode(m){
  state.mode = m;
  document.getElementById('app').className = appClass();
  var sw = document.querySelector('.work-switch');
  if(sw){
    Array.prototype.forEach.call(sw.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-mode') === m);
    });
  }
  renderSide();
}
function saveDraft(){ DB.set(K.draft, state.draft); }
function slug(s){
  return String(s==null?'':s).replace(/[\\/:*?"<>|\s]+/g,'-').slice(0,40) || 'spec';
}

function doSmartStart(){
  var box = document.getElementById('rawBox');
  var txt = box ? box.value : state.draft.raw;
  state.draft.raw = txt;
  saveDraft();
  if(!nonEmpty(txt)){ toast('先写一句你的粗糙需求'); return; }
  state.smart = smartStart(txt);
  renderWork();
}
function applyTemplate(id){
  var t = TEMPLATES.filter(function(x){ return x.id===id; })[0];
  if(!t) return;
  state.draft.tpl = t.id;
  state.draft.hints = {};
  SECS.forEach(function(s){
    state.draft.hints[s.id] = t.hints[s.id] || '';
    state.draft.open[s.id] = true;
  });
  if(!nonEmpty(state.draft.title)) state.draft.title = t.name.replace(/类$/,'') + '小工具';
  saveDraft();
  go('work');
  toast('已套用「' + t.name + '」，七段里多了写法提示');
}
function jumpTo(secId){
  if(state.tab !== 'work') go('work');
  if(state.mode !== 'form') setMode('form');
  state.draft.open[secId] = true;
  saveDraft();
  renderWork();
  var el = document.querySelector('details[data-sec="' + secId + '"]');
  if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function clearSeg(id){
  var sec = secById(id);
  if(!sec) return;
  if(!confirm('清空「' + sec.name + '」这一段的全部内容？')) return;
  if(id === 'req') state.draft.s.req.items = [];
  else sec.fields.forEach(function(f){ state.draft.s[id][f.k] = ''; });
  saveDraft();
  renderWork();
  toast('已清空本段');
}
function saveRecord(){
  var d = state.draft;
  if(!nonEmpty(d.title) && secEmpty(d, 'pain')){ toast('先写点内容再存'); return; }
  var rec = {
    id:uid(), title:d.title || '未命名需求', at:nowStr(), tpl:d.tpl || '',
    draft:JSON.parse(JSON.stringify(d)),
    prompt:buildPrompt(d, state.opt)
  };
  state.records.unshift(rec);
  if(state.records.length > 60) state.records.length = 60;
  DB.set(K.records, state.records);
  toast('已存进我的记录');
}
function findRec(id){
  return state.records.filter(function(x){ return x.id===id; })[0];
}
function loadRecord(id){
  var r = findRec(id);
  if(!r) return;
  state.draft = JSON.parse(JSON.stringify(r.draft));
  state.smart = null;
  saveDraft();
  go('work');
  toast('已载入「' + r.title + '」');
}
function exportAll(){
  if(!state.records.length){ toast('还没有记录'); return; }
  download('sdd-records-' + nowStr().slice(0,10) + '.json',
    JSON.stringify({ app:'SDD 需求拆解器', version:1, exportedAt:new Date().toISOString(), records:state.records }, null, 2));
}
function useDemo(id){
  var dm = DEMOS.filter(function(x){ return x.id===id; })[0];
  if(!dm) return;
  state.draft = blankDraft();
  state.draft.title = dm.title;
  state.draft.raw = dm.raw;
  state.draft.s = JSON.parse(JSON.stringify(dm.fill));
  SECS.forEach(function(s){ state.draft.open[s.id] = true; });
  state.smart = null;
  saveDraft();
  closeSheet();
  go('work');
  toast('已套用示范「' + dm.title + '」，改写它就行');
}
function secBodyText(d, sec, opt){
  if(sec.id === 'req'){
    return LEVELS.map(function(lv){
      var arr = (d.s.req.items||[]).filter(function(it){ return it.lvl===lv.k && nonEmpty(it.text); });
      if(!arr.length) return '';
      return lv.k + ' ' + lv.name + '\n' + arr.map(function(it){
        return '  - ' + it.text + '\n    验收：' + (nonEmpty(it.assert) ? it.assert : '待补充');
      }).join('\n');
    }).filter(function(x){ return x.length; }).join('\n\n');
  }
  if(sec.id === 'pain') return painBlock(d, opt);
  return joinBlocks(sec.fields.map(function(f){
    return blockField(f.label.split('：')[0], d.s[sec.id][f.k], opt);
  }));
}

/* ============================================================
   13. 弹层：怎么用 + 示范案例
   ============================================================ */
function openSheet(kind){ state.sheet = kind; renderSheet(); }
function closeSheet(){
  state.sheet = null;
  var h = document.getElementById('sheet');
  h.hidden = true;
  h.innerHTML = '';
}
function renderSheet(){
  var host = document.getElementById('sheet');
  if(!state.sheet){ host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;
  host.scrollTop = 0;
  if(state.sheet === 'help') host.innerHTML = helpSheet();
  else if(state.sheet === 'demos') host.innerHTML = demosSheet();
  else host.innerHTML = demoDetailSheet(String(state.sheet).slice(5));
}
function helpSheet(){
  return '<div class="sh-top"><b style="color:var(--ink)">怎么用</b><button class="ghost" style="margin-left:auto" data-sheet="close" aria-label="关闭">✕</button></div>'+
    '<div class="sheet-in">'+
      '<div class="card"><div class="card-h">三步</div><ol class="qlist">'+
        '<li>把脑子里那团东西原样倒进「一句话起步」，点<b>智能起步</b>。工具会按关键词粗分到七段，没覆盖到的标【待补充】。</li>'+
        '<li>从上往下逐段改。每段都有引导问题、常见错误和一段好写法；右侧「质量自检」会实时指出哪段还空着、哪条需求不可验收。</li>'+
        '<li>改完点「复制」，把整段提示词丢给 agent。要留底就点「存进我的记录」。</li>'+
      '</ol></div>'+
      '<div class="card"><div class="card-h">为什么是这个顺序</div>'+
        '<div class="card-sub">先逼出痛点，再定目标和<b>非目标</b>，然后才是用户、功能、交互、技术、验收。跳过前两段直接写功能清单，就是反复返工的根源——你写的是"要什么"，agent 需要的是"为什么做、到什么程度算够"。</div></div>'+
      '<div class="card"><div class="card-h">数据</div>'+
        '<div class="card-sub">全部存在这台设备的浏览器里（localStorage，sdd_ 前缀），不上传、不需要登录。换设备时在「我的记录」里导出 JSON。</div></div>'+
    '</div>';
}
function demosSheet(){
  return '<div class="sh-top"><b style="color:var(--ink)">示范案例</b><button class="ghost" style="margin-left:auto" data-sheet="close" aria-label="关闭">✕</button></div>'+
    '<div class="sheet-in">'+
      '<div class="card"><div class="card-sub">三份完整对照：一句粗糙的大白话，怎么被逼成一份能直接交给 agent 的规格。点进去逐段看。</div></div>'+
      DEMOS.map(function(d){
        return '<div class="tpl" data-demo="'+d.id+'">'+
          '<div class="tn">'+d.icon+' '+esc(d.title)+' <span class="badge">'+esc(d.kind)+'</span></div>'+
          '<div class="td">原始想法：'+esc(d.raw)+'</div></div>';
      }).join('')+
    '</div>';
}
function demoDetailSheet(id){
  var dm = DEMOS.filter(function(x){ return x.id===id; })[0];
  if(!dm) return demosSheet();
  var fake = { title:dm.title, raw:dm.raw, s:dm.fill, hints:{}, tpl:'' };
  var opt = { audience:'generic', detail:'std', checklist:true, stepwise:false, restate:false };
  var secs = SECS.map(function(sec){
    return '<div class="card"><div class="card-h">'+sec.no+' '+esc(sec.name)+' <span class="mini">'+esc(sec.en)+'</span></div>'+
      '<div class="mini" style="margin:4px 0 8px">这一步要逼问的：'+esc(sec.questions[0])+'</div>'+
      '<div class="eg">'+esc(secBodyText(fake, sec, opt))+'</div></div>';
  }).join('');
  return '<div class="sh-top"><button class="ghost" data-sheet="demos" aria-label="返回">‹</button>'+
    '<b style="color:var(--ink)">'+esc(dm.title)+'</b>'+
    '<button class="ghost" style="margin-left:auto" data-sheet="close" aria-label="关闭">✕</button></div>'+
    '<div class="sheet-in">'+
      '<div class="card"><div class="card-h">原始的一句话</div><div class="eg">'+esc(dm.raw)+'</div>'+
        '<div class="btn-row"><button class="btn primary" data-usedemo="'+dm.id+'">套用为我的草稿</button></div></div>'+
      secs+
      '<div class="sec-t">最后拼出来的提示词</div>'+
      '<div class="card tight"><div class="pv" style="max-height:none">'+esc(buildPrompt(fake, opt))+'</div>'+
        '<div class="btn-row"><button class="btn" data-copydemo="'+dm.id+'">复制这份提示词</button></div></div>'+
    '</div>';
}

/* ============================================================
   14. 主题
   ============================================================ */
function applyTheme(mode){
  var dark = (mode === 'dark');
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', dark ? '#0E1119' : '#4B5FCC');
}
function initTheme(){
  applyTheme(DB.get(K.theme, 'light') === 'dark' ? 'dark' : 'light');
}

/* ============================================================
   15. 事件绑定
   ============================================================ */
function onViewInput(e){
  var t = e.target;
  if(!t) return;
  var id = t.id || '';
  if(id === 'rawBox'){ state.draft.raw = t.value; saveDraft(); return; }
  if(id === 'titleBox'){ state.draft.title = t.value; saveDraft(); renderSide(); return; }
  if(id === 'recQ'){ document.getElementById('recList').innerHTML = recListHTML(t.value); return; }
  var f = t.getAttribute('data-f');
  if(f){
    var p = f.split('.');
    state.draft.s[p[0]][p[1]] = t.value;
    saveDraft(); renderSide();
    return;
  }
  var rq = t.getAttribute('data-req');
  if(rq){
    var q = rq.split('.');
    state.draft.s.req.items[+q[0]][q[1]] = t.value;
    saveDraft(); renderSide();
    return;
  }
}
function onViewClick(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var tplEl = t.closest('[data-tpl]');
  if(tplEl){ applyTemplate(tplEl.getAttribute('data-tpl')); return; }
  var b = t.closest('button');
  if(!b) return;
  var id = b.id || '';
  if(id === 'smartBtn'){ doSmartStart(); return; }
  if(id === 'smartApply'){ var n = applySmart(); renderWork(); toast('已写入 ' + n + ' 条，接着逐段改写吧'); return; }
  if(id === 'smartCancel'){ state.smart = null; renderWork(); return; }
  if(id === 'demoBtn'){ openSheet('demos'); return; }
  if(id === 'tplBtn'){ go('tpl'); return; }
  if(id === 'tplClear'){ state.draft.tpl = ''; state.draft.hints = {}; saveDraft(); renderView(); toast('已取消套用'); return; }
  if(id === 'copyBtn'){ copyText(buildOutput(state.draft, state.opt, state.pview || 'prompt'), '已复制，丢给 agent 吧'); return; }
  if(id === 'dlBtn'){ download(slug(state.draft.title || '需求规格') + '.md', buildOutput(state.draft, state.opt, state.pview || 'prompt')); return; }
  if(id === 'saveBtn'){ saveRecord(); return; }
  if(id === 'expAll'){ exportAll(); return; }
  if(id === 'clearRec'){
    if(!state.records.length){ toast('还没有记录'); return; }
    if(!confirm('会删掉全部 ' + state.records.length + ' 条记录，且无法恢复。确定吗？')) return;
    state.records = []; DB.set(K.records, state.records); renderView(); toast('已清空');
    return;
  }
  if(b.hasAttribute('data-mode')){ setMode(b.getAttribute('data-mode')); return; }
  if(b.hasAttribute('data-pv')){ state.pview = b.getAttribute('data-pv'); renderSide(); return; }
  if(b.hasAttribute('data-send')){ sendTo(b.getAttribute('data-send'), +b.getAttribute('data-idx')); return; }
  if(b.hasAttribute('data-addreq')){
    state.draft.s.req.items.push({ lvl:'M', text:'', assert:'' });
    saveDraft(); renderWork(); return;
  }
  if(b.hasAttribute('data-delreq')){
    state.draft.s.req.items.splice(+b.getAttribute('data-delreq'), 1);
    saveDraft(); renderWork(); return;
  }
  if(b.hasAttribute('data-lvl')){
    state.draft.s.req.items[+b.getAttribute('data-i')].lvl = b.getAttribute('data-lvl');
    saveDraft(); renderWork(); return;
  }
  if(b.hasAttribute('data-clearseg')){ clearSeg(b.getAttribute('data-clearseg')); return; }
  if(b.hasAttribute('data-collapse')){
    state.draft.open[b.getAttribute('data-collapse')] = false;
    saveDraft(); renderWork(); return;
  }
  if(b.hasAttribute('data-jump')){ jumpTo(b.getAttribute('data-jump')); return; }
  if(b.hasAttribute('data-recedit')){ loadRecord(b.getAttribute('data-recedit')); return; }
  if(b.hasAttribute('data-reccopy')){
    var r1 = findRec(b.getAttribute('data-reccopy'));
    if(r1) copyText(r1.prompt, '已复制「' + r1.title + '」');
    return;
  }
  if(b.hasAttribute('data-recdl')){
    var r2 = findRec(b.getAttribute('data-recdl'));
    if(r2) download(slug(r2.title) + '.md', r2.prompt);
    return;
  }
  if(b.hasAttribute('data-recdel')){
    var rid = b.getAttribute('data-recdel');
    var r3 = findRec(rid);
    if(!r3) return;
    if(!confirm('删除「' + r3.title + '」？')) return;
    state.records = state.records.filter(function(x){ return x.id !== rid; });
    DB.set(K.records, state.records);
    renderView(); toast('已删除');
    return;
  }
  if(b.hasAttribute('data-aud')){ state.opt.audience = b.getAttribute('data-aud'); saveOpt(); renderView(); return; }
  if(b.hasAttribute('data-det')){ state.opt.detail = b.getAttribute('data-det'); saveOpt(); renderView(); return; }
  if(b.hasAttribute('data-tog')){
    var k = b.getAttribute('data-tog');
    state.opt[k] = !state.opt[k];
    saveOpt(); renderView(); return;
  }
}
function saveOpt(){ DB.set(K.opt, state.opt); }
function onSheetClick(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var dEl = t.closest('[data-demo]');
  if(dEl){ openSheet('demo:' + dEl.getAttribute('data-demo')); return; }
  var b = t.closest('button');
  if(!b) return;
  if(b.hasAttribute('data-sheet')){
    var v = b.getAttribute('data-sheet');
    if(v === 'close') closeSheet(); else openSheet(v);
    return;
  }
  if(b.hasAttribute('data-usedemo')){ useDemo(b.getAttribute('data-usedemo')); return; }
  if(b.hasAttribute('data-copydemo')){
    var dm = DEMOS.filter(function(x){ return x.id === b.getAttribute('data-copydemo'); })[0];
    if(dm){
      var fake = { title:dm.title, raw:dm.raw, s:dm.fill, hints:{}, tpl:'' };
      copyText(buildPrompt(fake, { audience:'generic', detail:'std', checklist:true, stepwise:false, restate:false }), '已复制示范提示词');
    }
    return;
  }
}

/* ============================================================
   16. 启动
   ============================================================ */
function init(){
  initTheme();
  var blank = blankDraft();
  var saved = DB.get(K.draft, null);
  state.draft = (saved && saved.s) ? saved : blank;
  SECS.forEach(function(s){
    if(!state.draft.s[s.id]) state.draft.s[s.id] = blank.s[s.id];
  });
  if(!state.draft.s.req) state.draft.s.req = { items:[] };
  if(!state.draft.s.req.items) state.draft.s.req.items = [];
  if(!state.draft.hints) state.draft.hints = {};
  if(!state.draft.open) state.draft.open = {};
  if(typeof state.draft.title !== 'string') state.draft.title = '';
  if(typeof state.draft.raw !== 'string') state.draft.raw = '';
  if(typeof state.draft.tpl !== 'string') state.draft.tpl = '';

  var o = DB.get(K.opt, {});
  state.opt = {
    audience:o.audience || OPT_DEFAULT.audience,
    detail:o.detail || OPT_DEFAULT.detail,
    checklist:o.checklist === undefined ? OPT_DEFAULT.checklist : !!o.checklist,
    stepwise:!!o.stepwise,
    restate:!!o.restate
  };
  state.records = DB.get(K.records, []);
  state.pview = 'prompt';

  document.getElementById('view').addEventListener('input', onViewInput);
  document.getElementById('view').addEventListener('click', onViewClick);
  document.getElementById('sheet').addEventListener('click', onSheetClick);
  document.getElementById('tabbar').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.tab') : null;
    if(b) go(b.getAttribute('data-tab'));
  });
  document.getElementById('helpBtn').onclick = function(){ openSheet('help'); };
  document.getElementById('themeBtn').onclick = function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    DB.set(K.theme, next);
  };
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && state.tab === 'work'){
      e.preventDefault();
      copyText(buildOutput(state.draft, state.opt, state.pview || 'prompt'), '已复制，丢给 agent 吧');
    }
    if(e.key === 'Escape' && state.sheet) closeSheet();
  });

  go('work');
  if(!DB.get(K.help, false)){ DB.set(K.help, true); openSheet('help'); }
}
init();

})();
</script>
